         US-ordered 08/15/2026 must fail loudly, not silently become
         2026-15-08 and sort itself into the wrong year's worth of data. */
      var dd = +m[1], mm = +m[2];
      if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return '';
      return m[3] + '-' + m[2] + '-' + m[1];
    }
    var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (iso && +iso[2] >= 1 && +iso[2] <= 12 && +iso[3] >= 1 && +iso[3] <= 31) return s;
    return '';
  }

  /**
   * A cheap, deterministic fingerprint of a file's contents.
   *
   * Not a security hash — a 32-bit FNV-1a over the serialised JSON plus its
   * length. Its only job is to answer "have I seen this exact file before?"
   * so the preview can say so out loud. Re-importing is already harmless
   * (records match on id and content and nothing is added), but "harmless"
   * is not something a reader can see, and the fear of duplicating is what
   * stops a file being imported at all.
   */
  function signature(parsed) {
    var s;
    try { s = JSON.stringify(parsed); } catch (e) { return null; }
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return s.length.toString(36) + '-' + h.toString(36);
  }

  /** Has this exact file been imported before? Returns the earlier import. */
  function priorImport(store, parsed) {
    var sig = signature(parsed);
    if (!sig) return null;
    var seen = arr(store.db.meta && store.db.meta.imports);
    for (var i = seen.length - 1; i >= 0; i--) if (seen[i].signature === sig) return seen[i];
    return null;
  }

  /* ── Which file is this? ───────────────────────────────────── */

  function detect(p) {
    if (!p || typeof p !== 'object') return null;
    if (p.app === 'poker-hub') return 'hub';
    if (p.app === 'edb-hand-recall') return 'hand-recall';
    if (p.app === 'home-game-tracker') return 'tracker';
    if (p.app === 'Poker ledger') return 'ledger';
    /* The Poker Coach's own schema — a single hand record, a bundle of
       them, or a folder of `YYYY-MM-DD-<handid>.json` read in one go. */
    /* Reads the coach wrote about people. Checked before hands, because
       both come from the same app and say so. */
    if (Profile.isBundle(p)) return 'profiles';
    if (p.app === 'poker-coach' || p.schema === 'edb-hand-record/1') return 'coach';
    if (CI.records(p.hands || p.records || p).length) return 'coach';
    /* Shape sniffing, for a file whose header was lost in an edit. */
    if (arr(p.roster).length && arr(p.sessions).length) return 'hand-recall';
    if (p.state && arr(p.state.players).length) return 'tracker';
    if (arr(p.sessions).length && arr(p.ledger).length) return 'ledger';
    if (arr(p.players).length && arr(p.events).length) return 'tracker';
    return null;
  }

  /* ── Hero ──────────────────────────────────────────────────── */

  /** `heroName` is a comma-separated alias list — "Ernest, EDB". */
  function heroAliases(settings) {
    return String((settings && settings.heroName) || '')
      .split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function looksLikeHero(name, settings) {
    var al = heroAliases(settings);
    for (var i = 0; i < al.length; i++) if (Ident.sameName(al[i], name)) return true;
    return false;
  }

  /* ── Session matching — one night, one session ─────────────── */

  /**
   * A night is identified by its date and its venue. Same date and same
   * venue is the same night; same date with a blank venue on one side is
   * the same night only when exactly one candidate exists. Anything else
   * becomes a question rather than a guess — several pastes on one
   * calendar day is precisely what broke the ledger's re-link before.
   */
  function matchSession(sessions, date, venue) {
    var iso = toISO(date);
    if (!iso) return { match: null, candidates: [] };
    var sameDay = sessions.filter(function (s) { return toISO(s.date) === iso; });
    if (!sameDay.length) return { match: null, candidates: [] };
    var v = Ident.norm(venue);
    if (v) {
      var exact = sameDay.filter(function (s) { return Ident.norm(s.location) === v; });
      if (exact.length === 1) return { match: exact[0], candidates: [] };
      if (exact.length > 1) return { match: null, candidates: exact };
    }
    if (sameDay.length === 1) return { match: sameDay[0], candidates: [] };
    return { match: null, candidates: sameDay };
  }

  /* ── Plan ──────────────────────────────────────────────────── */

  function blankPlan(kind) {
    return {
      kind: kind,
      importId: null,
      ok: true,
      summary: {},
      newPlayers: [], renamedPlayers: [], matchedPlayers: [],
      newSessions: [], matchedSessions: [], mergedSessions: [],
      newHands: 0, duplicateHands: 0,
      newLedgerRows: 0, updatedLedgerRows: 0, keptLedgerRows: 0,
      warnings: [],
      questions: [],
      apply: null
    };
  }

  function ask(plan, q) { plan.questions.push(q); plan.ok = false; }

  /**
   * The poker ledger's own key for a hand — date, hand number, the hero's
   * cards and the big blind. Two files can carry the same hand under two
   * ids (Hand recall exports it, the ledger stores its own copy), so the
   * id alone is not identity. Ernest's real workflow guarantees this
   * collision: he logs in Hand recall and uploads the good ones.
   */
  function handKey(h, fallbackDate) {
    return [toISO(h.date || fallbackDate), h.no, arr(h.heroCards).join(''), h.bb].join('|');
  }

  /**
   * A name for a hand that arrived without one.
   *
   * Ernest, 08/09/2026: *"when i record a hand it should have a name
   * attached to it."* Hands recorded in the hub name themselves; a hand
   * imported from Hand recall or the old ledger has only a number, and a
   * list of two hundred rows reading "Hand 7" is a list nobody can search.
   *
   * The rule is the recorder's: the people who actually played it — chips
   * they chose to put in, or cards still live when a board card landed —
   * him first, then the pot.
   */
  function nameHand(h) {
    var byName = String(h && h.name || '').trim();
    if (byName) return byName;
    /* A file is not a promise. A null in either list used to reach this
       from the ledger path — which never otherwise touches an action —
       and threw a raw TypeError out of `commit` halfway through the
       import, with the store already part-written. */
    var players = arr(h && h.players).filter(Boolean);
    if (!players.length) return '';
    var acts = arr(h && h.actions).filter(Boolean);
    var sawFlop = !!(h.board && arr(h.board.flop).length);
    var played = players.filter(function (p) {
      var voluntary = acts.some(function (a) {
        return a.seat === p.seat &&
          (a.action === 'call' || a.action === 'bet' || a.action === 'raise' || a.action === 'allin');
      });
      if (voluntary) return true;
      if (!sawFlop) return false;
      return !acts.some(function (a) {
        return a.seat === p.seat && a.action === 'fold' && a.street === 'preflop';
      });
    });
    if (played.length < 2) played = players.filter(function (p) { return !p.folded || p.invested; });
    if (played.length < 2) played = players;
    var hero = [], rest = [];
    played.forEach(function (p) {
      if (p.hero) hero.push('You'); else if (p.name) rest.push(p.name);
    });
    var names = hero.concat(rest);
    if (!names.length) return '';
    var label = names.slice(0, 3).join(' v ');
    if (names.length > 3) label += ' +' + (names.length - 3);
    return h.pot > 0 ? label + ' · ' + Math.round(h.pot).toLocaleString('en-US') : label;
  }

  /**
   * Does an incoming session describe a night the hub already has?
   *
   * Ernest's ruling, 21/08/2026: *"it should merge if the money, location,
   * date agrees, and question if ambiguity."* A blank on either side is
   * not a disagreement — it is a gap the merge fills. Two different
   * figures for one night is ambiguity, and ambiguity asks.
   *
   * Returns { match, candidates, conflict } — `match` is safe to merge
   * without asking; `candidates` need a question.
   */
  function matchLedgerSession(store, s) {
    var iso = toISO(s.date);
    if (!iso) return { match: null, candidates: [] };
    var sameDay = store.db.sessions.filter(function (x) { return toISO(x.date) === iso; });
    if (!sameDay.length) return { match: null, candidates: [] };

    var v = Ident.norm(s.location || s.venue);
    var byVenue = sameDay.filter(function (x) {
      var xv = Ident.norm(x.location);
      return !v || !xv || xv === v;         /* blank on either side is not a clash */
    });
    if (!byVenue.length) return { match: null, candidates: [] };   /* a different game that night */

    var agree = byVenue.filter(function (x) { return moneyAgrees(x, s); });
    if (agree.length === 1) return { match: agree[0], candidates: [] };
    /* Nothing agrees on money, or more than one does — Ernest decides. */
    return { match: null, candidates: byVenue, conflict: agree.length ? 'ambiguous' : 'money' };
  }

  /** The row this person already has for this night, if any. */
  function existingRow(store, sessionId, playerId, idMap) {
    var pid = (idMap && idMap[playerId]) || playerId;
    for (var i = 0; i < store.db.ledger.length; i++) {
      var r = store.db.ledger[i];
      if (r.sessionId === sessionId && r.playerId === pid) return r;
    }
    return null;
  }

  /** Equal, or one side simply has not been told yet. */
  function moneyAgrees(a, b) {
    var ha = Layers.hasSettledMoney(a), hb = Layers.hasSettledMoney(b);
    if (!ha || !hb) return true;
    return num(a.buyIn) === num(b.buyIn) &&
      num(a.cashOut) === num(b.cashOut) &&
      num(a.expenses) === num(b.expenses);
  }

  function plan_homelessText(n) {
    return n + ' hand' + (n === 1 ? '' : 's') + ' in this file belong' + (n === 1 ? 's' : '') +
      ' to no night. Every hand lives in a night here, so ' + (n === 1 ? 'it gets' : 'they get') +
      ' one made from ' + (n === 1 ? 'its' : 'their') + ' own date — with no money on it, so it ' +
      'stays out of every rate.';
  }

  function currencyOf(store) {
    return (store.db.settings && store.db.settings.baseCurrency) || 'HKD';
  }

  /** A live seat names its person by id. A deleted one no longer counts. */
  function byPlayerId(store, id) {
    if (!id) return null;
    for (var i = 0; i < store.db.players.length; i++) {
      var p = store.db.players[i];
      if (p.id === id && !p.deleted) return p;
    }
    return null;
  }

  /* ── 1. Home game tracker ──────────────────────────────────── */

  /**
   * One night's table. This is the settled layer's only source: the
   * timeline gives the date and the hours, the roster gives every
   * player's counted buy-in and cash-out.
   */
  function planTracker(store, parsed, opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var plan = blankPlan('tracker');
    plan.importId = uid('imp', now);

    var state = Settle.normalise(parsed);
    if (!state) {
      plan.ok = false;
      plan.warnings.push('That file is not a home game session. Pick a .json exported from the tracker.');
      return plan;
    }

    var startedAt = Settle.sessionStart(state);
    var endedAt = Settle.sessionEnd(state);
    var date = startedAt ? Settle.isoDate(startedAt) : (opts.date || '');
    /* Hours come free here — the first buy-in to the last event. This is
       the number the ledger has never had, and the reason every imported
       session was excluded from every rate. */
    var hours = (startedAt && endedAt && endedAt > startedAt)
      ? Math.round(((endedAt - startedAt) / 3600000) * 100) / 100
      : null;
    /* A live night knows better than its own timeline: it has pause
       segments, and a break for food is not poker. When the caller has
       counted the hours, take theirs. */
    if (opts.hours != null) hours = opts.hours;
    /* A night logged by hand with the hours left blank has a made-up
       timeline (a minute apart), not a short session: it carries no hours
       and stays out of the rates until they are filled in. */
    if (opts.hoursUnknown) hours = null;

    var venue = opts.venue != null ? opts.venue : (store.db.settings.defaultLocation || '');
    var currency = opts.currency || store.db.settings.defaultCurrency || 'HKD';

    /* Who is Ernest? Explicit choice, never a fall-through default. */
    var heroIdx = opts.heroIndex;
    if (heroIdx == null) {
      var hits = [];
      state.players.forEach(function (p, i) { if (looksLikeHero(p.name, store.db.settings)) hits.push(i); });
      if (hits.length === 1) heroIdx = hits[0];
      else if (hits.length > 1) {
        ask(plan, {
          id: 'hero', kind: 'pick-hero',
          text: 'More than one row looks like you. Which one is it?',
          options: state.players.map(function (p, i) { return { value: i, label: p.name }; })
        });
      } else {
        ask(plan, {
          id: 'hero', kind: 'pick-hero',
          text: 'None of these rows looks like you — your name in Settings is "' +
            (store.db.settings.heroName || '') + '". Which row is you?',
          options: state.players.map(function (p, i) { return { value: i, label: p.name }; })
            .concat([{ value: -1, label: 'Nobody in this list is me' }])
        });
      }
    }

    var match = matchSession(store.db.sessions, date, venue);
    if (match.candidates.length) {
      ask(plan, {
        id: 'session', kind: 'pick-session',
        text: 'More than one session is already logged for ' + date + '. Which night is this?',
        options: match.candidates.map(function (s) {
          return { value: s.id, label: (s.location || 'no venue') + ' · ' + (s.stakes || '') };
        }).concat([{ value: '', label: 'A new session' }])
      });
    }
    var target = opts.sessionId ? store.sessionById(opts.sessionId) : match.match;

    /* Preview the roster — every name, and whether it is new or known.
       A live night has already resolved each seat to a person, so its ids
       win over a name lookup: the name on the seat can be a spelling this
       person has never been recorded under and still be the right man. */
    var pids = opts.playerIds || [];
    var preview = state.players.map(function (p, i) {
      var canon = Ident.canonicalName(p.name);
      var forced = pids[i] ? byPlayerId(store, pids[i]) : null;
      var existing = forced || Ident.find(store.db.players, p.name);
      return {
        index: i,
        raw: p.name,
        name: forced ? forced.name : canon.name,
        forcedId: forced ? forced.id : null,
        renamedFrom: canon.renamedFrom,
        buyIn: Settle.totalBuyIn(p),
        cashOut: p.cashedOut ? num(p.cashout) : null,
        net: p.cashedOut ? num(p.cashout) - Settle.totalBuyIn(p) : null,
        hero: heroIdx === i,
        existingId: existing ? existing.id : null
      };
    });

    /* Re-importing the same night must not append a second set of rows.
       A ledger row is identified by (session, player) — one person has one
       result per night — so an existing row is updated in place. Without
       this, importing a tracker file twice doubles every opponent's money
       and the night stops reconciling to zero. */
    preview.forEach(function (r) {
      if (r.hero) return;
      r.existingRowId = null;
      if (target && r.existingId) {
        var hit = store.db.ledger.filter(function (row) {
          return row.sessionId === target.id && row.playerId === r.existingId;
        })[0];
        if (hit) r.existingRowId = hit.id;
      }
      if (r.existingId) plan.matchedPlayers.push(r); else plan.newPlayers.push(r);
      if (r.renamedFrom) plan.renamedPlayers.push(r);
    });
    plan.updatedLedgerRows = preview.filter(function (r) { return !r.hero && r.existingRowId; }).length;
    if (plan.updatedLedgerRows) {
      plan.warnings.push(plan.updatedLedgerRows + ' of these players already have a result recorded ' +
        'for this night. Those rows are corrected in place rather than added a second time.');
    }

    var seated = state.players.filter(function (p) { return !p.cashedOut; });
    if (seated.length) {
      plan.warnings.push(seated.length + ' player' + (seated.length === 1 ? '' : 's') +
        ' had not cashed out when this file was saved, so the night is not settled. ' +
        'It will be logged with the buy-ins it has, and excluded from every rate until it is.');
    }
    if (hours == null) {
      plan.warnings.push('This session has no timeline, so it carries no hours and stays out of the rates.');
    }

    plan.summary = {
      date: date, venue: venue, currency: currency, hours: hours,
      players: state.players.length,
      pot: Settle.totals(state).buyins,
      tip: Settle.totals(state).tip,
      dealerName: opts.dealerName || '',
      settled: !seated.length,
      attachesTo: target ? target.id : null
    };
    plan.rows = preview;
    plan.newLedgerRows = preview.filter(function (r) { return !r.hero && !r.existingRowId; }).length;
    if (!target) plan.newSessions.push({ date: date, venue: venue });
    else plan.matchedSessions.push({ id: target.id, date: target.date, venue: target.location });

    plan.apply = function () {
      var t = now;
      var session = target;
      var heroRow = heroIdx >= 0 ? preview[heroIdx] : null;

      if (!session) {
        session = {
          id: uid('s', t), seq: t,
          date: date, startTime: '', endTime: '',
          variant: 'NLHE', stakes: opts.stakes || store.db.settings.defaultStakes || '',
          currency: currency, location: venue,
          buyIn: null, cashOut: null, expenses: 0, rake: 0,
          hours: hours, gameRating: '', notes: '', liveNotes: [], villains: [],
          source: opts.source || 'tracker', tracker: null, updatedAt: t
        };
        Layers.asSettled(session);
        store.db.sessions.push(session);
      }
      /* The tracker state rides along on the session: the timeline is what
         dates the night, and it is the only record of rebuy timing — the
         strongest unused data in the project. */
      session.tracker = clone(state);
      /* The dealer, named, with the tip the pot paid — so the night's page
         can show where the money that is in nobody's net went. */
      if (state.dealer && (num(state.tip) > 0 || opts.dealerName)) {
        session.dealer = {
          name: String(opts.dealerName || (session.dealer && session.dealer.name) || ''),
          tip: num(state.tip) || 0
        };
      }
      if (hours != null && session.hours == null) session.hours = hours;
      if (!session.location && venue) session.location = venue;
      if (!session.stakes && opts.stakes) session.stakes = opts.stakes;
      /* Reads taken at the table ride onto the night they were taken at.
         Physical tells are the one class that cannot be reconstructed
         afterwards, so losing them here would lose them for good. */
      if (opts.liveNotes && opts.liveNotes.length) {
        var have = {};
        arr(session.liveNotes).forEach(function (n) { have[n.t + '|' + n.text] = true; });
        session.liveNotes = arr(session.liveNotes).concat(
          opts.liveNotes.filter(function (n) { return !have[n.t + '|' + n.text]; })
        );
      }
      if (heroRow) {
        session.buyIn = heroRow.buyIn;
        session.cashOut = heroRow.cashOut;
        Layers.asSettled(session);
      }
      session.source = session.source || 'tracker';
      store.touch(session, t);

      var villains = session.villains || [];
      preview.forEach(function (r) {
        if (r.hero) return;
        var p = r.forcedId ? byPlayerId(store, r.forcedId) : null;
        if (p) {
          /* The spelling that was typed at the table stays matchable next
             time, without displacing the stored one. */
          if (!Ident.sameName(r.raw, p.name)) Ident.addAlias(p, r.raw);
        } else {
          p = Ident.ensure(store.db.players, r.raw, { now: t }).player;
        }
        if (!p) return;
        if (villains.indexOf(p.id) === -1) villains.push(p.id);

        /* One person, one result per night: update the row if it is there. */
        var row = null;
        for (var q = 0; q < store.db.ledger.length; q++) {
          var cand = store.db.ledger[q];
          if (cand.sessionId === session.id && cand.playerId === p.id) { row = cand; break; }
        }
        if (!row) {
          row = { id: uid('le', t), playerId: p.id, sessionId: session.id };
          store.db.ledger.push(row);
        }
        row.buyIn = r.buyIn;
        row.cashOut = r.cashOut;
        row.net = r.net;
        row.source = 'tracker';
        row.importId = plan.importId;
        row.updatedAt = t;
        Layers.asSettled(row);
      });
      session.villains = villains;

      store.saveSessions(); store.savePlayers(); store.saveLedger();
      return {
        kind: 'tracker', sessionId: session.id,
        /* Opponents, not everyone at the table — the hero has no dossier,
           his money lives on the session. */
        players: preview.length - (heroRow ? 1 : 0),
        ledgerRows: plan.newLedgerRows,
        updatedLedgerRows: plan.updatedLedgerRows,
        hours: hours, settled: plan.summary.settled
      };
    };

    return plan;
  }

  /* ── 2. Hand recall ────────────────────────────────────────── */

  /**
   * Roster and hands. Carries no counted money at all, so a session that
   * exists only because Hand recall mentioned it gets no buy-in and no
   * cash-out, and is honestly excluded from the rates rather than being
   * given a number the file never had.
   */
  function planHandRecall(store, parsed, opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var plan = blankPlan('hand-recall');
    plan.importId = uid('imp', now);

    var roster = arr(parsed.roster);
    var sessions = arr(parsed.sessions);
    if (!sessions.length) {
      plan.ok = false;
      plan.warnings.push('That Hand recall file contains no sessions.');
      return plan;
    }

    /* Roster preview — who is new, who already has a dossier, who gets
       renamed by the identity rules. */
    var rosterPlan = roster.map(function (r) {
      var canon = Ident.canonicalName(r.name);
      var byExt = Ident.findByExtId(store.db.players, r.id);
      var byName = byExt || Ident.find(store.db.players, r.name);
      return {
        extId: r.id, raw: r.name, name: canon.name, renamedFrom: canon.renamedFrom,
        hero: !!r.isHero, existingId: byName ? byName.id : null
      };
    });
    rosterPlan.forEach(function (r) {
      if (r.hero) return;
      if (r.existingId) plan.matchedPlayers.push(r); else plan.newPlayers.push(r);
      if (r.renamedFrom) plan.renamedPlayers.push(r);
    });

    /* Dedupe on the poker ledger's key, so a hand that arrives from both
       the JSON and a text paste is stored once. */
    function handKey(h, s) {
      return [toISO(h.date || s.date), h.no, (h.heroCards || []).join(''), h.bb].join('|');
    }
    var known = {};
    store.hands.forEach(function (h) {
      known[h.id] = true;
      known[[toISO(h.date), h.no, (h.heroCards || []).join(''), h.bb].join('|')] = true;
    });

    var sessionPlans = [];
    sessions.forEach(function (s) {
      var date = toISO(s.date);
      var venue = s.venue || '';
      var m = matchSession(store.db.sessions, date, venue);
      if (m.candidates.length && !(opts.sessionMap || {})[s.id]) {
        ask(plan, {
          id: 'session:' + s.id, kind: 'pick-session',
          text: 'More than one session is already logged for ' + date +
            '. Which night do these ' + arr(s.hands).length + ' hands belong to?',
          options: m.candidates.map(function (c) {
            return { value: c.id, label: (c.location || 'no venue') + ' · ' + (c.stakes || '') };
          }).concat([{ value: '', label: 'A new session' }])
        });
      }
      var forced = (opts.sessionMap || {})[s.id];
      var target = forced ? store.sessionById(forced) : m.match;

      var fresh = 0, dupes = 0;
      arr(s.hands).forEach(function (h) {
        if (known[h.id] || known[handKey(h, s)]) dupes++; else fresh++;
      });
      plan.newHands += fresh;
      plan.duplicateHands += dupes;

      sessionPlans.push({ src: s, date: date, venue: venue, target: target, fresh: fresh, dupes: dupes });
      if (target) plan.matchedSessions.push({ id: target.id, date: date, venue: venue, hands: fresh });
      else plan.newSessions.push({ date: date, venue: venue, hands: fresh });
    });

    if (plan.newSessions.length) {
      plan.warnings.push(plan.newSessions.length + ' night' + (plan.newSessions.length === 1 ? '' : 's') +
        ' here have no money recorded anywhere yet. They will be logged for the hands, ' +
        'and stay out of every rate until a tracker file or a cash-out is added.');
    }

    plan.summary = {
      sessions: sessions.length, hands: plan.newHands, duplicates: plan.duplicateHands,
      roster: roster.length
    };

    plan.apply = function () {
      var t = now, idMap = {}, freshHands = [];

      /* The hero gets no dossier. `players` means opponents here — it is
         what the Players tab lists and what a villain id points at — and
         the poker ledger has always identified Ernest by the heroName
         setting rather than by a roster row. His seat in a hand is already
         marked `hero`, so nothing is lost by leaving his playerId null. */
      roster.forEach(function (r) {
        if (r.isHero) return;
        var res = Ident.ensure(store.db.players, r.name, { now: t, extId: r.id });
        if (res.player) idMap[r.id] = res.player.id;
      });

      sessionPlans.forEach(function (sp) {
        var s = sp.src, session = sp.target;
        if (!session) {
          session = {
            id: uid('s', t), seq: t,
            date: sp.date, startTime: '', endTime: '',
            variant: 'NLHE', stakes: (s.sb && s.bb) ? (s.sb + '/' + s.bb) : '',
            currency: currencyCode(s.currency) || store.db.settings.defaultCurrency,
            location: sp.venue,
            /* No counted money here, and none invented. */
            buyIn: null, cashOut: null, expenses: 0, rake: 0,
            hours: null, gameRating: '', notes: '', liveNotes: [], villains: [],
            source: 'hand-recall', updatedAt: t
          };
          store.db.sessions.push(session);
        }
        if (!session.stakes && s.sb && s.bb) session.stakes = s.sb + '/' + s.bb;
        /* The tracker file carries no venue — it is a table, not a diary.
           Hand recall does. Fill a blank rather than leaving the night
           unlabelled, but never overwrite one already recorded. */
        if (!session.location && sp.venue) session.location = sp.venue;
        store.touch(session, t);

        var villains = session.villains || [];
        arr(s.seats).forEach(function (seat) {
          var pid = idMap[seat.playerId];
          if (pid && villains.indexOf(pid) === -1) villains.push(pid);
        });

        arr(s.hands).forEach(function (h) {
          if (known[h.id] || known[handKey(h, s)]) return;
          var rec = clone(h);
          rec.sessionId = session.id;
          rec.date = toISO(rec.date || s.date);
          rec.venue = rec.venue || sp.venue;
          rec.source = 'hand-recall';
          rec.importId = plan.importId;
          rec.name = nameHand(rec);
          /* Hand recall's own roster ids are meaningless outside it —
             remap to hub player ids so a dossier can find its hands. */
          arr(rec.players).forEach(function (pl) {
            if (!pl.playerId) return;
            if (idMap[pl.playerId]) {
              pl.playerId = idMap[pl.playerId];
              if (villains.indexOf(pl.playerId) === -1 && !pl.hero) villains.push(pl.playerId);
            } else {
              /* The hero, or a roster entry this bundle did not carry. A
                 foreign app's id must never survive into the store — it
                 would point at nothing and quietly break the dossier. */
              pl.playerId = null;
            }
          });
          arr(rec.actions).forEach(function (a) {
            if (!a.playerId) return;
            a.playerId = idMap[a.playerId] || null;
          });
          known[rec.id] = true;
          known[handKey(rec, s)] = true;
          freshHands.push(rec);
        });

        session.villains = villains;
      });

      store.saveSessions(); store.savePlayers();
      return store.putHands(freshHands).then(function (n) {
        return {
          kind: 'hand-recall', hands: n, duplicates: plan.duplicateHands,
          sessions: sessionPlans.length, players: Object.keys(idMap).length
        };
      });
    };

    return plan;
  }

  /* ── The Poker Coach ───────────────────────────────────────── */

  /**
   * **What makes two records the same hand.**
   *
   * The ids do not: the hub calls it
   * `txt-2026-08-25-40-AcQd--6000-12500-…` and the Coach calls it
   * `hg-20260825-aq`. The hand number does not either — every Coach record
   * is hand 1 of its own file. What does is the night, the board and the
   * final pot: two different hands on one night with the same five cards
   * and the same pot is not a thing that happens.
   *
   * Verified rather than assumed: across his 26 hub hands and the 55 in
   * the archive this key collides with nothing on either side and pairs
   * all 26 twins, nets agreeing on every one.
   */
  function coachKey(h) {
    var b = h && h.board ? h.board : {};
    var cards = arr(b.flop).concat(arr(b.turn)).concat(arr(b.river));
    return [toISO(h.date), cards.join(''), h.pot].join('|');
  }

  /**
   * The review the Coach wrote, kept apart from the hand it is about.
   *
   * The split is the whole architecture: the **hand** is verifiable — it
   * replays or it does not — and the **review** is judgement, which is
   * falsifiable and expected to move. Nothing in here may contradict the
   * hand, because nothing in here describes the hand.
   */
  function reviewOf(rec) {
    var r = rec.review || {};
    var out = {
      grade: r.grade || null,
      tags: arr(r.tags).slice(),
      rulesBroken: arr(r.rulesBroken).slice(),
      verdict: r.verdict || '',
      deviation: r.deviation || '',
      note: r.note || '',
      reviewedOn: r.reviewedOn || null,
      document: r.document || r.rangeMap || null,
      source: 'poker-coach'
    };
    var any = out.grade || out.tags.length || out.rulesBroken.length ||
      out.verdict || out.deviation || out.note;
    return any ? out : null;
  }

  /**
   * One read per villain the record wrote a note about — dated, and
   * carrying the cards when the man actually tabled them.
   *
   * `shown` is deliberately separate from `cards`: `cards` is two real
   * cards the engine can evaluate, `shown` is shorthand he reported
   * ("AKo") where the suits were never known. Neither is ever guessed
   * into the other.
   */
  function readsOf(rec, resolve) {
    return arr(rec.villains).filter(function (v) { return v && v.note; })
      .map(function (v) {
        return {
          name: resolve ? resolve(v.name, rec.date) : (v.name || ''),
          position: v.position || '',
          cards: v.cards || null,
          shown: v.shown || null,
          note: v.note,
          on: rec.date,
          handId: rec.handId,
          source: 'poker-coach'
        };
      });
  }

  /**
   * Plan an import of `edb-hand-record/1`.
   *
   * **Every hand goes through the same gate the reconciler prints.** A
   * record becomes a hand only by replaying through the engine and
   * agreeing with the two figures it states independently of its own
   * actions — the pot at each street end and his net. A hand that does
   * not reconcile is refused and named, never imported quietly.
   */
  function planCoach(store, parsed, opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var plan = blankPlan('coach');
    plan.importId = uid('imp', now);

    var bundle = parsed && (parsed.hands || parsed.records) ? (parsed.hands || parsed.records) : parsed;
    var recs = CI.records(bundle);
    if (!recs.length) {
      plan.ok = false;
      plan.warnings.push('That file carries no hand records.');
      return plan;
    }

    /* **Aliases only ever come from the file.** Nothing here decides that
       two spellings are the same person — that is his call, and the file
       is where his call is written down. */
    var aliasSpec = (parsed && (parsed.aliases || (parsed.names && parsed.names.map))) || {};
    var resolve = CI.resolver(aliasSpec);
    /* The roster is offered to the reader as vocabulary, so a name that
       acts in the prose but earned no villain row is still recognised.
       Recognition only: a name still has to be placed by the record's own
       position or spelling before it reaches a seat. */
    var roster = store.db.players.map(function (p) { return p.name; });
    var names = CI.vocabulary(recs, roster);

    var read = CI.readAll(recs, { names: names, resolve: resolve });

    var good = [], refused = [];
    read.forEach(function (r) { (r.ok ? good : refused).push(r); });
    refused.forEach(function (r) {
      plan.warnings.push(r.rec.handId + ' does not reconcile and will not be imported — ' +
        r.why.join('; '));
    });

    /* What is already here, by the key that actually identifies a hand. */
    var byKey = {}, byId = {};
    store.hands.forEach(function (h) { byKey[coachKey(h)] = h; byId[h.id] = h; });

    /* Who the file names, against the roster. Exact spelling or an alias
       he wrote — never a near match. */
    var wanted = {};
    good.forEach(function (r) {
      arr(r.built.seats).forEach(function (s) {
        if (!s.name || s.hero) return;
        if (looksLikeHero(s.name, store.db.settings)) return;
        wanted[s.name] = true;
      });
    });
    var playerPlan = Object.keys(wanted).sort().map(function (nm) {
      var ex = Ident.find(store.db.players, nm);
      return { name: nm, existingId: ex ? ex.id : null };
    });
    playerPlan.forEach(function (p) {
      if (p.existingId) plan.matchedPlayers.push(p); else plan.newPlayers.push(p);
    });

    /* Which night each hand lands on. Every one of his archive nights has
       a session already; a date with none is logged rather than dropped,
       and stays out of every rate until money is added. */
    var nightPlans = {}, replaced = [], fresh = [];
    good.forEach(function (r) {
      var rec = r.rec;
      var date = toISO(rec.date);
      if (!nightPlans[date]) {
        var m = matchSession(store.db.sessions, date, '');
        if (m.candidates.length && !(opts.sessionMap || {})[date]) {
          ask(plan, {
            id: 'session:' + date, kind: 'pick-session',
            text: 'More than one night is logged for ' + date + '. Which one do these hands belong to?',
            options: m.candidates.map(function (c) {
              return { value: c.id, label: (c.location || 'no venue') + ' · ' + (c.stakes || '') };
            }).concat([{ value: '', label: 'A new session' }])
          });
        }
        var forced = (opts.sessionMap || {})[date];
        nightPlans[date] = {
          date: date, target: forced ? store.sessionById(forced) : m.match, hands: 0, replaced: 0
        };
      }
      var np = nightPlans[date];
      np.hands++;
      var twin = byKey[coachKey(HR.handRecord(r.built.h))];
      if (twin) { np.replaced++; replaced.push({ rec: rec, twin: twin, built: r.built }); }
      else fresh.push({ rec: rec, built: r.built });
    });

    var nights = Object.keys(nightPlans).sort().map(function (d) { return nightPlans[d]; });
    nights.forEach(function (np) {
      if (np.target) {
        plan.matchedSessions.push({ id: np.target.id, date: np.date, venue: np.target.location || '', hands: np.hands });
      } else {
        plan.newSessions.push({ date: np.date, venue: '', hands: np.hands });
      }
    });
    if (plan.newSessions.length) {
      plan.warnings.push(plan.newSessions.length + ' night' + (plan.newSessions.length === 1 ? '' : 's') +
        ' here have no money recorded yet. They will be logged for the hands and stay out of ' +
        'every rate until a cash-out is added.');
    }

    plan.newHands = fresh.length;
    plan.replacedHands = replaced.length;
    plan.refusedHands = refused.length;
    plan.duplicateHands = 0;
    var reads = 0, reviews = 0, fittedIds = [], reorderedIds = [];
    good.forEach(function (r) {
      reads += readsOf(r.rec, resolve).length;
      if (reviewOf(r.rec)) reviews++;
      if (r.built.fitted) fittedIds.push(r.rec.handId);
      if (r.built.reordered.length) reorderedIds.push(r.rec.handId);
    });
    plan.summary = {
      records: recs.length, reconciled: good.length, refused: refused.length,
      hands: fresh.length, replaced: replaced.length,
      reads: reads, reviews: reviews,
      nights: nights.length, players: playerPlan.length,
      fitted: fittedIds, reordered: reorderedIds
    };

    /* **Said out loud, not buried.** These are the two places a wrong
       reading could have landed on a right number, and he should see them
       named rather than have to trust that they did not happen. */
    if (fittedIds.length) {
      plan.warnings.push(plan.summary.fitted.length + ' hand' +
        (fittedIds.length === 1 ? '' : 's') + ' had no stated winner and no showdown to settle it, ' +
        'so the winner was chosen as the one that reproduces his own recorded net: ' +
        fittedIds.join(', ') + '.');
    }
    if (reorderedIds.length) {
      plan.warnings.push('The prose named somebody out of turn in ' + reorderedIds.join(', ') +
        '; the engine’s own turn order was used instead.');
    }

    plan.apply = function () {
      var t = now, idOf = {}, out = [], drop = [];

      playerPlan.forEach(function (pp) {
        var res = Ident.ensure(store.db.players, pp.name, { now: t });
        if (res.player) idOf[pp.name] = res.player.id;
      });

      var sessionOf = {};
      nights.forEach(function (np) {
        var session = np.target;
        if (!session) {
          session = {
            id: uid('s', t), seq: t, date: np.date, startTime: '', endTime: '',
            variant: 'NLHE', stakes: '', currency: store.db.settings.defaultCurrency,
            location: '',
            buyIn: null, cashOut: null, expenses: 0, rake: 0,
            hours: null, gameRating: '', notes: '', liveNotes: [], villains: [],
            source: 'poker-coach', updatedAt: t
          };
          store.db.sessions.push(session);
        }
        sessionOf[np.date] = session;
      });

      function convert(rec, built, keepId) {
        var h = HR.handRecord(built.h);
        h.id = keepId || rec.handId;
        h.date = toISO(rec.date);
        var session = sessionOf[h.date];
        h.sessionId = session ? session.id : null;
        h.venue = session ? (session.location || '') : '';
        if (session && !session.stakes && built.h.bb) {
          session.stakes = (built.h.sb || 0) + '/' + built.h.bb;
        }
        h.source = 'poker-coach';
        h.importId = plan.importId;
        h.coachId = rec.handId;
        /* Recalled after the fact, so it is an estimate and says so —
           never summed with counted chips. */
        h.moneyLayer = 'estimated';
        h.observed = !(rec.hero && rec.hero.cards);
        h.tableSize = built.seats.length;

        var villains = session ? (session.villains || []) : [];
        arr(h.players).forEach(function (pl) {
          if (pl.hero || !pl.name) { pl.playerId = pl.hero ? null : pl.playerId; return; }
          var pid = idOf[pl.name] || null;
          if (!pid) {
            var ex = Ident.find(store.db.players, pl.name);
            pid = ex ? ex.id : null;
          }
          pl.playerId = pid;
          if (pid && villains.indexOf(pid) === -1) villains.push(pid);
        });
        if (session) session.villains = villains;

        h.name = nameHand(h);
        var rv = reviewOf(rec);
        if (rv) h.review = rv;
        var rd = readsOf(rec, resolve);
        if (rd.length) h.reads = rd;
        if (rec.provenance) h.provenance = clone(rec.provenance);
        h.updatedAt = t;
        return h;
      }

      fresh.forEach(function (f) { out.push(convert(f.rec, f.built, null)); });
      /* **The archive version wins** — his call, 10/09/2026. The hub copies
         of these are all `partial`, and half of them carry the straddle as
         text in a note rather than as an action, so their pots do not
         reproduce from their own actions. The twin is removed rather than
         left beside it, because two rows for one hand is the thing this
         key exists to prevent. */
      replaced.forEach(function (r) {
        out.push(convert(r.rec, r.built, null));
        drop.push(r.twin.id);
      });

      nights.forEach(function (np) {
        var s = sessionOf[np.date];
        if (s) store.touch(s, t);
      });
      store.saveSessions(); store.savePlayers();

      drop.forEach(function (id) { store.removeHand(id); });
      return store.putHands(out).then(function (n) {
        return {
          kind: 'coach', hands: n, replaced: drop.length, refused: refused.length,
          reads: reads, reviews: reviews,
          sessions: nights.length, players: Object.keys(idOf).length
        };
      });
    };

    return plan;
  }

  /* ── Reads on people, from the coach ─────────────────────────── */

  /**
   * Plan an import of `edb-player-profile/1`.
   *
   * **It never creates a person.** A read describes somebody he has
   * already played; a name in the file that matches nobody is a spelling
   * problem, not a new opponent. So it becomes a question — here are the
   * names it might be, or skip it — and the import waits for the answer.
   * That is his standing rule, *"never auto assume two names are the same
   * unless spelling is identical… ask if unsure"*, applied to a file.
   *
   * **It never overwrites.** Each read goes through `Profile.revise`, so
   * the one it replaces goes into history and the fields that moved are
   * named. A read identical to the current one is reported as unchanged
   * and touches nothing.
   */
  /**
   * Who a name that matches nobody might be — **suggestions for him to
   * tap, never a match.** The shared helper only knows prefixes, which
   * finds Sam for Samuel but offers nothing for a slip like Tomas for
   * Thomas, leaving "skip" as the only answer to a typo. So close
   * spellings (two edits or fewer) are offered as well. Nothing here is
   * acted on until he picks one.
   */
  function suggest(players, name, limit) {
    var out = Ident.nearby(players, name, limit).slice();
    var q = String(name || '').toLowerCase().replace(/\s+/g, ' ').trim();
    function dist(a, b) {
      if (Math.abs(a.length - b.length) > 2) return 99;
      var prev = [], cur, i, j;
      for (j = 0; j <= b.length; j++) prev[j] = j;
      for (i = 1; i <= a.length; i++) {
        cur = [i];
        for (j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[b.length];
    }
    arr(players).forEach(function (p) {
      if (!p || p.deleted || out.indexOf(p) >= 0) return;
      var keys = [p.name].concat(arr(p.aliases));
      var d = Math.min.apply(null, keys.map(function (k) {
        return dist(q, String(k || '').toLowerCase().replace(/\s+/g, ' ').trim());
      }));
      if (d <= 2) out.push(p);
    });
    return out.slice(0, limit || 4);
  }

  function planProfiles(store, parsed, opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var plan = blankPlan('profiles');
    plan.importId = uid('imp', now);
    var written = toISO(parsed.written) || null;
    var list = arr(parsed.profiles).filter(function (x) { return x && x.name; });
    if (!list.length) {
      plan.ok = false;
      plan.warnings.push('That file carries no reads on anybody.');
      return plan;
    }

    var nameMap = opts.nameMap || {};
    var reads = { fresh: [], revised: [], unchanged: [], skipped: [] };
    var work = [];

    list.forEach(function (raw) {
      var who = Ident.find(store.db.players, raw.name);
      if (!who && Object.prototype.hasOwnProperty.call(nameMap, raw.name)) {
        who = nameMap[raw.name] ? store.playerById(nameMap[raw.name]) : null;
        if (!who) { reads.skipped.push({ name: raw.name }); return; }
      }
      if (!who) {
        var near = suggest(store.db.players, raw.name, 4);
        ask(plan, {
          id: 'who:' + raw.name, kind: 'pick-player',
          text: 'The coach wrote a read on “' + raw.name + '” and nobody here is spelled ' +
            'that way. Who is it?',
          options: near.map(function (x) { return { value: x.id, label: x.name }; })
            .concat([{ value: '', label: 'Nobody — skip this read' }])
        });
        return;
      }
      var asOf = toISO(raw.asOf) || written;
      var next = Profile.clean(raw, { asOf: asOf, by: raw.by || 'coach' });
      var cur = Profile.current(who);
      var fields = Profile.diff(cur, next);
      var row = { name: who.name, id: who.id, type: next.type, fields: fields, raw: raw, asOf: asOf };
      if (!cur) reads.fresh.push(row);
      else if (!fields.length) reads.unchanged.push(row);
      else reads.revised.push(row);
      if (!cur || fields.length) work.push(row);
    });

    plan.reads = reads;
    plan.summary = {
      profiles: list.length, fresh: reads.fresh.length, revised: reads.revised.length,
      unchanged: reads.unchanged.length, skipped: reads.skipped.length
    };
    if (reads.revised.length) {
      plan.warnings.push('The current read on ' + reads.revised.map(function (r) { return r.name; }).join(', ') +
        ' is kept in their history, not replaced — you can see what moved on each profile.');
    }

    plan.apply = function () {
      var done = 0;
      work.forEach(function (row) {
        var p = store.playerById(row.id);
        if (!p) return;
        var r = Profile.revise(p, row.raw, { asOf: row.asOf, by: row.raw.by || 'coach', now: now });
        if (r && r.profile && !r.unchanged) done++;
      });
      store.savePlayers();
      return Promise.resolve({
        kind: 'profiles', reads: done,
        fresh: reads.fresh.length, revised: reads.revised.length,
        unchanged: reads.unchanged.length, skipped: reads.skipped.length
      });
    };
    return plan;
  }

  /** Hand recall stores a symbol; the hub keys everything on a code. */
  function currencyCode(sym) {
    var map = { 'HK$': 'HKD', 'US$': 'USD', '$': 'USD', '£': 'GBP', '€': 'EUR', '¥': 'JPY', '￥': 'CNY' };
    if (!sym) return '';
    if (/^[A-Z]{3}$/.test(sym)) return sym;
    return map[sym] || '';
  }

  /* ── 3. Poker ledger backup ────────────────────────────────── */

  /**
   * The ledger is the shell, so its own backup is the base rather than a
   * foreign format. Records keep their ids; anything already present is
   * matched rather than duplicated.
   */
  function planLedger(store, parsed, opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var plan = blankPlan('ledger');
    plan.importId = uid('imp', now);

    var players = arr(parsed.players), sessions = arr(parsed.sessions);
    var ledger = arr(parsed.ledger), hands = arr(parsed.hands);

    var haveSession = {}; store.db.sessions.forEach(function (s) { haveSession[s.id] = true; });
    var havePlayer = {}; store.db.players.forEach(function (p) { havePlayer[p.id] = true; });
    var haveRow = {}; store.db.ledger.forEach(function (r) { haveRow[r.id] = true; });
    var haveHand = {}; store.hands.forEach(function (h) { haveHand[h.id] = true; });

    /* Incoming player id → the id it will actually live under here. Needed
       before the rows are counted: whether a row is new or a correction
       depends on which person it lands on. */
    var idPreview = {}, mergeInto = {};

    /**
     * A ledger backup's people arrive with their own names **and their own
     * alias lists**, which means Ernest has already decided who is who.
     * The rename rules must not touch them: his file says the person is
     * `Pat` with `Patrick` as an alias, and rewriting that to `Patrick`
     * would overrule the very record it is importing. The rules stay where
     * they are useful — a raw tracker or Hand recall name, which arrives
     * with no alias list and no decision behind it.
     */
    players.forEach(function (p) {
      var row = { raw: p.name, name: p.name, renamedFrom: null, existingId: null };
      if (havePlayer[p.id]) { row.existingId = p.id; plan.matchedPlayers.push(row); }
      else {
        var byName = Ident.find(store.db.players, p.name);
        if (byName) { row.existingId = byName.id; plan.matchedPlayers.push(row); }
        else plan.newPlayers.push(row);
      }
      idPreview[p.id] = row.existingId || p.id;
    });

    /**
     * The night already in the hub, and the night in this file, can be the
     * same night reached two different ways — filed from the live table,
     * or typed into the old ledger months ago. Id alone never catches it,
     * and the cost of missing it is a bankroll that double-counts and a
     * win rate computed over twice the nights, silently.
     */
    var sessionMap = opts.sessionMap || {};      /* incoming id → hub id | '' (new) */
    sessions.forEach(function (s) {
      if (haveSession[s.id]) {
        plan.matchedSessions.push({ id: s.id, date: s.date, venue: s.location });
        return;
      }
      if (Object.prototype.hasOwnProperty.call(sessionMap, s.id)) {
        if (sessionMap[s.id]) {
          mergeInto[s.id] = sessionMap[s.id];
          plan.mergedSessions.push({ id: sessionMap[s.id], date: s.date, venue: s.location });
        } else plan.newSessions.push({ date: s.date, venue: s.location });
        return;
      }
      var m = matchLedgerSession(store, s);
      if (m.match) {
        mergeInto[s.id] = m.match.id;
        plan.mergedSessions.push({ id: m.match.id, date: s.date, venue: s.location });
        return;
      }
      if (m.candidates.length) {
        ask(plan, {
          id: 'session:' + s.id, kind: 'pick-session',
          text: (m.conflict === 'money'
            ? 'A night is already logged for ' + toISO(s.date) +
            (s.location ? ' at ' + s.location : '') +
            ', but the money does not match. Is this the same night?'
            : 'More than one night is already logged for ' + toISO(s.date) +
            '. Which one is this?'),
          options: m.candidates.map(function (c) {
            return {
              value: c.id,
              label: (c.location || 'no venue') + ' · ' +
                (Layers.hasSettledMoney(c) ? Settle.signedMoney(Layers.settledNet(c)) : 'no money')
            };
          }).concat([{ value: '', label: 'A separate night — keep both' }])
        });
        return;
      }
      plan.newSessions.push({ date: s.date, venue: s.location });
    });

    /* Content, not id. See `handKey`. */
    var haveHandKey = {};
    store.hands.forEach(function (h) { haveHandKey[handKey(h, h.date)] = true; });
    hands.forEach(function (h) {
      if (haveHand[h.id] || haveHandKey[handKey(h, null)]) plan.duplicateHands++;
      else plan.newHands++;
    });
    var homeless = hands.filter(function (h) {
      return !haveHand[h.id] && !haveHandKey[handKey(h, null)] &&
        !h.sessionId && toISO(h.date);
    }).length;
    if (homeless) {
      plan.warnings.push(plan_homelessText(homeless));
    }

    /* A row is one person's result for one night. If this file's night
       merges into one the hub already has, a row for a player who already
       has one there is a correction, not an addition. */
    plan.keptLedgerRows = 0;
    plan.newLedgerRows = 0;
    ledger.forEach(function (r) {
      if (haveRow[r.id]) return;
      var target = mergeInto[r.sessionId];
      if (target && existingRow(store, target, r.playerId, idPreview)) plan.keptLedgerRows++;
      else plan.newLedgerRows++;
    });
    if (plan.mergedSessions.length) {
      plan.warnings.push(plan.mergedSessions.length + ' night' +
        (plan.mergedSessions.length === 1 ? ' in this file is' : 's in this file are') +
        ' already in the hub — same date, venue and money. ' +
        (plan.mergedSessions.length === 1 ? 'It is' : 'They are') +
        ' merged rather than logged twice.');
    }

    var orphans = ledger.filter(function (r) { return !r.sessionId && !r.noSession; });
    if (orphans.length) {
      plan.warnings.push(orphans.length + ' ledger row' + (orphans.length === 1 ? '' : 's') +
        ' in this file belong to no session. They will import and be flagged on the dashboard, ' +
        'not silently dropped.');
    }

    /* A ledger backup carries settings the hub has no other source for —
       the starting bankroll above all, without which the bankroll figure is
       just the running total. Adopt them only while the hub's own are still
       untouched; never overwrite something Ernest has already set. */
    var mine = store.db.settings;
    var untouched = !mine.updatedAt && !num(mine.startingBankroll) &&
      !mine.defaultLocation && !mine.defaultStakes;
    plan.takeSettings = !!(parsed.settings && untouched && opts.takeSettings !== false);
    if (parsed.settings && !plan.takeSettings) {
      plan.warnings.push('This file carries its own settings (starting bankroll, your name, defaults). ' +
        'Yours are already set, so they are left alone.');
    }

    plan.summary = {
      sessions: sessions.length, players: players.length,
      ledgerRows: ledger.length, hands: hands.length,
      settings: plan.takeSettings ? parsed.settings : null
    };

    plan.apply = function () {
      var t = now, idRemap = {};

      players.forEach(function (p) {
        if (havePlayer[p.id]) return;
        var byName = Ident.find(store.db.players, p.name);
        if (byName) {
          idRemap[p.id] = byName.id;
          (p.aliases || []).forEach(function (a) { Ident.addAlias(byName, a); });
          byName.notes = (byName.notes || []).concat(p.notes || []);
          store.touch(byName, t);
          return;
        }
        /* Verbatim: his spelling, his aliases, his decision. The one
           tidy-up is an alias that repeats the name — his file has
           `Vanessa` listed as one of Vanessa's aliases — which would
           otherwise read as "also Vanessa" on every screen. */
        var rec = clone(p);
        rec.aliases = arr(rec.aliases).filter(function (a) {
          /* Exact repeats only. `una` under `Una` is worth keeping — it is
             the record of a casing split that got merged — while `Vanessa`
             under `Vanessa` says nothing at all. */
          return a && String(a).trim() !== String(rec.name).trim();
        });
        rec.extIds = arr(rec.extIds);
        rec.notes = arr(rec.notes);
        rec.updatedAt = rec.updatedAt || t;
        store.db.players.push(rec);
      });

      sessions.forEach(function (s) {
        if (haveSession[s.id]) return;
        /* The same night, reached twice. Fill the gaps in what is already
           here rather than adding a second record of one evening. */
        var into = mergeInto[s.id] ? store.sessionById(mergeInto[s.id]) : null;
        if (into) {
          if (!into.location && s.location) into.location = s.location;
          if (!into.stakes && s.stakes) into.stakes = s.stakes;
          if (into.hours == null && s.hours != null) into.hours = s.hours;
          if (!into.notes && s.notes) into.notes = s.notes;
          if (!Layers.hasSettledMoney(into) && Layers.hasSettledMoney(s)) {
            into.buyIn = s.buyIn; into.cashOut = s.cashOut;
            into.expenses = num(s.expenses); into.rake = num(s.rake);
            Layers.asSettled(into);
          }
          into.villains = arr(into.villains).concat(
            arr(s.villains).map(function (v) { return idRemap[v] || v; })
          ).filter(function (v, i, a) { return v && a.indexOf(v) === i; });
          store.touch(into, t);
          return;
        }
        var rec = clone(s);
        rec.updatedAt = rec.updatedAt || t;
        if (Layers.hasSettledMoney(rec)) Layers.asSettled(rec);
        rec.villains = arr(rec.villains).map(function (v) { return idRemap[v] || v; });
        store.db.sessions.push(rec);
      });

      ledger.forEach(function (r) {
        if (haveRow[r.id]) return;
        var sid = mergeInto[r.sessionId] || r.sessionId;
        var pid = idRemap[r.playerId] || r.playerId;
        /* One person, one result per night — correct the row that is there
           rather than adding a second one for the same evening. */
        var hit = sid ? existingRow(store, sid, pid, null) : null;
        if (hit) {
          /* A row that is already here came from counted chips at the
             table, and the tracker is the truth for money — Ernest's rule.
             Fill what it is missing; never overwrite what it has. */
          if (hit.buyIn == null && r.buyIn != null) hit.buyIn = r.buyIn;
          if (hit.cashOut == null && r.cashOut != null) hit.cashOut = r.cashOut;
          if (hit.net == null && r.net != null) hit.net = r.net;
          hit.updatedAt = t;
          Layers.asSettled(hit);
          return;
        }
        var rec = clone(r);
        rec.playerId = pid;
        rec.sessionId = sid;
        rec.updatedAt = rec.updatedAt || t;
        Layers.asSettled(rec);
        store.db.ledger.push(rec);
        /* One fact, one place: a linked row does not keep its own copy. */
        if (rec.sessionId) { delete rec.date; delete rec.venue; delete rec.currency; }
      });

      /* **Every hand belongs to a night.** Ernest, 08/09/2026: *"For this
         poker hub i do not want a loose hands. All hands should be within
         a session."* A file can still carry one that is not in a night —
         the old ledger allowed it — so it is given one, made from its own
         date, rather than being left floating where nothing can count it.
         The preview says so before anything is written. */
      var loose = {};
      hands.forEach(function (h) {
        if (h.sessionId && (haveSession[h.sessionId] || mergeInto[h.sessionId] ||
          sessions.some(function (x) { return x.id === h.sessionId; }))) return;
        var iso = toISO(h.date);
        if (!iso) return;
        if (loose[iso]) return;
        var m2 = matchSession(store.db.sessions, iso, '');
        if (m2.match) { loose[iso] = m2.match.id; return; }
        var made = {
          id: uid('s', t), seq: t, date: iso, startTime: '', endTime: '',
          variant: 'NLHE', stakes: '', currency: currencyOf(store),
          location: '', buyIn: null, cashOut: null, expenses: 0, rake: 0,
          hours: null, gameRating: '', notes: '', liveNotes: [], villains: [],
          source: 'hands-only', tracker: null, updatedAt: t
        };
        Layers.asSettled(made);
        store.db.sessions.push(made);
        loose[iso] = made.id;
      });

      var seenKey = {};
      store.hands.forEach(function (h) { seenKey[handKey(h, h.date)] = true; });
      var fresh = hands.filter(function (h) {
        if (haveHand[h.id]) return false;
        var k = handKey(h, null);
        if (seenKey[k]) return false;      /* the same hand, under another id */
        seenKey[k] = true;
        return true;
      }).map(function (h) {
        var rec = clone(h);
        rec.source = rec.source || 'ledger';
        rec.importId = plan.importId;
        rec.name = nameHand(rec);
        if (rec.sessionId && mergeInto[rec.sessionId]) rec.sessionId = mergeInto[rec.sessionId];
        if (!rec.sessionId) rec.sessionId = loose[toISO(rec.date)] || null;
        arr(rec.players).forEach(function (pl) {
          if (pl.playerId && idRemap[pl.playerId]) pl.playerId = idRemap[pl.playerId];
        });
        return rec;
      });

      if (plan.takeSettings) {
        store.db.settings = Object.assign({}, store.db.settings, parsed.settings);
        store.db.settings.updatedAt = t;
        store.saveSettings();
      }

      store.saveSessions(); store.savePlayers(); store.saveLedger();
      return store.putHands(fresh).then(function (n) {
        return {
          kind: 'ledger', sessions: plan.newSessions.length, players: plan.newPlayers.length,
          ledgerRows: plan.newLedgerRows, keptLedgerRows: plan.keptLedgerRows,
          mergedSessions: plan.mergedSessions.length,
          hands: n, duplicates: plan.duplicateHands
        };
      });
    };

    return plan;
  }

  /* ── Dispatch ──────────────────────────────────────────────── */

  function plan(store, parsed, opts) {
    var kind = detect(parsed);
    var p;
    if (kind === 'tracker') p = planTracker(store, parsed, opts);
    else if (kind === 'hand-recall') p = planHandRecall(store, parsed, opts);
    else if (kind === 'ledger') p = planLedger(store, parsed, opts);
    else if (kind === 'coach') p = planCoach(store, parsed, opts);
    else if (kind === 'profiles') p = planProfiles(store, parsed, opts);
    else {
      p = blankPlan(kind || 'unknown');
      p.ok = false;
      p.warnings.push('That file is not from the tracker, Hand recall, the poker ledger or the Poker Coach.');
      return p;
    }
    p.signature = signature(parsed);
    p.prior = priorImport(store, parsed);
    /* Nothing new is a fact worth stating, not an empty list to interpret. */
    p.changesNothing = p.ok &&
      !p.newSessions.length && !p.newPlayers.length &&
      !p.newHands && !p.newLedgerRows && !p.takeSettings &&
      !p.replacedHands && !(p.reads && (p.reads.fresh.length || p.reads.revised.length));
    return p;
  }

  /**
   * Apply a plan. Refuses while a question is open — the whole point of
   * the two-step. Snapshots first, so a bad import is one tap from undone.
   */
  function commit(store, p) {
    if (!p || !p.ok || !p.apply) {
      return Promise.reject(new Error(
        p && p.questions.length
          ? 'This import is waiting on an answer: ' + p.questions[0].text
          : 'This import cannot be applied.'
      ));
    }
    return store.snapshot('import: ' + p.kind).then(function () {
      return Promise.resolve(p.apply());
    }).then(function (report) {
      store.db.meta.imports = arr(store.db.meta.imports).concat([{
        id: p.importId, kind: p.kind, at: Date.now(),
        signature: p.signature || null, report: report
      }]).slice(-50);
      store.saveMeta();
      return report;
    });
  }

  return {
    detect: detect, plan: plan, commit: commit,
    planCoach: planCoach, coachKey: coachKey, planProfiles: planProfiles,
    signature: signature, priorImport: priorImport,
    planTracker: planTracker, planHandRecall: planHandRecall, planLedger: planLedger,
    matchSession: matchSession, toISO: toISO, currencyCode: currencyCode,
    heroAliases: heroAliases, looksLikeHero: looksLikeHero, nameHand: nameHand,
    _resetIds: _resetIds
  };
}));
</script>
<script>/* ============================================================
   Poker hub — backup, and the file that moves between devices.

   Ernest chose local-only storage, and then asked for one more thing:

     "I would like to be able to download files from my phone and upload
      to my computer where i use the same app and it can read that file"

   So the backup file is also the transfer file, and that is what forces
   merge semantics. A plain overwrite works exactly once in each
   direction and then eats whichever side was edited second. Every record
   carries `updatedAt`; on import the newer one wins, per record, and the
   preview says what would change before anything is written.

   Two modes:
     · MERGE   (default) — per-record, newest wins, previewed.
     · REPLACE (explicit) — full overwrite, and refused outright while a
       live session is open. There is no reading of "replace everything"
       that means "throw away the night I am in the middle of".

   Either way a snapshot is taken first, so both are one tap from undone.

   No DOM access. Producing a Blob and triggering a download is the
   caller's job — that is the one part that needs a document.
   ============================================================ */
(function (root, factory) {
  var need = typeof require !== 'undefined' && typeof module !== 'undefined';
  var api = factory(need ? require('./settle.js') : root.PHSettle);
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.PHBackup = api;
}(typeof globalThis !== 'undefined' ? globalThis : this, function (Settle) {
  'use strict';

  var APP = 'poker-hub';
  var FORMAT = 1;

  var COLLECTIONS = ['sessions', 'players', 'ledger'];

  function arr(v) { return Array.isArray(v) ? v : []; }
  function clone(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function stable(v) { return JSON.stringify(v, Object.keys(v || {}).sort()); }

  /* ── Build ─────────────────────────────────────────────────── */

  function build(store, opts) {
    opts = opts || {};
    var t = opts.now || Date.now();
    return Promise.resolve({
      app: APP,
      format: FORMAT,
      appVersion: opts.appVersion || '',
      schema: store.SCHEMA,
      exportedAt: new Date(t).toISOString(),
      label: opts.label || '',
      settings: clone(store.db.settings),
      meta: clone(store.db.meta),
      sessions: clone(store.db.sessions),
      players: clone(store.db.players),
      ledger: clone(store.db.ledger),
      hands: clone(store.hands),
      live: opts.includeLive === false ? null : clone(store.db.live)
    });
  }

  function filename(now) {
    var d = new Date(now || Date.now());
    var p = Settle.pad2;
    return 'poker-hub-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  }

  function looksLikeBackup(p) {
    return !!(p && typeof p === 'object' && p.app === APP && Array.isArray(p.sessions));
  }

  /* ── Merge ─────────────────────────────────────────────────── */

  function indexById(list) {
    var m = {};
    arr(list).forEach(function (x) { if (x && x.id) m[x.id] = x; });
    return m;
  }

  /**
   * Per-record newest-wins, with the losers counted rather than hidden.
   *
   * `kept` is the number the reader actually needs: incoming records that
   * were older than what is here, so the file's version was discarded. A
   * large `kept` on a phone → computer transfer means the file is stale
   * and probably not the one intended.
   */
  function diffCollection(localList, incomingList) {
    var mine = indexById(localList);
    var out = { add: [], update: [], kept: [], conflict: [], unchanged: 0 };
    arr(incomingList).forEach(function (inc) {
      if (!inc || !inc.id) return;
      var cur = mine[inc.id];
      if (!cur) { out.add.push(inc); return; }
      var a = Number(cur.updatedAt) || 0, b = Number(inc.updatedAt) || 0;
      if (b > a) { out.update.push(inc); return; }
      if (b < a) { out.kept.push(inc); return; }
      if (stable(cur) === stable(inc)) { out.unchanged++; return; }
      /* Same timestamp, different content — two devices edited without
         either clock moving. Local wins and it is reported, because a
         silent coin-flip here is how a night quietly changes. */
      out.conflict.push({ id: inc.id, mine: cur, theirs: inc });
    });
    return out;
  }

  function planMerge(store, payload) {
    var plan = { ok: true, mode: 'merge', warnings: [], collections: {}, hands: null, totals: null };
    if (!looksLikeBackup(payload)) {
      plan.ok = false;
      plan.warnings.push('That file is not a poker hub backup.');
      return plan;
    }
    if (payload.format > FORMAT) {
      plan.ok = false;
      plan.warnings.push('That backup was written by a newer version of the app (format ' +
        payload.format + '). Update this device before importing it.');
      return plan;
    }

    COLLECTIONS.forEach(function (c) {
      plan.collections[c] = diffCollection(store.db[c], payload[c]);
    });
    plan.hands = diffCollection(store.hands, payload.hands);

    var add = 0, update = 0, kept = 0, conflict = 0;
    COLLECTIONS.concat(['hands']).forEach(function (c) {
      var d = c === 'hands' ? plan.hands : plan.collections[c];
      add += d.add.length; update += d.update.length;
      kept += d.kept.length; conflict += d.conflict.length;
    });
    plan.totals = { add: add, update: update, kept: kept, conflict: conflict };

    if (conflict) {
      plan.warnings.push(conflict + ' record' + (conflict === 1 ? '' : 's') +
        ' were edited on both devices with the same timestamp. This device’s version is kept — ' +
        'check them afterwards.');
    }
    if (kept && !add && !update) {
      plan.warnings.push('Every record in that file is older than what is already here. ' +
        'Nothing would change — this is probably not the file you meant.');
    }
    if (payload.live && store.db.live) {
      plan.warnings.push('Both this device and that file have a live session open. ' +
        'The one on this device is kept.');
    }
    return plan;
  }

  function applyMerge(store, payload, opts) {
    opts = opts || {};
    var plan = opts.plan || planMerge(store, payload);
    if (!plan.ok) return Promise.reject(new Error(plan.warnings[0] || 'That file cannot be merged.'));

    return store.snapshot('merge import').then(function () {
      COLLECTIONS.forEach(function (c) {
        var d = plan.collections[c];
        var list = store.db[c];
        d.add.forEach(function (inc) { list.push(clone(inc)); });
        d.update.forEach(function (inc) {
          var i = list.findIndex(function (x) { return x.id === inc.id; });
          if (i >= 0) list[i] = clone(inc);
        });
      });

      /* Settings are not a record set — take the newer whole object. */
      var mine = Number(store.db.settings.updatedAt) || 0;
      var theirs = Number((payload.settings || {}).updatedAt) || 0;
      if (theirs > mine) store.db.settings = Object.assign({}, store.db.settings, payload.settings);

      /* A live session is never merged in over one already open here. */
      if (payload.live && !store.db.live) store.db.live = clone(payload.live);

      store.saveAllLocal();

      var incoming = plan.hands.add.concat(plan.hands.update).map(clone);
      return store.putHands(incoming).then(function () {
        return {
          mode: 'merge',
          added: plan.totals.add, updated: plan.totals.update,
          kept: plan.totals.kept, conflicts: plan.totals.conflict
        };
      });
    });
  }

  /* ── Replace ───────────────────────────────────────────────── */

  function planReplace(store, payload) {
    var plan = { ok: true, mode: 'replace', warnings: [], blocked: false, from: null, to: null };
    if (!looksLikeBackup(payload)) {
      plan.ok = false;
      plan.warnings.push('That file is not a poker hub backup.');
      return plan;
    }
    if (store.db.live) {
      plan.ok = false;
      plan.blocked = true;
      plan.warnings.push('There is a live session open on this device. ' +
        'Settle it or close it before replacing everything — replacing now would delete it.');
      return plan;
    }
    plan.from = store.counts();
    plan.to = {
      sessions: arr(payload.sessions).length,
      players: arr(payload.players).length,
      ledger: arr(payload.ledger).length,
      hands: arr(payload.hands).length
    };
    var loses = [];
    ['sessions', 'players', 'ledger', 'hands'].forEach(function (k) {
      if (plan.from[k] > plan.to[k]) loses.push((plan.from[k] - plan.to[k]) + ' ' + k);
    });
    if (loses.length) {
      plan.warnings.push('This device has more than that file: ' + loses.join(', ') +
        ' would be removed. Merge keeps both.');
    }
    return plan;
  }

  function applyReplace(store, payload, opts) {
    opts = opts || {};
    var plan = opts.plan || planReplace(store, payload);
    if (!plan.ok) return Promise.reject(new Error(plan.warnings[0] || 'That file cannot replace this device.'));

    return store.snapshot('replace import').then(function () {
      store.db.settings = Object.assign({}, store.DEFAULT_SETTINGS, payload.settings || {});
      store.db.sessions = clone(arr(payload.sessions));
      store.db.players = clone(arr(payload.players));
      store.db.ledger = clone(arr(payload.ledger));
      store.db.live = clone(payload.live || null);
      if (payload.meta) {
        store.db.meta = Object.assign({}, store.db.meta, payload.meta);
        store.db.meta.schema = store.SCHEMA;
      }
      store.hands = [];
      store.saveAllLocal();
      return store.idb.clear('hands').then(function () {
        return store.putHands(clone(arr(payload.hands)));
      }).then(function () {
        return { mode: 'replace', sessions: store.db.sessions.length, hands: store.hands.length };
      });
    });
  }

  return {
    APP: APP, FORMAT: FORMAT, COLLECTIONS: COLLECTIONS,
    build: build, filename: filename, looksLikeBackup: looksLikeBackup,
    diffCollection: diffCollection,
    planMerge: planMerge, applyMerge: applyMerge,
    planReplace: planReplace, applyReplace: applyReplace
  };
}));
</script>
<script>/* Poker ledger — statistics engine.
   No DOM, no storage: everything here is a pure function of its arguments,
   which is why it can be tested under plain node.

   The central claim the app makes is "you are / are not a proven winner", so
   the maths below is the part that has to be right. Model: a session's result

<script>/* ============================================================

   Vendored from the poker ledger's `src/views.js`, which already drew

   out light. Adapted only in how they get their dependencies: the ledger

        money(d.values[n - 1]) + ' against a lifetime ' + money(d.lifetime) + '">' +
        axisY(y, lo, hi, padL, w, padR) +
        '<line class="zero" x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y(0).toFixed(1) +
        '" y2="' + y(0).toFixed(1) + '"/>' +
        '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y(d.lifetime).toFixed(1) +
        '" y2="' + y(d.lifetime).toFixed(1) + '" stroke="' + token('--accent') + '" stroke-dasharray="4 3"/>' +
        '<path d="' + line(d.values, x, y) + '" fill="none" stroke="' + token('--text') + '" stroke-width="2"/>' +
