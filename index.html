      return '<span class="dax"><span class="k">' + label + '</span><b class="v ' + esc(v) + '">' +
        esc(Profile.AXIS_LABEL[v] || Profile.AXIS_LABEL.unknown) + '</b></span>';
    }

    h += '<div class="dossier">' +
      '<div class="dhead">' + typePill(cur.type) +
      (cur.qualifier ? '<span class="dq">' + esc(cur.qualifier) + '</span>' : '') + '</div>' +
      (t ? '<p class="dcounter">' + esc(t.label) + ', by the framework: ' + esc(t.counter) + '</p>' : '') +
      '<dl class="dfields">' +
      row('Entry', cur.entry) + row('After the flop', cur.postflop) + row('Exploit', cur.exploit, 'x') +
      '</dl>' +
      '<div class="daxes">' + axis('Attacks a check', cur.attacksCheck) +
      axis('Folds to a raise', cur.foldsToRaise) + '</div>' +
      (cur.tells.length ? '<div class="dtells"><span class="k">' +
        (cur.tells.length === 1 ? 'Tell' : 'Tells') + '</span><ul>' +
        cur.tells.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      (cur.changes ? '<p class="dchanges"><span class="k">What moved</span>' + esc(cur.changes) + '</p>' : '') +
      '<p class="dmeta">By ' + esc(whoWrote(cur)) + ' · ' + esc(fmtDate(cur.asOf)) +
      ' · <b>' + esc(tr.label) + '</b> — ' + esc(sampleLine(smp)) + '</p>' +
      (fresh ? '<p class="dfresh">' + icon('info', 14) + ' ' + plural(fresh, 'observation') +
        ' since this was written. Worth sending back to the coach.</p>' : '') +
      (fresh ? '<div class="dact"><button class="btn btn-ghost" data-act="export-coach">' + icon('share-network', 15) +
        ' Send to the coach</button></div>' : '') +
      '</div></div>';
    return h;
  }

  /**
   * Everything seen of them, newest first. The coach's reads are long, so
   * each one opens rather than scrolls: the first two lines, then the rest
   * and the hand it came from on a tap. A hand the man actually tabled is
   * marked — that one is a fact, the rest are inference.
   */
  function evidenceBlock(p, ev) {
    if (!ev.length) return '';
    var SHOW = 8;
    var tabled = ev.filter(function (e) { return e.tabled; }).length;
    function item(e) {
      var cards = e.cards ? cardChips(String(e.cards).match(/[2-9TJQKA][shdc]/gi) || [], 'sm')
        : (e.shown ? '<span class="shown">' + esc(e.shown) + '</span>' : '');
      return '<li class="ritem"><details><summary>' +
        '<span class="t">' + esc(fmtDate(e.on)) + '</span>' +
        '<span class="g">' +
        (e.tabled ? '<span class="tabled">' + icon('seal-check', 12) + ' tabled ' + cards + '</span>' : '') +
        (e.kind === 'live' ? '<span class="rk">at the table</span>' : '') +
        (e.kind === 'note' ? '<span class="rk">your note</span>' : '') +
        '<span class="rt">' + esc(e.text) + '</span></span></summary>' +
        (e.handId ? '<div class="rgo"><button class="btn btn-ghost" data-act="go" data-to="hand" data-id="' +
          esc(e.handId) + '">' + esc(e.handName || 'The hand') + (e.position ? ' · ' + esc(e.position) : '') +
          ' ' + icon('caret-right', 14) + '</button></div>' : '') +
        '</details></li>';
    }
    var h = '<div class="section"><h2>What has been seen</h2>' +
      '<p class="sub">' + plural(ev.length, 'observation') + ', newest first' +
      (tabled ? ' — ' + tabled + ' where they tabled their hand, which is fact rather than inference' : '') +
      '</p><ul class="rlist">' + ev.slice(0, SHOW).map(item).join('') + '</ul>';
    if (ev.length > SHOW) {
      h += '<details class="acc rmore"><summary>' + plural(ev.length - SHOW, 'older observation') +
        '</summary><ul class="rlist">' + ev.slice(SHOW).map(item).join('') + '</ul></details>';
    }
    return h + '</div>';
  }

  /** Every read they have had before this one, and what each replaced. */
  function historyBlock(p) {
    var hist = Profile.history(p);
    if (!hist.length) return '';
    var cur = Profile.current(p);
    var chain = [cur].concat(hist);
    return '<div class="section"><details class="acc"><summary>Earlier reads (' + hist.length + ')</summary>' +
      '<div class="acc-body"><ul class="hlist">' + hist.map(function (r, i) {
        var newer = chain[i];
        var moved = newer && newer.changed && newer.changed.length
          ? 'Replaced ' + (newer.asOf ? 'on ' + fmtDate(newer.asOf) : '') + ' — ' +
          newer.changed.map(fieldLabel).join(', ') + ' moved.' : '';
        return '<li><div class="hhead">' + typePill(r.type, true) +
          '<span class="t">' + esc(fmtDate(r.asOf)) + ' · by ' + esc(whoWrote(r)) + '</span></div>' +
          (r.qualifier ? '<p>' + esc(r.qualifier) + '</p>' : '') +
          (r.exploit ? '<p><span class="k">Exploit</span> ' + esc(r.exploit) + '</p>' : '') +
          (moved ? '<p class="hint">' + esc(moved) + '</p>' : '') + '</li>';
      }).join('') + '</ul></div></details></div>';
  }

  /** The read in six lines, for a tap at the table without leaving it. */
  function peekRead(p) {
    var cur = Profile.current(p);
    if (!cur) return '<p>No read on ' + esc(p.name) + ' yet.</p>';
    var h = '<div class="dossier peek"><div class="dhead">' + typePill(cur.type) +
      (cur.qualifier ? '<span class="dq">' + esc(cur.qualifier) + '</span>' : '') + '</div>';
    if (cur.exploit) h += '<dl class="dfields"><dt>Exploit</dt><dd class="x">' + esc(cur.exploit) + '</dd></dl>';
    h += '<div class="daxes"><span class="dax"><span class="k">Attacks a check</span><b class="v">' +
      esc(Profile.AXIS_LABEL[cur.attacksCheck]) + '</b></span><span class="dax"><span class="k">Folds to a raise</span>' +
      '<b class="v">' + esc(Profile.AXIS_LABEL[cur.foldsToRaise]) + '</b></span></div>';
    if (cur.tells.length) {
      h += '<div class="dtells"><span class="k">' + (cur.tells.length === 1 ? 'Tell' : 'Tells') + '</span><ul>' +
        cur.tells.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    }
    return h + '<p class="dmeta">By ' + esc(whoWrote(cur)) + ' · ' + esc(fmtDate(cur.asOf)) + '</p></div>';
  }

  /**
   * Writing or revising a read by hand. Whatever is saved becomes a new
   * dated revision signed "you"; the one it replaces goes into history.

  var READ_EDIT = null;
  function readForm(p) {

      Profile.TYPES.map(function (t) {

          t.key + '" aria-pressed="' + (cur.type === t.key) + '">' + esc(t.label) + '</button>';
      }).join('') +

      (!cur.type) + '">Not typed</button></div>' +
      '<span class="hint">From your framework. Leave it untyped while the evidence is thin — ' +

    function area(id, label, v, hint, rows) {
      return '<div class="field"><label for="' + id + '">' + label + '</label>' +

  function readFromForm() {
    var v = function (id) { var el = $(id); return el ? el.value : ''; };
    var on = document.querySelector('#rd-type .chipbtn.on');
    return {
      type: on ? on.getAttribute('data-v') : '',

  function aliasesOf(p) {
    if (!p || !p.aliases) return '';
    var a = p.aliases.filter(function (x) {
      return x && String(x).trim() !== String(p.name).trim();
    });
    return a.length ? a.join(', ') : '';

  /**

   * Ernest, 08/09/2026: *"i want a small settings tab that helps deal with
   * the name issue / Also it includes the delete player setting / Also
   * merge ability."* All three are done once and read never, so they sit
   * behind the gear rather than below the numbers he actually came for.

  function playerSettingsForm(p) {
    var als = (p.aliases || []).filter(function (x) {
      return x && String(x).trim() !== String(p.name).trim();
    });

     DATA

      '<span class="g"><span class="a">Back up everything</span>' +
      '<span class="b">' + plural(c.sessions, 'night') + ', ' + plural(c.hands, 'hand') + ', ' +

      icon('caret-right', 16) + '</button>' +

      '<span class="g"><span class="a">Restore from a backup</span>' +

      (m.lastBackupAt ? 'Last backed up ' + esc(Settle.stamp(m.lastBackupAt)) + '.' : 'Never backed up.') +
      ' Everything lives on this device only — if you lose it, the last backup is what you have.</p></div>';

      '<span class="b">' + (store.canUndo()
        ? esc(m.undoLabel || 'the last destructive step') + ' · ' + esc(Settle.stamp(m.undoAt))
        : 'Nothing to undo.') + '</span></span></button></div></div>';

    if ((m.imports || []).length) {
      h += '<div class="section"><h2>What has been imported</h2><div class="rowlist">' +
        m.imports.slice().reverse().map(function (i) {
          var r = i.report || {}, bits = [];
          if (r.sessionId || r.sessions) bits.push(plural(r.sessions || 1, 'night'));
          if (r.hands) bits.push(plural(r.hands, 'hand'));
          if (r.ledgerRows) bits.push(plural(r.ledgerRows, 'ledger row'));
          if (r.players) bits.push(plural(r.players, 'player'));

            '<span>' + esc(bits.join(' · ')) + '</span></span></span></div>';
        }).join('') + '</div></div>';
    }
    return h;
  }

  /* ── import preview ────────────────────────────────────── */

  function previewBody(p) {
    var h = '';
    if (p.prior) {
      h += '<div class="alert ok">You imported this exact file on ' + esc(Settle.stamp(p.prior.at)) +
        '. Importing it again matches every record it already wrote and adds nothing.</div>';
    }
    if (p.changesNothing) {
      h += '<div class="alert ok"><b>Nothing new.</b> Everything in this file is already here — ' +
        'importing it changes nothing at all.</div>';
    }
    p.warnings.forEach(function (w) { h += '<div class="alert warn">' + esc(w) + '</div>'; });
    p.questions.forEach(function (q) {
      h += '<div class="q"><p>' + esc(q.text) + '</p><div class="opts">' +
        q.options.map(function (o) {
          return '<button class="btn btn-ghost" data-answer="' + esc(q.id) + '" data-value="' +
            esc(String(o.value)) + '">' + esc(o.label) + '</button>';
        }).join('') + '</div></div>';
    });
    if (p.ok && !p.changesNothing) {
      h += '<div class="pv"><h4>What this would add</h4><ul>';
      if (p.newSessions.length) h += '<li>' + plural(p.newSessions.length, 'new night') + '</li>';
      if (p.matchedSessions.length) h += '<li>' + plural(p.matchedSessions.length, 'night') +
        ' already logged — this attaches to ' + (p.matchedSessions.length === 1 ? 'it' : 'them') +
        ' rather than making a duplicate</li>';
      if (p.mergedSessions && p.mergedSessions.length) h += '<li>' +
        plural(p.mergedSessions.length, 'night') + ' the same date, venue and money as ' +
        (p.mergedSessions.length === 1 ? 'a night' : 'nights') +
        ' already here — merged, not counted twice</li>';
      if (p.newPlayers.length) h += '<li>' + plural(p.newPlayers.length, 'new player') + ': ' +
        esc(p.newPlayers.map(function (x) { return x.name; }).join(', ')) + '</li>';
      if (p.matchedPlayers.length) h += '<li>' + p.matchedPlayers.length + ' already known</li>';
      if (p.newLedgerRows) h += '<li>' + plural(p.newLedgerRows, 'ledger row') + '</li>';
      if (p.updatedLedgerRows) h += '<li>' + plural(p.updatedLedgerRows, 'ledger row') +
        ' corrected in place — not added a second time</li>';
      if (p.keptLedgerRows) h += '<li>' + plural(p.keptLedgerRows, 'ledger row') +
        ' already recorded for ' + (p.keptLedgerRows === 1 ? 'that night' : 'those nights') +
        ' — counted chips win, so ' + (p.keptLedgerRows === 1 ? 'it is' : 'they are') +
        ' left alone</li>';
      if (p.newHands) h += '<li>' + plural(p.newHands, 'hand') + '</li>';
      if (p.duplicateHands) h += '<li>' + plural(p.duplicateHands, 'hand') + ' already here — skipped</li>';
      /* The coach's file replaces rather than skips: the same hand can be
         in the hub already, recorded at the table and lighter for it. */

        ' already here — replaced by the coach\u2019s copy, not added twice</li>';
      if (p.summary && p.summary.reviews) h += '<li>' + plural(p.summary.reviews, 'review') +
        ' — grade, tags and the verdict</li>';
      if (p.summary && p.summary.reads) h += '<li>' + plural(p.summary.reads, 'read') +
        ' on the people you played</li>';
      if (p.refusedHands) h += '<li class="bad">' + plural(p.refusedHands, 'hand') +
        ' refused — they do not replay to what they say happened</li>';
      if (p.reads) {
        var rd = p.reads;
        if (rd.fresh.length) h += '<li>A first read on ' + esc(rd.fresh.map(function (x) {
          return x.name + (x.type ? ' (' + Profile.typeOf(x.type).label + ')' : '');
        }).join(', ')) + '</li>';
        rd.revised.forEach(function (x) {
          h += '<li>' + esc(x.name) + ' — ' + esc(x.fields.map(fieldLabel).join(', ')) +

        });
        if (rd.unchanged.length) h += '<li>' + esc(rd.unchanged.map(function (x) { return x.name; })
          .join(', ')) + ' — the same read as now, left alone</li>';
        if (rd.skipped.length) h += '<li>' + plural(rd.skipped.length, 'read') + ' skipped at your word</li>';
      }
      if (p.summary && p.summary.tip > 0) h += '<li>Dealer' + (p.summary.dealerName ? ' ' + esc(p.summary.dealerName) : '') +
        ' tipped ' + esc(money(p.summary.tip)) + ', from the pot — logged on the night so it still sums to zero</li>';
      if (p.summary && p.summary.hours != null) h += '<li>' + hoursText(p.summary.hours) +
        ', counted — so this night reaches your win rate</li>';
      if (p.takeSettings && p.summary.settings) {
        var st = p.summary.settings;
        h += '<li>its settings, because yours are still untouched — ' +

          (st.heroName ? ', name “' + esc(st.heroName) + '”' : '') + '</li>';

      h += '</ul>';

  function showImportPreview() {
    var p = pending;
    var title = {
      tracker: 'Home game tracker file', 'hand-recall': 'Hand recall file', ledger: 'Poker ledger file',
      coach: 'Hands from the Poker Coach', profiles: 'Reads from the Poker Coach'
    }[p.kind] || 'A file';
    if (p.logged) title = 'Log this night?';
    var btns = p.ok
      ? (p.changesNothing ? [{ label: 'Close', act: 'close', primary: true }]
        : [{ label: 'Cancel', act: 'close' }, { label: p.logged ? 'File it' : 'Import', act: 'do-import', primary: true }])
      : [{ label: 'Cancel', act: 'close' }];

  function answerQuestion(id, value) {
    var opts = (pending && pending._opts) || {};
    if (id === 'hero') opts.heroIndex = Number(value);
    else if (id === 'session') opts.sessionId = value || null;
    else if (id.indexOf('session:') === 0) {
      opts.sessionMap = opts.sessionMap || {};
      opts.sessionMap[id.slice(8)] = value || null;
    } else if (id.indexOf('who:') === 0) {
      /* An empty answer is an answer: "nobody — skip it". */
      opts.nameMap = opts.nameMap || {};
      opts.nameMap[id.slice(4)] = value || '';
    }
    if (pending && pending.fromLive) {
      pending = Live.plan(store, live(), { now: now(), heroIndex: opts.heroIndex, sessionId: opts.sessionId });
      pending.fromLive = true;
      pending._opts = opts;
      showSettlePreview();
      return;
    }
    pending = Imp.plan(store, pendingRaw, opts);
    pending._opts = opts;
    showImportPreview();
  }

  function showRestorePreview(payload) {
    var m = Backup.planMerge(store, payload), r = Backup.planReplace(store, payload), h = '';
    m.warnings.forEach(function (w) { h += '<div class="alert warn">' + esc(w) + '</div>'; });
    if (m.ok) {
      h += '<div class="pv"><h4>Merge — recommended</h4><ul>' +
        '<li>' + m.totals.add + ' records added</li>' +
        '<li>' + m.totals.update + ' updated, because that file has them newer</li>' +
        '<li>' + m.totals.kept + ' left alone, because this device has them newer</li>' +
        (m.totals.conflict ? '<li>' + m.totals.conflict + ' edited on both — this device wins</li>' : '') +
        '</ul><p class="hint">Nothing is deleted. This is the safe way to move the file between your ' +
        'phone and your computer in either direction.</p></div>';
    }
    if (r.blocked) h += '<div class="alert err">' + esc(r.warnings[0]) + '</div>';
    else if (r.ok) {
      h += '<div class="pv"><h4>Replace everything</h4><p class="hint">This device would end up with ' +
        'exactly what that file holds — ' + plural(r.to.sessions, 'night') + ', ' +
        plural(r.to.hands, 'hand') + '. ' + (r.warnings.length ? esc(r.warnings.join(' ')) : '') +
        '</p></div>';

  /**

   * one.

  function openModal(title, body, buttons, focusId) {
    var el = $('modal');
    el.innerHTML = '<div class="card modal" role="dialog" aria-modal="true" aria-label="' +
      esc(title) + '">' +
      '<div class="modal-head"><h3>' + esc(title) + '</h3>' +

      '<div class="modal-body">' + body + '</div>' +
      /* No action bar when the only thing left to do is close — the ✕
         already says that, and a lone "Close" button is furniture. */
      (buttons && buttons.length
        ? '<div class="modal-actions">' + buttons.map(function (b) {
          return '<button class="btn ' + (b.primary ? 'btn-primary' : 'btn-ghost') +
            '" data-act="' + b.act + '">' + esc(b.label) + '</button>';
        }).join('') + '</div>'
        : '') + '</div>';
    el.hidden = false;
    if (focusId) { var f = $(focusId); if (f) f.focus(); }
  }
  function closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }

  /**
   * A destructive action always shows what it would take with it, and
   * always says that undo covers it.
   */
  function confirmDestroy(opts) {
    pendingConfirm = opts.run;
    var body = '<p class="hint" style="margin-bottom:12px">' + opts.body + '</p>';
    if (opts.list && opts.list.length) {
      body += '<div class="pv"><ul>' + opts.list.map(function (x) { return '<li>' + x + '</li>'; })
        .join('') + '</ul></div>';
    }
    if (opts.undoable !== false) {
      body += '<div class="alert warn">Undo will bring it back — but only until the next thing you ' +
        'change.</div>';
    }
    if (opts.typed) {
      body += '<div class="field"><label for="confirm-word">Type <b>' + esc(opts.typed) +
        '</b> to confirm</label><input class="input" id="confirm-word" autocapitalize="none" ' +
        'autocorrect="off" spellcheck="false"></div>';
      window._confirmWord = opts.typed;
    }
    openModal(opts.title, body, [
      { label: opts.action || 'Remove', act: opts.typed ? 'do-destroy-typed' : 'do-destroy' },
      { label: 'Cancel', act: 'close', primary: true }
    ]);
  }

  function runConfirm() {
    var fn = pendingConfirm;

  /**
   * Four destinations, as the 09/11/2026 canvas: Tonight is the table,
   * Nights the diary, Players the room, Me the dashboard and the dossier
   * on Ernest himself. Hands and Data are reached from inside those, not
   * from the nav — a nav of six on a phone was two taps too many.
   */
  var NAV = [
    ['live', 'Tonight', 'spade'], ['nights', 'Nights', 'calendar-blank'],
    ['players', 'Players', 'users'], ['home', 'Me', 'user']
  ];
  var TABS = NAV;
  var PARENT = { session: 'nights', player: 'players', hand: 'hands', hands: 'home', data: 'home', record: 'live' };
  var TITLES = {
    live: 'Tonight', home: 'Me', nights: 'Nights', session: 'Night',
    hands: 'Hands', hand: 'Hand', players: 'Players', player: 'Player', data: 'Data & backup',
    record: 'Recording a hand'
  };
  /* Where the person came from, so Back returns there rather than to a
     fixed parent — a hand is reached from a night, a player or the list. */
  var HISTORY = [];

  /**
   * The table lock. This phone gets handed across the table so someone can
   * enter their own rebuy, and it holds their lifetime result and every
   * read ever taken on them. The live screen stays reachable; nothing else
   * does.
   */
  function locked() { return !!(live() && live().locked); }

  function render() {
    var L = live();
    if (locked() && VIEW.name !== 'live' && VIEW.name !== 'record') {
      VIEW = { name: 'live', id: null, filter: null, sub: VIEW.sub };
    }

    var body =
      (VIEW.name === 'live' || VIEW.name === 'record') ? viewLive() :
        page(VIEW.name === 'home' ? viewHome() :
          VIEW.name === 'nights' ? viewNights() :
            VIEW.name === 'session' ? viewSession() :
              VIEW.name === 'hands' ? viewHands() :
                VIEW.name === 'hand' ? viewHand() :
                  VIEW.name === 'players' ? viewPlayers() :
                    VIEW.name === 'player' ? viewPlayer() : viewData());

    var title = TITLES[VIEW.name], sub = '';
    if (VIEW.name === 'session') {
      var s = store.sessionById(VIEW.id);
      if (s) { title = s.location || 'Night'; sub = fmtDate(s.date); }
    }
    if (VIEW.name === 'player') {
      var p = store.playerById(VIEW.id);
      if (p) { title = p.name; sub = 'Player'; }
    }
    if (VIEW.name === 'hand') {
      var hd = store.handById(VIEW.id);
      if (hd) { title = handTitle(hd); sub = fmtDate(hd.date); }
    }
    if (VIEW.name === 'hands' && VIEW.filter && VIEW.filter.liveId) title = 'Hands tonight';
    if (VIEW.name === 'live' && VIEW.sub === 'timeline' && L) title = 'Timeline';
    if (VIEW.name === 'live' && VIEW.sub === 'hands' && L) title = 'History';
    if (VIEW.name === 'live' && VIEW.sub === 'seats' && L) title = 'Seating';

    var deep = !!PARENT[VIEW.name] || (VIEW.name === 'live' && VIEW.sub !== 'table' && L);
    var tableScreen = (VIEW.name === 'live' || VIEW.name === 'record') && L && (VIEW.sub === 'table' || VIEW.name === 'record');
    if (locked() && !tableScreen) title = 'Table mode';

    /* On the table the strip is the table itself: the venue as the title,
       blinds · seated · the clock under it, undo beside the gear. */
    var headTitle = tableScreen
      ? '<div class="head-stack"><h1>' + esc(L.venue || 'Tonight') + '</h1>' + tableSpecs(L) + '</div>'
      : (deep ? '<button class="backlink" data-act="back" aria-label="Back">' + icon('arrow-left', 18) + '</button>' : '') +
      '<h1>' + esc(title) + '</h1>' + (sub ? '<span class="caption">' + esc(sub) + '</span>' : '');
    var undoBtn = tableScreen
      ? '<button class="icon-btn" data-act="live-undo" aria-label="Undo the last change">' + icon('arrow-u-up-left', 18) + '</button>' +
        '<button class="icon-btn" data-act="share-ledger" aria-label="Share the group ledger">' + icon('share-network', 18) + '</button>'
      : '';

    document.body.className = 'has-bottom-nav' +
      (tableScreen ? ' has-cmdbar' : '') + (locked() ? ' locked' : '');

    var navHTML = locked() ? '' : NAV.map(function (t) {
      var on = VIEW.name === t[0] || PARENT[VIEW.name] === t[0] ||
        (VIEW.name === 'hand' && HISTORY.length && HISTORY[HISTORY.length - 1].name === 'player' ? t[0] === 'players' : false);
      return '<a href="#' + t[0] + '" class="' + (on ? 'active' : '') + '" data-act="go" data-to="' + t[0] + '">' +
        icon(t[2], 18) + t[1] + (t[0] === 'live' && L ? '<span class="dotlive-nav" aria-hidden="true"></span>' : '') + '</a>';
    }).join('');

    $('app').innerHTML =

        ? '<button class="btn btn-ghost" data-act="unlock" aria-label="Unlock — leave table mode">' + icon('eye', 16) + ' Unlock</button>'
        : '<div class="menu-wrap"><button class="icon-btn" data-act="menu" aria-label="Settings" aria-haspopup="menu" aria-expanded="false">' +
        icon('gear') + '</button>' + settingsMenu() + '</div>') +
      '</div></header>' +

      (locked() ? '' : '<nav class="tabs topnav" aria-label="Primary">' + NAV.map(function (t) {
        var on = VIEW.name === t[0] || PARENT[VIEW.name] === t[0];

        '<button class="btn btn-primary" data-act="rec-start"' + (L.players.length ? '' : ' disabled') + '>' + icon('spade', 16) + ' Record a hand</button>' +

      (locked() ? '' : '<nav class="bottom-nav" aria-label="Primary">' + navHTML + '</nav>');

    if (Charts) Charts.paint($('app'));

  /** A page body: the container, and the colophon at its foot. */
  function page(body) {
    return '<main class="main container">' + body +
      '<div class="colophon" style="margin-top:32px;padding-top:12px;border-top:1px solid var(--border)">' +
      '<span class="mark" style="display:inline-flex;height:14px;opacity:.72;color:var(--text)">' + monogram(14) + '</span>' +
