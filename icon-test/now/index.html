<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Now — icon test</title>

:root{--bg:#050a0e;--surface:#091622;--border:#16293d;--text:#eaf4ff;--muted:#6a90b8;--accent:#5bc0eb;color-scheme:dark}
