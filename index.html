  function recallRec() { return store.db.meta && store.db.meta.recall; }

  function saveRecall() { store.saveMeta(); }

  function pickNightForm() {
    var recent = store.db.sessions.slice()
      .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); })
      .slice(0, 12);
    var h = '<p class="hint">A hand belongs to the night it was played in — that is what makes it ' +
      'countable against that night and removable with it.</p>';
    if (recent.length) {
      h += '<div class="rowlist" style="margin:12px 0">' + recent.map(function (s) {
        var n = store.hands.filter(function (x) { return x.sessionId === s.id; }).length;
        return '<button class="lrow" data-act="recall-night" data-id="' + esc(s.id) + '">' +
          '<span class="g"><span class="a">' + esc(s.location || 'No venue') + '</span>' +
          '<span class="meta"><span>' + esc(fmtDate(s.date)) + '</span>' +
          '<span>' + esc(s.stakes || '') + '</span>' +
          (n ? '<span>' + plural(n, 'hand') + ' already</span>' : '') + '</span></span>' +
          icon('caret-right', 14) + '</button>';
      }).join('') + '</div>';
    } else {
      h += '<div class="alert warn">No nights logged yet. Give the hand a date and it will make ' +
        'one, so it still lands somewhere real.</div>';
    }
    h += '<div class="sechd"><h3>Or a night not logged yet</h3></div>' +
      '<div class="formgrid"><div class="field"><label for="rn-date">Date</label>' +
      '<input class="input" id="rn-date" type="date" value="' +
      esc(Settle.isoDate(now())) + '"></div>' +
      '<div class="field"><label for="rn-venue">Venue</label>' +
      '<input class="input" id="rn-venue" value="' +
      esc(store.db.settings.defaultLocation || '') + '"></div></div>' +
      '<button class="btn btn-ghost" data-act="recall-new-night" style="margin-top:12px">' +
      'Use this date</button>' +
      '<p class="hint">It gets a night of its own, with no money on it — honestly empty rather ' +
      'than a hand with nowhere to live.</p>';
    return h;
  }

  /**
   * Start a remembered hand against a night.
   *
   * With a session, the hand joins it. Without one, a session is created
   * carrying **no money at all** — an honest empty night that the rates
   * exclude — rather than a hand floating with no date.
   */
  function startRecall(sessionId, date, venue) {
    var s = sessionId ? store.sessionById(sessionId) : null;
    if (!s) {
      var iso = Settle.isoDate ? date : date;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || ''))) {
        toast('Pick a night, or give this one a date.', 'err');
        return;
      }
      s = {
        id: 'sr-' + now().toString(36), seq: now(),
        date: date, startTime: '', endTime: '',
        variant: 'NLHE', stakes: store.db.settings.defaultStakes || '',
        currency: base(), location: venue || '',
        buyIn: null, cashOut: null, expenses: 0, rake: 0,
        hours: null, gameRating: '', notes: '', liveNotes: [], villains: [],
        source: 'recall', tracker: null, updatedAt: now()
      };
      Layers.asSettled(s);
      store.db.sessions.push(s);
      store.saveSessions();
    }
    var no = 0;
    store.hands.forEach(function (h) {
      if (h.sessionId === s.id) no = Math.max(no, Number(h.no) || 0);
    });
    store.db.meta.recall = Rec.fromRecall([], {
      settings: store.db.settings,
      now: now(),
      no: no + 1,
      date: s.date,
      venue: s.location || '',
      stakes: s.stakes || '',
      currency: s.currency || base(),
      sessionId: s.id,
      id: 'hd-' + now().toString(36) + '-r'
    });
    /* He is almost always in the hand he remembers. */
    Rec.addSeat(store.db.meta.recall, {
      name: (heroAliases()[0] || 'Me'), hero: true
    });
    saveRecall();
    closeModal();
    VIEW = { name: 'record', id: null, filter: null, sub: VIEW.sub };
    render();
  }

  function heroAliases() {
    return String(store.db.settings.heroName || '')
      .split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  }

  function startRecording() {
    var L = live();
    L.rec = Rec.create(L, {
      settings: store.db.settings,
      now: now(),
      no: nextHandNo(L),
      date: Settle.isoDate(L.startedAt || now()),
      currency: base(),
      id: 'hd-' + now().toString(36) + '-' + Math.floor(nextHandNo(L)).toString(36)
    });
    store.saveLive();
    VIEW = { name: 'record', id: null, filter: null, sub: VIEW.sub };
    render();
  }

  function saveHand() {
    var L = live(), r = rec();
    if (!r) return;
    var noteEl = $('rc-note');
    if (noteEl) r.hand.note = noteEl.value;
    var nameEl = $('rc-name');
    if (nameEl) Rec.setName(r, nameEl.value);
    var out = Rec.finish(r, { now: now(), id: r.hand.id, sessionId: r.sessionId || null });
    if (out.error) { toast(out.error, 'err'); return; }
    var hd = out.hand;

    if (r.recall) {
      /* A remembered hand already knows its night, so it lands straight on
         it — and the people in it join that night's opponents, which is
         what makes them countable there. */
      hd.sessionId = r.sessionId;
      hd.liveId = null;
      var sess = store.sessionById(r.sessionId);
      if (sess) {
        var vs = sess.villains || [];
        hd.players.forEach(function (pl) {
          if (pl.playerId && vs.indexOf(pl.playerId) === -1) vs.push(pl.playerId);
        });
        sess.villains = vs;
        hd.venue = sess.location || '';
        store.touch(sess, now());
        store.saveSessions();
      }
    } else {
      /* It belongs to the night, but the night has no id until it is filed. */
      hd.liveId = L.id;
      hd.sessionId = null;
      hd.venue = L.venue || '';
    }

    store.putHands([hd]).then(function () {
      var wasRecall = r.recall, sid = r.sessionId;
      clearRec();
      VIEW = wasRecall
        ? { name: 'session', id: sid, filter: null, sub: VIEW.sub }
        : { name: 'live', id: null, filter: null, sub: 'hands' };
      render();
      toast(hd.name + ' kept — ' +
        (hd.heroInHand ? est(hd.heroNet) : 'one you watched') + '.', 'ok');
    }).catch(function (err) { toast(err.message, 'err'); });
  }

  function viewRecord() {
    var r = rec();
    if (!r) return '<main class="main"><div class="empty"><h3>No hand in progress</h3></div></main>';
    return '<main class="main">' + (r.stage === 'play' ? recPlay(r) : recSetup(r)) + '</main>';
  }


  /* ══════════════════════════════════════════════════════════
     LOG A PAST NIGHT

     A night that happened without the app: the money, the hours, who was
     there. It is written as a tracker file in memory and goes through the
     same importer a live settle goes through — one code path, one set of
     assertions, the same identity step for every name typed.
     ══════════════════════════════════════════════════════════ */

  var LOG_ROWS = 4;

  /** One row of the table. `v` fills it from a paste; a row that came
   *  with a net only carries it, so typing the buy-in fills the cash-out. */
  function lnRowHTML(i, v) {
    v = v || {};
    var val = function (x) { return x == null ? '' : esc(String(Math.round(x * 100) / 100)); };
    var hasNet = v.net != null && (v.buyIn == null || v.cashOut == null) && !v.stillIn;
    return '<div class="rrow" data-row="' + i + '"' + (hasNet ? ' data-net="' + val(v.net) + '"' : '') + '>' +
      '<input class="input" list="ln-names" data-ln="name" placeholder="Name" aria-label="Player ' + (i + 1) + ' name" value="' + esc(v.name || '') + '">' +
      '<input class="input" inputmode="decimal" data-ln="in" placeholder="Buy-in" aria-label="Player ' + (i + 1) + ' buy-in" value="' + val(v.buyIn) + '">' +
      '<input class="input" inputmode="decimal" data-ln="out" placeholder="' +
      (hasNet ? 'net ' + esc(Settle.plain(v.net)) : (v.stillIn ? 'still in' : 'Cash-out')) +
      '" aria-label="Player ' + (i + 1) + ' cash-out" value="' + val(v.cashOut) + '">' +
      '<button class="icon-btn" data-act="ln-drop" aria-label="Remove row">' + icon('x', 14) + '</button></div>';
  }

  function logNightForm() {
    var s = store.db.settings;
    var names = store.db.players.filter(function (p) { return !p.hero; })
      .map(function (p) { return p.name; }).sort();
    var rows = [];
    for (var i = 0; i < LOG_ROWS; i++) rows.push(lnRowHTML(i));
    /* A night already in a message — the Share text, or what was typed in
       the group — fills the form; venue, stakes and hours are then his. */
    return '<div class="field lnpaste"><label for="ln-paste">Paste a Share message or chat summary</label>' +
      '<textarea class="textarea" id="ln-paste" rows="3" autocomplete="off" autocorrect="off" spellcheck="false" ' +
      'placeholder="Floral Towers · 10/11/2026&#10;Ernest   4,000 →  6,450  (+2,450)&#10;…"></textarea></div>' +
      '<div class="line" style="margin-top:8px"><button class="btn btn-ghost" data-act="ln-paste">' + icon('clipboard-text', 15) +
      ' Fill the form from it</button>' +
      '<label class="lnunit" id="ln-unit-wrap" hidden>Listed buy-ins are ' +
      '<select class="select" id="ln-unit"><option value="1">as written</option><option value="1000">in thousands</option></select></label></div>' +
      '<div id="ln-paste-out" style="margin-top:8px"></div>' +
      '<div class="formgrid" style="margin-top:12px">' +
      '<div class="field"><label for="ln-date">Date</label>' +
      '<input class="input" id="ln-date" type="date" value="' + esc(todayISO()) + '"></div>' +
      '<div class="field"><label for="ln-start">Sat down at</label>' +
      '<input class="input" id="ln-start" type="time" value="20:00"></div>' +
      '<div class="field full"><label for="ln-venue">Venue</label>' +
      '<input class="input" id="ln-venue" value="' + esc(s.defaultLocation || '') + '"></div>' +
      '<div class="field"><label for="ln-stakes">Stakes</label>' +
      '<input class="input" id="ln-stakes" value="' + esc(s.defaultStakes || '') + '"></div>' +
      '<div class="field"><label for="ln-hours">Hours</label>' +
      '<input class="input" id="ln-hours" inputmode="decimal" placeholder="4.5"></div>' +
      '<div class="field"><label for="ln-dealer">Dealer</label>' +
      '<input class="input" id="ln-dealer" placeholder="nobody"></div>' +
      '<div class="field"><label for="ln-tip">Dealer tip</label>' +
      '<input class="input" id="ln-tip" inputmode="decimal" placeholder="0"></div>' +
      '</div>' +
      '<div class="line" style="margin-top:16px"><span class="hint" style="margin:0">You</span>' +
      '<div class="segmented" role="group" aria-label="Did you play">' +
      '<button data-act="ln-me" data-me="played" class="active" aria-pressed="true">I played</button>' +
      '<button data-act="ln-me" data-me="satout" aria-pressed="false">I sat out</button></div></div>' +
      '<div class="formgrid" id="ln-mine" style="margin-top:12px">' +
      '<div class="field"><label for="ln-my-in">Your buy-in, total</label>' +
      '<input class="input" id="ln-my-in" inputmode="decimal"></div>' +
      '<div class="field"><label for="ln-my-out">Your cash-out</label>' +
      '<input class="input" id="ln-my-out" inputmode="decimal"></div></div>' +
      '<div class="sechd" style="margin-top:16px"><h3>Who else was there</h3><span class="caption">' + esc(cur()) + ', exact amounts</span></div>' +
      '<datalist id="ln-names">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
      '<div class="rosterform" id="ln-rows">' + rows.join('') + '</div>' +
      '<button class="btn btn-ghost" data-act="ln-add" style="margin-top:8px">' + icon('plus', 15) + ' Another row</button>' +
      '<p class="hint" id="ln-balance" style="margin-top:12px"></p>' +
      '<div class="field" style="margin-top:8px"><label for="ln-notes">Notes</label>' +
      '<input class="input" id="ln-notes" placeholder="optional"></div>' +
      '<p class="hint">Every name goes through the same identity step as a seat at the table: a spelling that matches ' +
      'somebody known lands on their record, a new one is shown as new before anything is written.</p>';
  }

  var lnMe = 'played';

  function setLnMe(v) {
    lnMe = v;
    document.querySelectorAll('[data-act="ln-me"]').forEach(function (b) {
      var on = b.getAttribute('data-me') === lnMe;
      b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.classList.toggle('active', on);
    });
    var mine = $('ln-mine'); if (mine) mine.hidden = lnMe !== 'played';
    lnBalance();
  }

  /**
   * Read a pasted night into the form — the Ledger's own two readers, the
   * Share message first. His row goes into his buy-in and cash-out, not
   * into the table as his own opponent; the tip goes to the dealer's tip;
   * a title that is not "Home game" is the venue. Nothing is filed: Review
   * still shows every name and every figure before anything is written.
   */
  function lnApplyPaste(unit) {
    var ta = $('ln-paste'), box = $('ln-paste-out');
    if (!ta || !box) return;
    var text = ta.value;
    if (!text.trim()) { toast('Paste the message first.', 'err'); ta.focus(); return; }
    var out = Paste.read(text, { currency: base(), unit: unit || 0 });
    if (!out.rows.length) {
      box.innerHTML = '<div class="alert warn">' + esc(out.warnings[0] || 'Nothing recognised in that text.') + '</div>';
      return;
    }
    var settings = store.db.settings, mine = null, others = [];
    out.rows.forEach(function (r) {
      if (!mine && (Imp.looksLikeHero(r.name, settings) || Paste.isHeroName(r.name, settings.heroName))) mine = r;
      else others.push(r);
    });
    if (out.date) $('ln-date').value = out.date;
    if (out.venue) $('ln-venue').value = out.venue;
    var tip = out.totals && out.totals.tip ? (out.totals.tip.buyIn != null ? out.totals.tip.buyIn : out.totals.tip.cashOut) : null;
    $('ln-tip').value = tip != null ? String(tip) : '';
    setLnMe(mine ? 'played' : 'satout');
    if (mine) {
      $('ln-my-in').value = mine.buyIn != null ? String(mine.buyIn) : '';
      $('ln-my-out').value = mine.cashOut != null ? String(mine.cashOut) : '';
    }
    $('ln-rows').innerHTML = others.length
      ? others.map(function (r, i) { return lnRowHTML(i, r); }).join('')
      : lnRowHTML(0, null);
    lnBalance();

    /* The unit control appears only for a summary that lists buy-ins. */
    var uw = $('ln-unit-wrap');
    if (uw) {
      var listed = out.kind === 'freeform' && (out.unitFrom !== 'default' ||
        out.warnings.some(function (w) { return /buy-in unit/.test(w); }));
      uw.hidden = !listed;
      if (listed) $('ln-unit').value = String(out.unit || 1);
    }

    var still = others.filter(function (r) { return r.stillIn; }).map(function (r) { return r.name; });
    var netOnly = others.filter(function (r) { return r.net != null && (r.buyIn == null || r.cashOut == null) && !r.stillIn; })
      .map(function (r) { return r.name; });
    var said = [];
    said.push((out.kind === 'tracker' ? 'Read a Share message' : 'Read a chat summary') +
      (out.date ? ' from ' + fmtDate(out.date) : '') + (out.venue ? ' at ' + out.venue : '') + ': ' +
      plural(out.rows.length, 'player') + (tip ? ', tip ' + Settle.plain(tip) : '') + '.');
    said.push(mine
      ? 'You are ' + mine.name + ' — your figures are in your buy-in and cash-out.'
      : 'None of these is you, so it is set to “I sat out”. If one of them is you, tap “I played”, put your figures in, and remove that row.');
    if (still.length) said.push(still.join(', ') + (still.length === 1 ? ' was' : ' were') +
      ' still in when it was shared — add the cash-out.');
    if (netOnly.length) said.push(netOnly.join(', ') + ' came as a net only — type the buy-in and the cash-out follows.');
    if (!out.date) said.push('No date in it — set the date above.');
    box.innerHTML = '<div class="alert ok"><ul class="pastesaid">' + said.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
      '</ul></div>' +
      (out.warnings.length ? '<div class="alert warn" style="margin-top:6px"><ul class="pastesaid">' +
        out.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>' : '');
  }

  function lnRows() {
    var out = [];
    document.querySelectorAll('#ln-rows .rrow').forEach(function (r) {
      var nm = (r.querySelector('[data-ln="name"]').value || '').trim();
      var bi = r.querySelector('[data-ln="in"]').value, co = r.querySelector('[data-ln="out"]').value;
      if (!nm && !String(bi).trim() && !String(co).trim()) return;
      out.push({ name: nm, buyIn: num(bi), cashOut: num(co) });
    });
    return out;
  }

  function lnBalance() {
    var el = $('ln-balance'); if (!el) return;
    var rows = lnRows();
    var ins = 0, outs = 0;
    rows.forEach(function (r) { ins += r.buyIn || 0; outs += r.cashOut || 0; });
    if (lnMe === 'played') { ins += num($('ln-my-in').value) || 0; outs += num($('ln-my-out').value) || 0; }
    var tipv = num($('ln-tip') ? $('ln-tip').value : 0) || 0;
    if (!ins && !outs) { el.textContent = ''; return; }
    var off = Settle.round2(ins - outs - tipv);
    var tipTxt = tipv ? ' · dealer ' + Settle.plain(tipv) : '';
    el.textContent = off === 0
      ? 'Buy-ins ' + Settle.plain(ins) + ' · cash-outs ' + Settle.plain(outs) + tipTxt + ' — balances.'
      : 'Buy-ins ' + Settle.plain(ins) + ' · cash-outs ' + Settle.plain(outs) + tipTxt + ' — ' + Settle.plain(Math.abs(off)) +
      (off > 0 ? ' missing' : ' in excess') + '. You can file it anyway; the night is marked as not reconciling.';
    el.className = off === 0 ? 'hint' : 'hint';
    el.style.color = off === 0 ? '' : 'var(--warning-text)';
  }

  /** The form as a tracker file, plus the options the importer takes. */
  function logNightPayload() {
    var date = $('ln-date').value, start = $('ln-start').value || '20:00';
    var hours = num($('ln-hours').value);
    var venue = $('ln-venue').value.trim(), stakes = $('ln-stakes').value.trim();
    if (!date) return { error: 'Which night was it? The date is the one thing this cannot do without.', field: 'ln-date' };
    var t0 = Date.parse(date + 'T' + start + ':00');
    if (!isFinite(t0)) return { error: 'That date and time do not read.', field: 'ln-date' };
    var t1 = hours != null && hours > 0 ? t0 + Math.round(hours * 3600000) : t0 + 60000;
    var people = [], events = [], idn = 1;
    var heroIndex = -1;
    if (lnMe === 'played') {
      var myIn = num($('ln-my-in').value), myOut = num($('ln-my-out').value);
      if (myIn == null || myIn <= 0) return { error: 'Your buy-in is needed, or mark the night as one you sat out.', field: 'ln-my-in' };
      if (myOut == null || myOut < 0) return { error: 'Your cash-out is needed — 0 if you busted.', field: 'ln-my-out' };
      var myName = (store.db.settings.heroName || 'Me').split(',')[0].trim() || 'Me';
      heroIndex = 0;
      people.push({ id: idn++, name: myName, buyins: [myIn], cashedOut: true, cashout: myOut });
    }
    var rows = lnRows();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r.name) return { error: 'Row ' + (i + 1) + ' has money but no name.', field: null };
      if (r.buyIn == null || r.buyIn <= 0) return { error: r.name + ' needs a buy-in.', field: null };
      if (r.cashOut == null || r.cashOut < 0) return { error: r.name + ' needs a cash-out — 0 if they busted.', field: null };
      people.push({ id: idn++, name: r.name, buyins: [r.buyIn], cashedOut: true, cashout: r.cashOut });
    }
    if (!people.length) return { error: 'Nobody is on this night yet.', field: null };
    people.forEach(function (p, i) {
      events.push({ name: p.name, type: 'buyin', amount: p.buyins[0], ts: t0 + i * 1000 });
    });
    people.forEach(function (p, i) {
      events.push({ name: p.name, type: 'cashout', amount: p.cashout, ts: t1 + i * 1000 });
    });
    var tipAmt = num($('ln-tip').value) || 0, dealerName = $('ln-dealer').value.trim();
    var payload = {
      app: 'home-game-tracker', version: 1, savedAt: new Date(t1).toISOString(),
      state: { players: people, events: events, tip: tipAmt, dealer: !!(tipAmt > 0 || dealerName), nextId: idn, startedAt: t0 }
    };
    var notes = $('ln-notes').value.trim();
    var opts = {
      venue: venue, stakes: stakes, hours: hours != null && hours > 0 ? hours : null,
      hoursUnknown: !(hours != null && hours > 0),
      heroIndex: heroIndex, source: 'logged', dealerName: dealerName,
      liveNotes: notes ? [{ t: t0, cat: 'Note', text: notes, seatId: null, name: '' }] : []
    };
    return { payload: payload, opts: opts };
  }

  /* ── live forms ────────────────────────────────────────── */

  function startLiveForm() {
    var s = store.db.settings;
    return '<div class="formgrid">' +
      '<div class="field full"><label for="lv-venue">Venue</label>' +
      '<input class="input" id="lv-venue" value="' + esc(s.defaultLocation || '') + '"></div>' +
      '<div class="field"><label for="lv-stakes">Stakes</label>' +
      '<input class="input" id="lv-stakes" value="' + esc(s.defaultStakes || '') + '"></div>' +
      '<div class="field"><label for="lv-seats">Table size</label>' +
      '<select class="select" id="lv-seats">' +
      [2,3,4,5,6,7,8,9,10].map(function (n) {
        return '<option value="' + n + '"' + (n === 9 ? ' selected' : '') + '>' +
          n + ' handed</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label for="lv-dealer">Dealer</label>' +
      '<select class="select" id="lv-dealer"><option value="">No dealer</option>' +
      '<option value="1">There is a dealer to tip</option></select></div></div>' +
      '<p class="hint" style="margin-top:12px">The clock does not start until the first buy-in, so ' +
      'opening this early costs nothing.</p>';
  }

  /* ══════════════════════════════════════════════════════════
     SEATING SOMEBODY — the identity step

     Every seat resolves to one person before the buy-in is taken. The
     stored spelling wins, so typing `pat` seats **Patrick** and the
     ledger row, the share text and the dossier all land on the one
     record. A name that matches nothing is not silently accepted: the
     button says it is about to create a person, because two records for
     one man is the failure mode this whole merge exists to end.
     ══════════════════════════════════════════════════════════ */

  var SUGGEST_MAX = 6;   /* about two rows on a phone */

  /** Nights logged with each opponent, in one pass over the ledger. */
  function nightsByPlayer() {
    var m = {};
    store.db.ledger.forEach(function (r) {
      if (r.net == null || !r.playerId) return;
      m[r.playerId] = (m[r.playerId] || 0) + 1;
    });
    return m;
  }

  /**
   * Who to offer. Ranked by nights played together — the people most
   * likely to walk in — and narrowed to what has been typed so far, on
   * any name they answer to.
   */
  function suggestions(L, typed, opts) {
    opts = opts || {};
    var prefer = opts.prefer || {};
    var seated = {};
    (L.players || []).forEach(function (x) {
      seated[Ident.norm(x.name)] = true;
      /* By id as well as by name: a seat can be sitting under a spelling
         its person is not stored under. */
      if (x.playerId) seated['#' + x.playerId] = true;
    });
    var q = Ident.norm(typed);
    var nights = nightsByPlayer();
    return store.db.players.filter(function (p) {
      if (p.hero || p.deleted) return false;
      if (seated[Ident.norm(p.name)] || seated['#' + p.id]) return false;
      if (!q) return true;
      /* A prefix either way, so `Sam` finds `Samuel` **and** `Samuel`
         finds `Sam`. Nothing is ever acted on — this is what turns "no
         match" into a question worth answering rather than a dead end. */
      return Ident.keysOf(p).some(function (k) {
        return k.indexOf(q) === 0 || q.indexOf(k) === 0;
      });
    }).sort(function (a, b) {
      /* People known to have been at *this* night come first — when the
         hand is being remembered rather than watched, that is almost
         always who it was. */
      var pa = prefer[a.id] ? 1 : 0, pb = prefer[b.id] ? 1 : 0;
      return pb - pa || (nights[b.id] || 0) - (nights[a.id] || 0) || a.name.localeCompare(b.name);
    }).slice(0, SUGGEST_MAX).map(function (p) {
      return { p: p, nights: nights[p.id] || 0, there: !!prefer[p.id] };
    });
  }

  /** What the typed name resolves to, right now. */
  function apResolve(L, typed) {
    var raw = String(typed == null ? '' : typed).replace(/\s+/g, ' ').trim();
    if (!raw) return { state: 'empty' };
    var canon = Ident.canonicalName(raw).name;
    var hit = Ident.find(store.db.players, raw);
    var name = hit ? hit.name : canon;
    var bad = Live.validName(L, name);
    if (bad.error) return { state: 'refused', msg: bad.error, name: name };
    if (Imp.looksLikeHero(name, store.db.settings)) return { state: 'hero', name: name };
    if (hit) return { state: 'known', name: hit.name, player: hit, typed: raw };
    return { state: 'new', name: canon };
  }

  function apMatchHTML(res, near) {
    if (res.state === 'empty') {
      return '<p class="hint">Everyone at the table is one person in the file — type a name and it ' +
        'will say who it found.</p>';
    }
    if (res.state === 'refused') return '<div class="alert warn">' + esc(res.msg) + '</div>';
    if (res.state === 'hero') {
      return '<p class="hint">That is you. Your money goes on the night itself, so you get no ' +
        'opponent record.</p>';
    }
    if (res.state === 'known') {
      var t = playerTotals(res.player.id);
      return '<div class="apmatch ok">' + icon('check-circle', 14) + '<span><b>' + esc(res.player.name) +
        '</b>' + (Ident.sameName(res.typed, res.player.name) ? '' : ' — matched from “' +
          esc(res.typed) + '”') + '<span class="sub">' + esc(plural(t.nights, 'night')) + ' together · ' +
        esc(signed(t.net)) + ' lifetime</span></span></div>';
    }
    /* Half a name is not a new person — it is usually the start of an old
       one. Saying whose start it is stops `K` becoming a man, and it is
       the whole of his rule: never assume, ask.

       Asked of the **whole roster**, not of the tappable suggestions:
       somebody already at the table is exactly the person worth warning
       about, and they are excluded from the chips because they cannot be
       seated twice. */
    var maybe = Ident.nearby(store.db.players, res.name, 2)
      .filter(function (x) { return !x.hero; });
    if (maybe.length) {
      var seatedAlready = (near || []).every(function (x) { return x.p.id !== maybe[0].id; });
      return '<div class="apmatch new">' + icon('plus-circle', 14) +
        '<span>Nobody is called <b>' + esc(res.name) + '</b> — did you mean <b>' +
        esc(maybe[0].name) + '</b>?' +
        '<span class="sub">' + (seatedAlready && !(near || []).length
          ? esc(maybe[0].name) + ' is already at the table. If that is the same person, seat them ' +
          'once and rename the record afterwards.'
          : 'Tap them above, or add ' + esc(res.name) + ' as somebody new.') +
        '</span></span></div>';
    }
    return '<div class="apmatch new">' + icon('plus-circle', 14) +
      '<span>Nobody is called <b>' + esc(res.name) + '</b>.' +
      '<span class="sub">Adding will give them a record of their own.</span></span></div>';
  }

  function apChipsHTML(s) {
    if (!s.length) return '';
    return s.map(function (x) {
      return '<button class="chipbtn" data-fill-name="' + esc(x.p.name) + '">' + esc(x.p.name) +
        (x.nights ? '<span class="n">' + x.nights + '</span>' : '') + '</button>';
    }).join('');
  }

  /**
   * The same identity step as seating somebody live, aimed at a hand
   * being remembered. `L` here is a stand-in roster — the seats already
   * in the hand — so the suggestions exclude them exactly as they exclude
   * the people already at a table.
   */
  function seatPickerForm() {
    var r = rec();
    var fake = { players: r.hand.seats };
    return '<div class="field"><label for="ap-name">Name</label>' +
      '<input class="input" id="ap-name" autocomplete="off" autocapitalize="words" ' +
      'autocorrect="off" spellcheck="false"></div>' +
      '<div class="chips" id="ap-sug" style="margin-top:8px">' +
      apChipsHTML(suggestions(fake, '', { prefer: window._recallPrefer })) + '</div>' +
      '<div id="ap-match" style="margin-top:8px">' +
      apMatchHTML(apResolve(fake, ''), null) + '</div>';
  }

  /* ── the seat row on the table ──
     The same identity step, in one line under the roster. The strip under
     it offers the regulars (ranked by nights together) and says, in one
     line, who the typed name lands on — or that it makes somebody new. */

  function seatChipsHTML(s) {
    return s.map(function (x) {
      return '<button class="chipbtn" data-seat-fill="' + esc(x.p.name) + '">' + esc(x.p.name) +
        (x.nights ? '<span class="n">' + x.nights + '</span>' : '') + '</button>';
    }).join('');
  }

  function seatMatchHTML(L, res) {
    if (res.state === 'empty') return '<span class="mx">Tap a regular, or type a name.</span>';
    if (res.state === 'refused') return '<span class="mx warn">' + esc(res.msg) + '</span>';
    if (res.state === 'hero') return '<span class="mx">That is you — your money goes on the night itself.</span>';
    if (res.state === 'known') {
      var t = playerTotals(res.player.id);
      return '<span class="mx ok">' + icon('check-circle', 14) + '<b>' + esc(res.player.name) + '</b>' +
        (Ident.sameName(res.typed, res.player.name) ? '' : ' from “' + esc(res.typed) + '”') +
        '<span class="mono"> · ' + esc(plural(t.nights, 'night')) + ' · ' + esc(signed(t.net)) + '</span></span>';
    }
    /* Half a name is usually the start of an old one: say whose, and make
       it one tap. If that person is already seated, say so instead —
       they cannot be seated twice. */
    var maybe = Ident.nearby(store.db.players, res.name, 2).filter(function (x) { return !x.hero; })[0];
    var seatedIds = {};
    L.players.forEach(function (x) { if (x.playerId) seatedIds[x.playerId] = true; });
    return '<span class="mx new">' + icon('plus-circle', 14) + 'New person: <b>' + esc(res.name) + '</b>' +
      (maybe
        ? (seatedIds[maybe.id]
          ? ' — did you mean <b>' + esc(maybe.name) + '</b>? <span class="sub">Already at the table.</span>'
          : ' — did you mean <button class="linkbtn" data-seat-fill="' + esc(maybe.name) + '">' + esc(maybe.name) + '</button>?')
        : '') + '</span>';
  }

  /** Repaint the strip per keystroke; `show` opens it on focus. */
  function refreshSeatRow(show) {
    var inp = $('seat-name'), strip = $('seat-strip'), L = live();
    if (!inp || !strip || !L) return;
    var res = apResolve(L, inp.value);
    $('seat-sug').innerHTML = seatChipsHTML(suggestions(L, inp.value));
    $('seat-match').innerHTML = seatMatchHTML(L, res);
    if (show || inp.value.trim()) strip.hidden = false;
  }

  /**
   * Seating somebody resolves before it commits: name → person → id →
   * seat. The seat carries the stored spelling and the player id, which is
   * what makes the ledger row, the hands and the dossier land on one
   * record rather than on a string.
   */
  function seatFromRow() {
    var L0 = live(), nameEl = $('seat-name'), amtEl = $('seat-amount');
    if (!L0 || !nameEl || !amtEl) return;
    var typed = nameEl.value, am = amtEl.value;
    var res = apResolve(L0, typed);
    if (res.state === 'empty') { toast('Give them a name.', 'err'); nameEl.focus(); return; }
    if (res.state === 'refused') { toast(res.msg, 'err'); return; }
    var va = Live.validAmount(am);
    if (va.error) { toast(va.error, 'err'); amtEl.focus(); return; }

    var pid = null, seatName = res.name, fresh = false;
    /* The hero is the one person at the table with no opponent record —
       his money lives on the night itself. */
    if (res.state !== 'hero') {
      var e2 = Ident.ensure(store.db.players, typed, { now: now() });
      if (!e2.player) { toast('Give them a name.', 'err'); return; }
      pid = e2.player.id;
      seatName = e2.player.name;
      fresh = e2.created;
      store.savePlayers();
    }
    var isHero = res.state === 'hero';
    var r = liveCommit(function (L) {
      return Live.addPlayer(L, seatName, va.amount, now(), { playerId: pid, hero: isHero });
    });
    if (r && !r.error) {
      toast(r.player.name + ' is in' + (fresh ? ' — new record created.' : '.'), 'ok');
      /* Ready for the next one: the start of a night is six of these in
         a row, and the keyboard should stay up for all of them. */
      var nx = $('seat-name');
      if (nx) nx.focus();
    }
  }

  /** Dealer name and tip, saved as they are left — no re-render, so the
   *  keyboard can move from one field to the other without dropping. */
  function saveDealer() {
    var L = live();
    if (!L || !L.dealer) return;
    var tv = $('tip') ? String($('tip').value).trim() : '';
    var dn = $('dealer-name') ? $('dealer-name').value : '';
    liveUndo.push(JSON.stringify(L));
    if (liveUndo.length > Live.UNDO_CAP) liveUndo.shift();
    var r = Live.setTip(L, tv === '' ? 0 : tv);
    if (r && r.error) { liveUndo.pop(); toast(r.error, 'err'); return; }
    Live.setDealer(L, dn);
    store.saveLive();
    var ts = $('tsum');
    if (ts) ts.outerHTML = liveSummary(L, Live.totals(L));
  }

  /** Repaint the suggestions, the match line and the button, per keystroke. */
  function refreshAddPlayer() {
    var inp = $('ap-name');
    if (!inp) return;
    /* Two callers, one form: seating somebody at a live table, and adding
       somebody to a hand being remembered. The roster differs; the
       identity step does not. */
    var seatBtn = document.querySelector('[data-act="do-add-seat"]');
    var roster = seatBtn ? { players: rec().hand.seats } : live();
    if (!roster) return;
    var opts = seatBtn ? { prefer: window._recallPrefer } : {};
    var res = apResolve(roster, inp.value);
    var near = suggestions(roster, inp.value, opts);
    var sug = $('ap-sug'), mat = $('ap-match');
    if (sug) sug.innerHTML = apChipsHTML(near);
    if (mat) mat.innerHTML = apMatchHTML(res, near);
    var btn = seatBtn || document.querySelector('[data-act="do-add-player"]');
    if (btn) btn.textContent = res.state === 'new' ? 'Add as a new person' : 'Add';
  }

  function settleBody(L) {
    var r = Live.settle(L), t = Live.totals(L), h = '';
    if (!r.ok) {
      h += '<div class="alert warn">' + esc(
        r.reason === 'empty' ? 'Nobody is at the table yet.'
          : r.reason === 'pending' ? r.pending.join(', ') +
            (r.pending.length === 1 ? ' has' : ' have') + ' not cashed out yet.'
            : 'The chips do not reconcile — ' + money(Math.abs(t.net)) + ' ' + offBy(t.net) + '.'
      ) + '</div>';
      if (r.reason === 'unbalanced') {
        h += '<p class="hint">Somebody’s cash-out is wrong. Correct it on the table and come back — ' +
          'filing a night that does not balance would record money that never existed.</p>';
      }
      return h;
    }
    /* What is on screen is unfenced so the columns read cleanly; what
       leaves goes out inside a ``` block, which is the only way WhatsApp,
       Telegram and Slack keep them lined up. The hidden copy is the
       payload for both Share and the execCommand fallback. */
    h += '<div class="ledgerblock">' + esc(Live.shareText(L, { fence: false, currency: cur() })) + '</div>' +
      '<textarea id="share-raw" readonly aria-hidden="true" tabindex="-1" ' +
      'style="position:absolute;left:-9999px;top:0;width:1px;height:1px">' +
      esc(Live.shareText(L, { currency: cur() })) + '</textarea>' +
      '<p class="hint">Sent as a code block so the columns line up in chat. Money only — no read ' +
      'and no dossier figure leaves in this text.</p>';
    var hrs = Live.hours(L, now());
    h += '<div class="pv" style="margin-top:14px"><h4>Filing this night</h4><ul>' +
      '<li>' + esc(L.venue || 'no venue') + ' · ' +
      esc(fmtDate(Settle.isoDate(L.startedAt || now()))) + '</li>' +
      '<li>' + esc(hoursText(hrs)) + ', counted — so it reaches your win rate</li>' +
      '<li>' + plural(Math.max(0, L.players.length - 1), 'opponent') + ' get a ledger row</li>' +
      (L.notes.length ? '<li>' + plural(L.notes.length, 'read') +
        (L.notes.length === 1 ? ' rides' : ' ride') + ' onto the night</li>' : '') +
      (liveHandList(L).length ? '<li>' + plural(liveHandList(L).length, 'hand') +
        ' recorded tonight ' + (liveHandList(L).length === 1 ? 'joins' : 'join') +
        ' it — as estimates, kept apart from the money</li>' : '') +
      '</ul></div>';
    return h;
  }

  /* ══════════════════════════════════════════════════════════
     DASHBOARD
     ══════════════════════════════════════════════════════════ */

  var VERDICT = {
    winner: { label: 'A proven winner', k: 'win' },
    loser: { label: 'A proven loser', k: 'lose' },
    unproven: { label: 'Not proven either way', k: 'unproven' },
    insufficient: { label: 'Not enough nights yet', k: 'unproven' },
    none: { label: 'Nothing to judge yet', k: 'unproven' }
  };

  function emptyState() {
    return '<div class="empty"><span class="tag">Nothing logged yet</span>' +
      '<h3>Start with a night, or bring in what you already have</h3>' +
      '<p>A tracker session, a Hand recall export, a poker ledger backup or hands from the Poker Coach — the import works out which.</p>' +
      '<div class="acts"><button class="btn btn-primary" data-act="go" data-to="live">Start a night</button>' +
      '<button class="btn btn-ghost" data-act="log-night">Log a past night</button>' +
      '<button class="btn btn-ghost" data-act="pick-import">Import a file</button></div></div>';
  }

  function ciFig(l, v) {
    return '<div class="ci-fig"><span class="l">' + esc(l) + '</span>' +
      '<span class="v">' + esc(v) + '</span></div>';
  }
  function statcard(l, v, k, d) {
    return '<div class="statcard"><span class="l">' + esc(l) + '</span><span class="n ' + (k || '') + '">' + esc(v) + '</span>' +
      (d ? '<span class="d">' + esc(d) + '</span>' : '') + '</div>';
  }
  function stat(l, v, k, note) {
    return '<div class="stat"><span class="l">' + esc(l) + '</span>' +
      '<span class="v ' + (k || '') + '">' + esc(v) + '</span>' +
      (note ? '<span class="n">' + esc(note) + '</span>' : '') + '</div>';
  }

  /* ══════════════════════════════════════════════════════════
     ME — the dossier on Ernest himself

     The same figures the opponent dossiers carry, from the hands he
     chose to log — and labelled as such on every line, because a hand
     gets logged for being interesting and a rate from interesting hands
     is not a rate of record. Reviews are the coach's; nothing here grades.
     ══════════════════════════════════════════════════════════ */

  function fracText(f) {
    if (!f || !f.n) return '—';
    return Hero.pct(f) + '%';
  }
  function fracN(f) { return f && f.n ? f.k + ' / ' + f.n : '—'; }

  function heroBlock() {
    var hands = store.hands;
    var st = Hero.stats(hands);
    var lk = Hero.leaks(hands);
    var unsent = hands.filter(function (x) { return !x.sentToCoachAt && Layers.heroWasIn(x); }).length;
    var h = '<div class="section"><h2>From logged hands</h2>' +
      '<p class="sub"><span class="mono">' + st.n + '</span> played of <span class="mono">' + st.logged +
      '</span> logged · your selection, so skewed towards the interesting ones</p>';
    if (!st.logged) {
      h += '<p class="hint">No hands yet. Record one at the table, or from memory on the Tonight tab.</p></div>';
      return h + coachBlock(lk, unsent);
    }
    h += '<div class="statgrid tight">' +
      stat('VPIP', fracText(st.vpip), '', fracN(st.vpip)) +
      stat('PFR', fracText(st.pfr), '', fracN(st.pfr)) +
      stat('3-bet', fracText(st.threeBet), '', fracN(st.threeBet)) +
      stat('To showdown', fracText(st.wtsd), '', fracN(st.wtsd)) +
      stat('Won at showdown', fracText(st.wsd), '', fracN(st.wsd)) +
      stat('Aggression', st.af.calls ? (Math.round(st.af.agg / st.af.calls * 10) / 10).toFixed(1) : (st.af.agg ? '∞' : '—'), '',
        st.af.agg + ' bets · ' + st.af.calls + ' calls, postflop') +
      '</div>' +
      '<p class="hint" style="margin-top:12px">Hands you were dealt but did not play (a blind folded, a walk) count in the ' +
      'VPIP denominator only. Money on a hand is an estimate and never reaches the figures above the line.</p></div>';
    return h + coachBlock(lk, unsent);
  }

  function coachBlock(lk, unsent) {
    var h = '<div class="section"><h2>Leaks</h2>' +
      '<p class="sub">the coach’s tags across the hands you played · <span class="mono">' + lk.reviewed +
      '</span> of <span class="mono">' + lk.played + '</span> reviewed</p>';
    if (!lk.tags.length) {
      h += '<p class="hint">No reviewed hands yet. Send the hands to the coach and import what comes back; the tags roll up here.</p>';
    } else {
      var top = lk.tags.slice(0, 6);
      var max = top[0].n;
      h += '<div class="leaks">' + top.map(function (t) {
        return '<div class="leak"><div class="r"><span>' + esc(t.tag) + '</span><span class="n">' + t.n + ' / ' + lk.played + '</span></div>' +
          '<div class="bar"><span style="width:' + Math.round(100 * t.n / max) + '%"></span></div></div>';
      }).join('') + '</div>';
      var gk = Object.keys(lk.grades);
      if (gk.length) {
        h += '<p class="hint" style="margin-top:12px">Grades: ' + gk.map(function (g) { return g + ' ' + lk.grades[g]; }).join(' · ') + '.</p>';
      }
    }
    h += '</div>';

    var hero = heroRecord();
    var rd = hero && Profile.current(hero);
    h += '<div class="section"><h2>The coach on you</h2>';
    if (rd) {
      h += '<div class="read">' + peekRead(hero) + '</div>';
    } else {
      h += '<div class="read"><p class="muted-t">No read on you yet. It is written by the coach from the hands you send, ' +
        'never by you — the hub stores it and counts what it stands on.</p></div>';
    }
    h += '<div class="dact"><button class="btn btn-primary" data-act="export-coach">' + icon('share-network', 16) +
      ' Send hands to the coach' + (unsent ? ' <span class="badge">' + unsent + '</span>' : '') + '</button>' +
      '<button class="btn btn-ghost" data-act="pick-import">' + icon('upload-simple', 16) + ' Import what came back</button></div>' +
      '<p class="hint">One file out — every hand not yet sent, as the coach’s own records, plus everything seen of everyone. ' +
      'One file back — reviews land on the hands, reads on the people. Nothing here grades a hand.</p></div>';

    var c = store.counts();
    h += '<div class="section"><h2>Everything else</h2><div class="rowlist">' +
      '<button class="lrow quiet" data-act="go" data-to="hands">' + icon('spade', 18) +
      '<span class="g"><span class="a">All hands</span><span class="b">' + plural(c.hands, 'hand') + ', every night</span></span>' + icon('caret-right', 16) + '</button>' +
      '<button class="lrow quiet" data-act="log-night">' + icon('calendar-blank', 18) +
      '<span class="g"><span class="a">Log a past night</span><span class="b">A night that happened without the app — the money, the hours, who was there</span></span>' + icon('caret-right', 16) + '</button>' +
      '<button class="lrow quiet" data-act="go" data-to="data">' + icon('download-simple', 18) +
      '<span class="g"><span class="a">Data & backup</span><span class="b">Import, back up, restore, undo</span></span>' + icon('caret-right', 16) + '</button>' +
      '</div></div>';
    return h;
  }

  /** A player record flagged as him, if one exists — the coach can write a
   *  read on the hero too, and it needs somewhere to land. */
  function heroRecord() {
    return store.db.players.filter(function (p) { return p.hero; })[0] || null;
  }

  function viewHome() {
    var h = banners();
    if (!store.db.sessions.length) return h + emptyState();

    var settings = store.db.settings, sessions = store.db.sessions;
    var k = Stats.kpis(sessions, settings);
    var wr = Stats.winRate(sessions, settings);
    var excluded = Layers.excludedFromRates(sessions);
    var v = VERDICT[wr.verdict] || VERDICT.none;

    /* The verdict, as the page's one display flash. */
    h += '<div class="section"><p class="verdict ' + v.k + '">' + esc(v.label) + '</p>';
    if (wr.ok) {
      h += '<p class="ci-line">Over ' + plural(k.sessions, 'counted night') + ' and ' +
        esc(Stats.fmtNum(k.hours, 1)) + ' hours, ' + esc(signed(wr.r)) + ' an hour — and 95% of the ' +
        'time the true rate sits between ' + esc(signed(wr.lo)) + ' and ' + esc(signed(wr.hi)) + '.' +
        (wr.verdict === 'unproven' && wr.hoursToSig != null
          ? ' That still straddles zero; at this rate and this variance it would clear it after about ' +
          esc(Stats.fmtNum(Math.round(wr.hoursToSig), 0)) + ' more hours.'
          : wr.verdict === 'winner' ? ' The whole interval sits above zero.'
            : wr.verdict === 'loser' ? ' The whole interval sits below zero.' : '') + '</p>';
      h += Charts.slot('ci', wr, 96);
      h += '<div class="ci-figures">' +
        ciFig('Per hour', signed(wr.r)) + ciFig('Low', signed(wr.lo)) +
        ciFig('High', signed(wr.hi)) + ciFig('Hours', Stats.fmtNum(k.hours, 1)) + '</div>';
      h += '<p class="assume">Variance is modelled per hour, not per session, so a nine-hour night ' +
        'carries nine times the swing of a one-hour one.</p>';
    } else {
      h += '<p class="ci-line">Two counted nights and this starts working. ' +
        plural(k.sessions, 'night') + ' so far.</p>';
    }
    h += '</div>';

    var series = Stats.bankrollSeries(sessions, settings.startingBankroll, settings);
    var bankroll = series.length ? series[series.length - 1].value : Stats.num(settings.startingBankroll);
    h += '<div class="section"><h2>Bankroll</h2><p class="sub">' +
      plural(k.sessions, 'counted night') +
      (k.logged > k.sessions ? ' of ' + k.logged + ' logged' : '') +
      ' · <span class="mono">' + esc(money(bankroll)) + '</span> now' +
      (Stats.num(settings.startingBankroll) ? ', from <span class="mono">' + esc(money(Stats.num(settings.startingBankroll))) + '</span>' : '') +
      '</p><div class="kpis">' +
      statcard('Result', signed(k.net), cls(k.net)) +
      statcard('Per hour', signed(k.perHour), cls(k.perHour)) + '</div>';
    if (series.length >= 2) {
      h += Charts.slot('bankroll', {
        points: series, reference: Stats.num(settings.startingBankroll),
        firstDate: series[0].date || (series[1] || {}).date,
        lastDate: series[series.length - 1].date
      }, 200);
    }
    h += '</div>';

    h += '<div class="section"><h2>The numbers</h2><div class="statgrid">' +
      stat('bb / hour', k.bbPerHour ? Stats.fmtNum(k.bbPerHour, 1) : '—', cls(k.bbPerHour)) +
      stat('Winning nights', k.sessions ? Stats.fmtPct(k.winPct) : '—', '') +
      stat('Average length', k.avgHours ? Stats.fmtNum(k.avgHours, 1) + ' h' : '—', '') +
      stat('Best night', k.best == null ? '—' : signed(k.best), cls(k.best)) +
      stat('Worst night', k.worst == null ? '—' : signed(k.worst), cls(k.worst)) +
      stat('Nights logged', String(k.logged), '') + '</div>';
    if (excluded.noHours.length || excluded.noMoney.length) {
      h += '<p class="hint" style="margin-top:12px">' +
        (excluded.noHours.length ? plural(excluded.noHours.length, 'night') +
          ' with money but no hours (' + esc(signed(excluded.amount)) + ')' : '') +
        (excluded.noHours.length && excluded.noMoney.length ? ' and ' : '') +
        (excluded.noMoney.length ? plural(excluded.noMoney.length, 'night') +
          ' with hands but no money' : '') +
        ' are excluded from every figure above.</p>';
    }
    h += '</div>';

    var form = Charts.rollingForm(sessions, settings, 5);
    if (form) {
      h += '<div class="section"><h2>Recent form</h2>' +
        '<p class="sub">hourly rate over a rolling five nights, against the lifetime rate</p>' +
        Charts.slot('form', form, 180) + '</div>';
    }

    h += breakdown('By venue', Stats.groupBy(sessions, function (s) { return s.location || 'No venue'; }, settings));
    h += breakdown('By stakes', Stats.groupBy(sessions, function (s) { return s.stakes || 'Unknown'; }, settings));

    h += heroBlock();

    var recent = sortedSessions().slice(0, 5);
    h += '<div class="section"><h2>Recent nights</h2><div class="rowlist">' +
      recent.map(sessionRow).join('') + '</div>' +
      (store.db.sessions.length > recent.length
        ? '<button class="btn btn-ghost" data-act="go" data-to="nights" style="margin-top:12px">All ' +
        plural(store.db.sessions.length, 'night') + '</button>' : '') + '</div>';
    return h;
  }

  /**
   * `groupBy` returns a winRate object per key — `n` is the night count and
   * `r` the hourly rate; `sessions` is the array itself. Read the wrong
   * field and the table silently renders nothing at all.
   */
  function breakdown(title, rows) {
    var liveRows = (rows || []).filter(function (r) { return r.n > 0; });
    if (liveRows.length < 2) return '';
    liveRows.sort(function (a, b) { return b.net - a.net; });
    return '<div class="section"><h2>' + esc(title) + '</h2><div class="tscroll">' +
      '<table class="t compact"><thead><tr><th>' + esc(title.replace('By ', '')) +
      '</th><th class="n">Nights</th><th class="n">Hours</th><th class="n">Net</th>' +
      '<th class="n">Per hour</th></tr></thead><tbody>' +
      liveRows.map(function (r) {
        return '<tr><td>' + esc(r.key) + '</td><td class="n">' + r.n + '</td>' +
          '<td class="n">' + esc(Stats.fmtNum(r.hours, 1)) + '</td>' +
          '<td class="n ' + cls(r.net) + '">' + esc(signed(r.net)) + '</td>' +
          '<td class="n ' + cls(r.r) + '">' + esc(signed(r.r)) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  /* ══════════════════════════════════════════════════════════
     NIGHTS
     ══════════════════════════════════════════════════════════ */

  function sortedSessions() {
    return store.db.sessions.slice().sort(function (a, b) {
      var d = String(b.date || '').localeCompare(String(a.date || ''));
      return d !== 0 ? d : (b.seq || 0) - (a.seq || 0);
    });
  }

  function sessionRow(s) {
    var net = Layers.settledNet(s);
    var hands = store.handsFor(s.id).length;
    return '<button class="lrow" data-act="go" data-to="session" data-id="' + esc(s.id) + '">' +
      '<span class="g"><span class="a">' + esc(s.location || 'No venue') + '</span>' +
      '<span class="meta"><span>' + esc(fmtDate(s.date)) + '</span>' +
      '<span>' + esc(s.stakes || '—') + '</span>' +
      '<span>' + esc(hoursText(s.hours)) + '</span>' +
      '<span>' + plural(hands, 'hand') + '</span></span></span>' +
      (net == null ? '<span class="fig est">no money</span>'
        : '<span class="fig ' + cls(net) + '">' + esc(signed(net)) + '</span>') + '</button>';
  }

  function viewNights() {
    var sessions = sortedSessions();
    if (!sessions.length) return banners() + emptyState();
    var counted = sessions.filter(function (x) { return Layers.hasSettledMoney(x) && Layers.hasHours(x); }).length;
    return banners() +
      '<div class="line between" style="margin-bottom:12px"><span class="caption"><span class="mono">' + sessions.length +
      '</span> nights · <span class="mono">' + counted + '</span> counted in the rates</span>' +
      '<button class="btn btn-ghost" data-act="log-night">' + icon('plus', 15) + ' Log a past night</button></div>' +
      '<div class="rowlist">' + sessions.map(sessionRow).join('') + '</div>';
  }

  function viewSession() {
    var s = store.sessionById(VIEW.id);
    if (!s) return '<div class="page-state"><h3>That night is not here</h3>' +
      '<p>It may have been removed by an import.</p></div>';
    var hands = store.handsFor(s.id);
    var net = Layers.settledNet(s);
    var d = Layers.drift(s, hands);

    var h = '<p class="hint">' + esc(fmtDate(s.date)) + ' · ' + esc(s.variant || 'NLHE') +
      (s.stakes ? ' · ' + esc(s.stakes) : '') + ' · ' + esc(hoursText(s.hours)) + '</p>';

    h += '<div class="section"><h2>Counted</h2><p class="sub">buy-in and cash-out, from the table</p>';
    if (net == null) {
      h += '<p class="hint">No money recorded. This night was logged from hands alone, and stays out ' +
        'of every rate until a tracker file or a cash-out is added.</p>';
    } else {
      h += '<div class="statgrid">' +
        stat('Buy-in', money(s.buyIn), '') +
        stat('Cash-out', money(s.cashOut), '') +
        (s.expenses ? stat('Expenses', money(s.expenses), '') : '') +
        (s.rake ? stat('Rake', money(s.rake), '') : '') +
        stat('Result', signed(net), cls(net)) +
        (Layers.hasHours(s) ? stat('Per hour', signed(net / Number(s.hours)), cls(net)) : '') +
        '</div><p class="hint" style="margin-top:12px">' + (Layers.hasHours(s)
          ? 'This is the figure that feeds your win rate.'
          : 'No hours recorded, so this night is excluded from every rate.') + '</p>';
    }
    h += '</div>';

    h += '<div class="section"><h2>From the hands <span class="pill">' + esc(Layers.EST_TAG) +
      '</span></h2><p class="sub">eyeballed stacks and pots — an estimate</p><div class="statgrid">' +
      stat('Hands logged', String(hands.length), '') +
      stat('Their total', hands.length ? est(d.estimated) : '—', 'est') +
      (d.meaningful ? stat('Drift', est(d.drift), 'est') : '') +
      '</div><p class="hint" style="margin-top:12px">' + (d.meaningful
        ? 'You only log the interesting hands, so these never sum to the night. Drift matters as a ' +
        'run, not as one figure — a consistent direction over many nights means the stack estimates ' +
        'are off.'
        : 'Nothing to compare yet.') + '</p></div>';

    var rows = store.db.ledger.filter(function (r) { return r.sessionId === s.id; });
    var tip = Layers.dealerTip(s), dname = Layers.dealerName(s);
    if (rows.length) {
      h += '<div class="section"><h2>Who was there</h2><div class="rowlist">';
      rows.slice().sort(function (a, b) { return (b.net || 0) - (a.net || 0); }).forEach(function (r) {
        var p = store.playerById(r.playerId);
        h += '<button class="lrow" data-act="go" data-to="player" data-id="' + esc(r.playerId) + '">' +
          '<span class="g"><span class="a">' + esc(p ? p.name : 'Unknown') + '</span>' +
          '<span class="meta"><span>' + esc(money(r.buyIn)) + ' in</span>' +
          '<span>' + (r.cashOut == null ? 'still in' : esc(money(r.cashOut)) + ' out') +
          '</span></span></span>' +
          '<span class="fig ' + cls(r.net) + '">' + esc(signed(r.net)) + '</span></button>';
      });
      /* The dealer's line sits with the people, because that is where the
         money that is in nobody's net went. Then the sum: with the tip in,
         a night that balanced at the table balances here too. */
      if (tip > 0) {
        h += '<div class="lrow flat"><span class="g"><span class="a">' + (dname ? esc(dname) : 'Dealer') +
          '<span class="pill pnone sm" style="margin-left:8px">dealer</span></span>' +
          '<span class="meta"><span>tip, funded from the pot</span></span></span>' +
          '<span class="fig">' + esc(signed(tip)) + '</span></div>';
      }
      h += '</div>';
      if (net != null) {
        var others = rows.reduce(function (a2, r) { return a2 + (Number(r.net) || 0); }, 0);
        var sumAll = Settle.round2(others + net + tip);
        h += '<p class="hint" style="margin-top:10px">' +
          'Players ' + esc(signed(Settle.round2(others + net))) +
          (tip > 0 ? ' · dealer ' + esc(signed(tip)) : '') + ' → ' +
          (sumAll === 0
            ? 'balances to zero.'
            : esc(money(Math.abs(sumAll))) + (sumAll > 0 ? ' in excess' : ' missing') +
            ' — a night that does not reconcile. ' +
            (rows.some(function (r) { return r.cashOut == null; }) ? 'Somebody has no cash-out recorded.' :
              'Somebody\u2019s result, or the dealer\u2019s tip, is not in the log.')) +
          '</p>';
      }
      h += '</div>';
    } else if (tip > 0) {
      h += '<div class="section"><h2>Dealer</h2><p class="hint">' + (dname ? esc(dname) + ' dealt. ' : '') +
        'Tip ' + esc(money(tip)) + ', funded from the pot.</p></div>';
    }

    if ((s.liveNotes || []).length) {
      h += '<div class="section"><h2>Reads from that night</h2><ul class="notelist">' +
        s.liveNotes.slice().reverse().map(function (n) {
          return '<li><span class="t">' + esc(hhmm(n.t)) + '</span>' +
            '<span class="g">' + (n.name ? '<span class="who">' + esc(n.name) + ' · </span>' : '') +
            esc(n.text) + '</span><span class="tag">' + esc(n.cat || 'Note') + '</span></li>';
        }).join('') + '</ul></div>';
    }

    if (hands.length) {
      h += '<div class="section"><h2>Hands</h2><div class="rowlist">' +
        hands.map(handRow).join('') + '</div></div>';
    }

    h += '<div class="section"><h2>This night</h2><div class="line">' +
      '<button class="btn btn-ghost" data-act="edit-session" data-id="' + esc(s.id) + '">Edit it</button>' +
      '<button class="btn btn-ghost" data-act="del-session" data-id="' + esc(s.id) + '">Remove it</button>' +
      '</div></div>';
    return h;
  }

  /* ══════════════════════════════════════════════════════════
     HANDS
     ══════════════════════════════════════════════════════════ */

  /**
   * What a hand is called. Since v0.7 every recorded hand carries a name —
   * his instruction, 08/09/2026 — and one it wrote for itself if he did
   * not type one. Older and imported hands fall back to their number.
   */
  function handTitle(hd) {
    return String((hd && hd.name) || '').trim() || ('Hand ' + (hd ? hd.no : '?'));
  }

  /** A half-recorded hand, named for a sentence that has to warn about it. */
  function recTitle() {
    var r = rec();
    if (!r) return 'That hand';
    return String(r.hand.name || '').trim() || ('Hand ' + r.hand.no);
  }

  function handRow(hd) {
    var s = store.sessionById(hd.sessionId);
    var board = hd.board ? (hd.board.flop || []).concat(hd.board.turn || [], hd.board.river || []) : [];
    var wasIn = Layers.heroWasIn(hd);
    var title = esc(handTitle(hd)) +
      ((hd.heroCards || []).length
        ? ' ' + cardChips(hd.heroCards, 'sm')
        : wasIn
          ? ' <span class="muted-t">· your cards not recorded</span>'
          : ' <span class="muted-t">· watched</span>');
    return '<button class="lrow" data-act="go" data-to="hand" data-id="' + esc(hd.id) + '">' +
      '<span class="g"><span class="a">' + title + '</span>' +
      '<span class="meta"><span>' + esc(fmtDate(hd.date)) + '</span>' +
      (s && s.location ? '<span>' + esc(s.location) + '</span>' : '') +
      (wasIn ? '<span>' + esc(hd.heroPosition || '—') + '</span>' : '') +
      (board.length ? '<span>' + cardChips(board, 'sm') + '</span>' : '') +
      '<span>pot ' + esc(Settle.plain(hd.pot)) + '</span>' +
      (hd.note ? '<span class="clip">' + esc(hd.note) + '</span>' : '') + '</span></span>' +
      '<span class="fig est">' +
      (!wasIn && !hd.heroNet ? '—' : esc(est(hd.heroNet))) + '</span></button>';
  }

  function viewHands() {
    var list = store.hands.slice().reverse();
    var filterName = '';
    if (VIEW.filter && VIEW.filter.playerId) {
      var p = store.playerById(VIEW.filter.playerId);
      filterName = p ? p.name : '';
      list = list.filter(function (hd) {
        return (hd.players || []).some(function (x) { return x.playerId === VIEW.filter.playerId; });
      });
    }
    var newHand = '<div class="line" style="margin-bottom:14px">' +
      '<button class="btn btn-primary" data-act="recall-start">' + icon('spade', 16) +
      ' Record a hand</button>' +
      (rec() ? '<button class="btn btn-ghost" data-act="rec-open">' + icon('arrow-clockwise', 15) +
        ' Carry on with hand ' + esc(String(rec().hand.no)) + '</button>' : '') + '</div>';

    if (!store.hands.length) {
      return newHand + '<div class="empty"><h3>No hands yet</h3>' +
        '<p>Record one from memory — pick the night, add who was in it, and play it through. ' +
        'A hand can also be recorded at the table from the Live tab, or arrive with a Hand recall ' +
        'export. Every hand keeps its street-by-street log, the board, every player’s line and ' +
        'your note.</p>' +
        '<button class="btn btn-ghost" data-act="go" data-to="data" style="margin-top:16px">' +
        'Import a file instead</button></div>';
    }
    var h = newHand;
    if (filterName) {
      h += '<div class="chips" style="margin-bottom:12px">' +
        '<span class="pill pill-ocean">Hands with ' + esc(filterName) + '</span>' +
        '<button class="chipbtn" data-act="clear-filter">Show all</button></div>';
    }
    h += '<p class="hint">' + plural(list.length, 'hand') +
      '. Every figure here is estimated — pot sizes and stacks are eyeballed at the table.</p>';
    if (!list.length) return h + '<div class="empty"><h3>None match that filter</h3></div>';
    return h + '<div class="rowlist" style="margin-top:12px">' + list.map(handRow).join('') + '</div>';
  }

  function viewHand() {
    var hd = store.handById(VIEW.id);
    if (!hd) return '<div class="page-state"><h3>No such hand</h3></div>';
    var s = store.sessionById(hd.sessionId);

    var wasIn = Layers.heroWasIn(hd);
    var h = '<h2 class="handname">' + esc(handTitle(hd)) + '</h2>' +
      '<p class="hint">' + esc(fmtDate(hd.date)) +
      (s && s.location ? ' · ' + esc(s.location) : '') +
      ' · ' + esc(hd.tableSize || '?') + ' handed' +
      (hd.sb && hd.bb ? ' · ' + esc(cur() + hd.sb + '/' + hd.bb) : '') +
      (wasIn ? '' : ' · one you watched') + '</p>';

    h += '<div class="handtop"><div><span class="lbl">You' +
      (wasIn && hd.heroPosition ? ' · ' + esc(hd.heroPosition) : '') + '</span>' +
      ((hd.heroCards || []).length ? cardChips(hd.heroCards)
        : '<span class="muted-t">' + (wasIn ? 'not recorded' : 'not in it') + '</span>') + '</div>';
    var board = (hd.board ? (hd.board.flop || []).concat(hd.board.turn || [], hd.board.river || []) : []);
    if (board.length) h += '<div><span class="lbl">Board</span>' + cardChips(board) + '</div>';
    h += '</div>';

    h += '<div class="section"><h2>Result <span class="pill">' + esc(Layers.EST_TAG) + '</span></h2>' +
      '<p class="sub">estimated — the pot was eyeballed</p><div class="statgrid">' +
      stat('Pot', Settle.plain(hd.pot), '') +
      stat('Your net', est(hd.heroNet), 'est') +
      (hd.heroNetBB ? stat('In big blinds', '~' + Stats.fmtNum(hd.heroNetBB, 1), 'est') : '') +
      (hd.effStack ? stat('Effective stack', Settle.plain(hd.effStack), '') : '') +
      (hd.straddle ? stat('Straddle', hd.straddle.position + ' ' + hd.straddle.amount, '') : '') +
      '</div></div>';

    /* One text: what he reads here is what he copies, and what the picture
       draws. Deriving it rather than printing the archived copy is what
       keeps those three the same on a hand recorded before v0.8. */
    var log = handText(hd);
    if (log) h += '<div class="section"><h2>The hand</h2>' + handLog(log) + '</div>';
    else if ((hd.actions || []).length) {
      h += '<div class="section"><h2>The hand</h2>' + fallbackLog(hd) + '</div>';
    }
    if (hd.note) h += '<div class="section"><h2>Your note</h2><p>' + esc(hd.note) + '</p></div>';

    var seats = (hd.players || []).filter(function (p) { return !p.hero; });
    if (seats.length) {
      h += '<div class="section"><h2>At the table</h2><div class="rowlist">';
      seats.forEach(function (p) {
        var known = p.playerId && store.playerById(p.playerId);
        /* The log is history and keeps the spelling it was recorded with.
           This list is identity, so it shows the person's own name — with
           the recorded spelling beside it when the two differ. */
        var shown = known ? known.name : Ident.seatName(p.name, p.position);
        var alsoAs = (known && p.name && !Ident.sameName(known.name, p.name))
          ? ' <span class="muted-t">· in the log as ' + esc(p.name) + '</span>' : '';
        /* Somebody who was never dealt in reads as "folded" beside
           somebody who folded the button, which is the distinction the
           whole cast idea exists to keep. The cast is the right test
           here — it is who was in the hand, not the stricter question of
           who was *significant* in it, which is the one Ernest set for
           himself. An older or imported hand has no cast, so it falls
           back to what it does carry, and claims nothing without it. */
        var sat = Array.isArray(hd.cast) ? hd.cast.indexOf(p.seat) < 0 : p.inHand === false;
        h += '<' + (known ? 'button' : 'div') + ' class="lrow' + (known ? '' : ' flat') +
          (sat ? ' dim' : '') + '"' +
          (known ? ' data-act="go" data-to="player" data-id="' + esc(p.playerId) + '"' : '') + '>' +
          '<span class="g"><span class="a">' + esc(shown) + alsoAs + '</span>' +
          '<span class="meta"><span>' + esc(p.position || '') + '</span>' +
          (sat ? '<span>not in it</span>'
            : (p.cards || []).length ? '<span>' + cardChips(p.cards, 'sm') + '</span>'
              : p.folded ? '<span>folded</span>' : '<span>mucked</span>') +
          (!sat && p.folded && (p.cards || []).length ? '<span>folded</span>' : '') +
          (p.allin ? '<span>all in</span>' : '') +
          '</span></span><span class="fig est">' + esc(est(p.net)) + '</span>' +
          '</' + (known ? 'button' : 'div') + '>';
      });
      h += '</div></div>';
    }

    if (s) {
      h += '<div class="section"><h2>The night</h2>' +
        '<button class="btn btn-ghost" data-act="go" data-to="session" data-id="' + esc(s.id) + '">' +
        esc(s.location || 'No venue') + ' · ' + esc(fmtDate(s.date)) + '</button></div>';
    }
    h += '<div class="section"><h2>This hand</h2><div class="line">' +
      '<button class="btn btn-primary" data-act="hand-share" data-id="' + esc(hd.id) + '">' +
      icon('share-network', 16) + ' Share it</button>' +
      '<button class="btn btn-ghost" data-act="del-hand" data-id="' + esc(hd.id) +
      '">Remove it</button></div></div>';
    return h;
  }

  function fallbackLog(hd) {
    var TAG = { preflop: 'PF', flop: 'F', turn: 'T', river: 'R' };
    var byStreet = {};
    (hd.actions || []).forEach(function (a) { (byStreet[a.street] = byStreet[a.street] || []).push(a); });
    var out = '';
    ['preflop', 'flop', 'turn', 'river'].forEach(function (st) {
      if (!byStreet[st]) return;
      var cards = st === 'flop' ? (hd.board.flop || []) : st === 'turn' ? (hd.board.turn || [])
        : st === 'river' ? (hd.board.river || []) : [];
      out += '<div class="line" style="margin-bottom:8px"><span class="tag">' + TAG[st] + '</span>' +
        (cards.length ? cardChips(cards, 'sm') : '') +
        '<span class="hint" style="flex:1 1 100%;margin:0">' + byStreet[st].map(function (a) {
          return esc(Ident.seatName(a.player, a.position)) + ' ' + esc(a.action) +
            (a.to != null ? ' ' + esc(Settle.plain(a.to)) : '');
        }).join(' · ') + '</span></div>';
    });
    return out;
  }

  /* ══════════════════════════════════════════════════════════
     PLAYERS
     ══════════════════════════════════════════════════════════ */

  function playerTotals(id) {
    var net = 0, nights = 0;
    store.db.ledger.forEach(function (r) {
      if (r.playerId !== id || r.net == null) return;
      net += r.net; nights++;
    });
    var hands = store.hands.filter(function (h) {
      return (h.players || []).some(function (p) { return p.playerId === id; });
    }).length;
    return { net: net, nights: nights, hands: hands };
  }

  function viewPlayers() {
    if (!store.db.players.length) {
      return '<div class="empty"><h3>No players yet</h3>' +
        '<p>They arrive with the first night or the first import. Everyone at the table gets a ' +
        'record; you do not — your own money lives on the session.</p></div>';
    }
    var sortKey = (VIEW.filter && VIEW.filter.sort) || 'net';
    var rows = Metrics.table(store, sortKey);
    var sum = Metrics.summary(store);
    var h = '';

    /* The two ends of the table, which is the question as he asked it. */
    if (sum.best && sum.worst && sum.best.id !== sum.worst.id) {
      h += '<div class="stats">' +
        statcard('Makes the most', signed(sum.best.net), cls(sum.best.net), sum.best.name) +
        statcard('Makes the least', signed(sum.worst.net), cls(sum.worst.net), sum.worst.name) +
        '</div>';
    }

    h += '<p class="hint" style="margin-top:14px">Counted money only — the chips at the end of ' +
      'each night, never a figure worked out from a hand. ' +
      plural(sum.players, 'opponent') + ' with a settled night' +
      (sum.dealerTotal ? '; ' + esc(money(sum.dealerTotal)) + ' in dealer tips counted as the pot\u2019s, not anyone\u2019s' : '') +
      (sum.unreconciled ? '. ' + esc(money(Math.abs(sum.unreconciled))) +
        ' does not reconcile against your own results, which is money in nights that never ' +
        'balanced.' : '.') + '</p>';

    function aliasesOf(id) {
      var pl = store.playerById(id);
      if (!pl || !pl.aliases) return '';
      var a = pl.aliases.filter(function (x) {
        return x && String(x).trim() !== String(pl.name).trim();
      });
      return a.length ? a.join(', ') : '';
    }
    /* The type rides beside the name, so the list answers "who is who"
       as well as "who is up". Nothing when there is no read, rather than a
       placeholder on every row. */
    function readTag(id) {
      var pl = store.playerById(id);
      var cur = pl && Profile.current(pl);
      return cur && cur.type ? ' ' + typePill(cur.type, true) : '';
    }
    var COLS = [['net', 'Net'], ['perNight', 'A night'], ['perHour', 'An hour'],
    ['nights', 'Nights'], ['volume', 'Bought in'], ['winRate', 'Up %']];
    h += '<div class="chips" style="margin:12px 0">' + COLS.map(function (c) {
      return '<button class="chipbtn' + (sortKey === c[0] ? ' on' : '') +
        '" data-act="sort-players" data-sort="' + c[0] + '">' + c[1] + '</button>';
    }).join('') + '</div>';

    h += '<div class="tscroll"><table class="t"><thead><tr>' +
      '<th>Player</th><th class="n">Net</th><th class="n">A night</th>' +
      '<th class="n">An hour</th><th class="n">Nights</th><th class="n">Up %</th>' +
      '</tr></thead><tbody>' + rows.map(function (x) {
        return '<tr class="clickable" data-act="go" data-to="player" data-id="' + esc(x.id) + '">' +
          '<td>' + esc(x.name) + readTag(x.id) +
          (x.nights ? '' : ' <span class="muted-t">· no counted night</span>') +
          (aliasesOf(x.id) ? '<span class="alias">also ' + esc(aliasesOf(x.id)) + '</span>' : '') +
          '</td>' +
          '<td class="n ' + cls(x.net) + '">' + esc(signed(x.net)) + '</td>' +
          '<td class="n ' + cls(x.perNight || 0) + '">' +
          (x.perNight == null ? '—' : esc(signed(x.perNight))) + '</td>' +
          '<td class="n ' + cls(x.perHour || 0) + '">' +
          (x.perHour == null ? '—' : esc(signed(x.perHour))) + '</td>' +
          '<td class="n">' + x.nights + '</td>' +
          '<td class="n">' + (x.winRate == null ? '—' : x.winRate + '%') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>';
    return h;
  }

  /* ══════════════════════════════════════════════════════════
     ONE PERSON

     A phone screen of what is known about them, and nothing else. The
     admin — their name, the names they answer to, merging, removing —
     lives behind the gear, because it is done once and read never.
     ══════════════════════════════════════════════════════════ */

  function viewPlayer() {
    var p = store.playerById(VIEW.id);
    if (!p) return '<div class="page-state"><h3>No such player</h3></div>';
    var t = playerTotals(p.id);
    var m = Metrics.forPlayer(store, p.id);
    var h = '';

    /* The headline, big: what they are up or down in his games. */
    h += '<div class="phead"><div class="pverdict ' + cls(m.net) + '">' + esc(signed(m.net)) +
      '</div><div class="psub">' +
      (m.nights
        ? plural(m.nights, 'night') + ' · ' + esc(signed(m.perNight)) + ' a night' +
        (m.perHour == null ? '' : ' · ' + esc(signed(m.perHour)) + ' an hour')
        : 'no counted night yet') + '</div>' +
      /* Labelled, not a bare gear: the app header already has one of
         those, and two stacked in a corner is a puzzle rather than an
         affordance. */
      '<button class="btn btn-ghost phead-gear" data-act="player-settings" data-id="' +
      esc(p.id) + '">' + icon('gear', 15) + ' Settings</button></div>';

    var als = aliasesOf(p);
    if (als) h += '<p class="hint">Also answers to ' + esc(als) + '.</p>';

    /* **The read comes before the money.** Ernest, 10/09/2026: what he
       wants from a profile is *"player tendencies and labelling"* — the
       thing he needs at the table is who this is and what to do about it,
       and their net is a number he can reach one scroll down. */
    var evidence = Profile.gather(store, p);
    h += readBlock(p, evidence);
    /* The evidence sits under the read it supports, not under twenty-six
       rows of money — on 29/09 Thomas's observations were a long scroll
       below his nights, which is backwards for a page about how he plays. */
    h += evidenceBlock(p, evidence);
    h += historyBlock(p);

    /* Two columns on a phone, four on anything wider. Nothing here needs a
       line of its own. */
    h += '<div class="section"><h2>Counted</h2>' +
      '<p class="sub">chips at the end of the night — never a figure worked out from a hand</p>' +
      '<div class="statgrid tight">' +
      stat('Nights', String(m.nights), '',
        m.firstSeen ? fmtDate(m.firstSeen) + ' → ' + fmtDate(m.lastSeen) : '') +
      stat('Finishes up', m.winRate == null ? '—' : m.winRate + '%', '',
        m.nights ? m.up + ' of ' + m.nights : '') +
      stat('Bought in', money(m.volume), '',
        m.returnOnBuyIn == null ? ''
          : (m.returnOnBuyIn > 0 ? '+' : '') + m.returnOnBuyIn + '% back') +
      stat('Hours', m.hours ? String(m.hours) : '—', '',
        m.hoursNights && m.hoursNights < m.nights
          ? 'over ' + m.hoursNights + ' with a clock' : '') +
      (m.best && m.nights > 1
        ? stat('Best night', signed(m.best.net), cls(m.best.net), fmtDate(m.best.date))
        : '') +
      (m.worst && m.nights > 1
        ? stat('Worst', signed(m.worst.net), cls(m.worst.net), fmtDate(m.worst.date))
        : '') +
      (m.streak
        ? stat('On a run', m.streak + (m.streakDir > 0 ? ' up' : ' down'),
          m.streakDir > 0 ? 'neg' : 'pos', 'their last ' + plural(m.streak, 'night'))
        : '') +
      (t.hands ? stat('Hands', String(t.hands), '', 'logged with them') : '') +
      '</div>';

    if (m.heroNights) {
      h += '<div class="pv" style="margin-top:14px"><h4>On the nights they played</h4>' +
        '<ul><li>You are ' + esc(signed(m.heroNet)) + ' across ' +
        plural(m.heroNights, 'night') + ' with them — ' + esc(signed(m.heroPerNight)) +
        ' a night</li></ul>' +
        '<p class="hint">A correlation, not a cause. They may simply sit at the good games.</p>' +
        '</div>';
    }
    if (t.hands) {
      h += '<button class="btn btn-ghost" data-act="player-hands" data-id="' + esc(p.id) +
        '" style="margin-top:14px">Every hand with ' + esc(p.name) + '</button>';
    }
    h += '</div>';

    var rows = store.db.ledger.filter(function (r) { return r.playerId === p.id; })
      .map(function (r) { return store.resolveLedgerRow(r); })
      .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    if (rows.length) {
      h += '<div class="section"><h2>Their nights</h2><div class="rowlist">' + rows.map(function (r) {
        return '<button class="lrow" data-act="go" data-to="session" data-id="' + esc(r.sessionId || '') + '">' +
          '<span class="g"><span class="a">' + esc(r.venue || 'No venue') + '</span>' +
          '<span class="meta"><span>' + esc(fmtDate(r.date)) + '</span>' +
          (r.buyIn == null ? '' : '<span>' + esc(money(r.buyIn)) + ' in</span>') + '</span></span>' +
          '<span class="fig ' + cls(r.net) + '">' + esc(signed(r.net)) + '</span></button>';
      }).join('') + '</div></div>';
    }

    return h;
  }

  /* ══════════════════════════════════════════════════════════
     THE READ

     Who someone is at the table, in his own framework's terms: a type,
     then `entry · after the flop · the exploit`, then the two questions
     that type a player in a multiway unraked game — does he attack a
     check, does he fold to a raise. Signed and dated, and never replaced
     without the old one going into history.

     The hub writes none of the judgement. It counts the evidence under
     it, and it says when there is new evidence the read has not seen.
     ══════════════════════════════════════════════════════════ */

  function todayISO() {
    var d = new Date();
    var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }

  var FIELD_LABEL = {
    type: 'type', qualifier: 'summary', entry: 'entry', postflop: 'after the flop',
    exploit: 'the exploit', attacksCheck: 'attacks a check', foldsToRaise: 'folds to a raise',
    tells: 'tells'
  };
  function fieldLabel(f) { return FIELD_LABEL[f] || f; }

  function typePill(key, small) {
    var t = Profile.typeOf(key);
    return t ? '<span class="pill ptype' + (small ? ' sm' : '') + '">' + esc(t.label) + '</span>'
      : '<span class="pill pnone' + (small ? ' sm' : '') + '">Not typed</span>';
  }

  function whoWrote(r) {
    return r.by === 'coach' ? 'the coach' : (r.by === 'you' ? 'you' : r.by);
  }

  /** "28 reads over 9 nights, 13 of them tabled" — the pile the read stands on. */
  function sampleLine(s) {
    if (!s.reads) return 'nothing observed yet';
    return plural(s.reads, 'observation') + ' over ' + plural(s.nights, 'night') +
      (s.tabled ? ', ' + s.tabled + ' where they tabled their hand' : '');
  }

  function readBlock(p, evidence) {
    var cur = Profile.current(p);
    var smp = Profile.sample(evidence);
    var tr = Profile.tier(smp);
    var h = '<div class="section dsec"><h2>The read</h2>';

    if (!cur) {
      h += '<div class="dossier empty-read"><p>No read on ' + esc(p.name) + ' yet.' +
        (smp.reads ? ' There ' + (smp.reads === 1 ? 'is one observation' : 'are ' + smp.reads +
          ' observations') + ' below to write one from.' : '') + '</p>' +
        '<p class="hint">The coach writes it from what you send — a type in your framework, the entry, ' +
        'the play after the flop, the exploit. Tells you note at the table go with the observations.</p>' +
        '<div class="dact"><button class="btn btn-ghost" data-act="export-coach">' + icon('share-network', 15) +
        ' Send to the coach</button></div>' +
        '</div></div>';
      return h;
    }

    var t = Profile.typeOf(cur.type);
    var fresh = Profile.since(cur, evidence);
    function row(label, text, cls2) {
      return text ? '<dt>' + label + '</dt><dd' + (cls2 ? ' class="' + cls2 + '"' : '') + '>' +
        esc(text) + '</dd>' : '';
    }
    function axis(label, v) {
