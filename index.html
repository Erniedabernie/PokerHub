    });

    return {
      stage: seats.length >= 2 ? 'setup' : 'empty',
      recall: false,
      sessionId: opts.sessionId || null,
      /* Who was in the hand. Everyone starts in it — dropping people is
         one tap and adding a whole table is nine. */
      cast: seats.map(function (s) { return s.seat; }),
      hand: {
        id: opts.id || null,
        no: opts.no || 1,
        ts: opts.now || 0,
        date: opts.date || '',
        venue: opts.venue || '',
        currency: opts.currency || 'HKD',
        /* Ernest, 08/09/2026: *"when i record a hand it should have a
           name attached to it."* Empty means "use the one the hand
           writes for itself" — see `autoName`. He never has to type one,
           and every hand still has one. */
        name: opts.name || '',
        sb: stakes ? stakes.sb : null,
        bb: stakes ? stakes.bb : null,
        ante: 0,
        straddle: null,
        effStack: 0,
        seats: seats,
        buttonSeat: seats.length ? seats[seats.length - 1].seat : 0,
        actions: [],
        boards: [[], [], [], []],
        hole: {},
        winners: [],
        note: ''
      },
      /* Ernest's own verdict, when he disagrees with the evaluator or it
         had nothing to go on. Null means "use what the cards say". */
      override: null
    };
  }

  /** Everyone in the hand, in action order — small blind first. */
  function order(rec) {
    return HR.seatOrder(rec.hand.seats.map(function (s) { return s.seat; }), rec.hand.buttonSeat);
  }

  function seatById(rec, seat) {
    for (var i = 0; i < rec.hand.seats.length; i++) {
      if (rec.hand.seats[i].seat === seat) return rec.hand.seats[i];
    }
    return null;
  }

  /* ── setting the hand up ───────────────────────────────────── */

  /**
   * Take somebody off the table altogether.
   *
   * This is the **recall** path's eraser — somebody added by mistake to a
   * remembered table. It is not how you say "he was not in this hand":
   * that is the cast, and taking a chair away renumbers the positions of
   * everybody left. A live hand never calls it, because a live hand's
   * table is the night's table and the night is not editable from inside
   * a hand.
   */
  function toggleSeat(rec, key) {
    var h = rec.hand;
    var idx = -1;
    for (var i = 0; i < h.seats.length; i++) {
      /* Live seats are addressed by their table id; recalled ones have no
         table, so they answer to their seat number instead. */
      if (h.seats[i].liveId != null ? h.seats[i].liveId === key : h.seats[i].seat === key) idx = i;
    }
    if (idx >= 0) {
      if (h.seats.length <= 2) return { error: 'A hand needs at least two players.' };
      var gone = h.seats.splice(idx, 1)[0];
      delete h.hole[gone.seat];
      dropFromCast(rec, gone.seat);
      if (h.buttonSeat === gone.seat && h.seats.length) {
        h.buttonSeat = h.seats[h.seats.length - 1].seat;
      }
      return { removed: gone };
    }
    return { error: 'That player is not at this table.' };
  }

  /* ── the cast ──────────────────────────────────────────────── */

  function castOf(rec) {
    /* An older record with no cast had everybody in it, which is what a
       missing cast has always meant. */
    if (!Array.isArray(rec.cast)) {
      rec.cast = rec.hand.seats.map(function (s) { return s.seat; });
    }
    return rec.cast;
  }

  function inCast(rec, seat) { return castOf(rec).indexOf(seat) >= 0; }

  function dropFromCast(rec, seat) {
    var c = castOf(rec), i = c.indexOf(seat);
    if (i >= 0) c.splice(i, 1);
  }

  /**
   * Put somebody in the hand, or take them out of it.
   *
   * Refused once the cards are out: the cast decides who auto-folds, and
   * the auto-folds are already in the action list. Hand recall refuses
   * the same edit mid-hand for the same reason — it would be a silent
   * wrong-number bug rather than a crash.
   */
  function toggleCast(rec, seat) {
    if (rec.stage === 'play') {
      return { error: 'The cards are already out. Undo back to before the deal to change who was in it.' };
    }
    if (!seatById(rec, seat)) return { error: 'Nobody is in that seat.' };
    var c = castOf(rec);
    if (c.indexOf(seat) >= 0) {
      if (c.length <= 2) return { error: 'A hand needs at least two players in it.' };
      dropFromCast(rec, seat);
      /* Cards belong to people who played. */
      delete rec.hand.hole[seat];
      return { seat: seat, in: false };
    }
    c.push(seat);
    return { seat: seat, in: true };
  }

  /**
   * Fold everybody who was not in the hand, the moment the action reaches
   * them — Hand recall's `autoFoldOutsiders`, and the reason naming the
   * cast does not shrink the table.
   *
   * The folds are real recorded actions, flagged `auto` so `undo` can tell
   * them from something he tapped. `engine.toRows` drops a fold from
   * anyone who never voluntarily acted, so they stay out of the text too.
   */
  function autoFold(rec) {
    if (rec.stage !== 'play') return 0;
    var added = 0, guard = 0;
    while (guard++ < 40) {
      var snap = HR.replay(rec.hand);
      var next = snap.next;
      if (!next || next.type !== 'action' || next.seat == null) break;
      if (inCast(rec, next.seat)) break;
      rec.hand.actions.push({
        street: next.street == null ? 0 : next.street,
        seat: next.seat, act: 'fold', to: null, auto: true
      });
      added++;
    }
    return added;
  }

  /**
   * Put somebody in the hand who is not at a live table.
   *
   * Only the recall path uses this: a live hand's roster is the table, and
   * inventing a seat there would mean somebody at the table who is not in
   * the night's money.
   */
  function addSeat(rec, person) {
    var name = String((person && person.name) || '').replace(/\s+/g, ' ').trim();
    if (!name) return { error: 'Give them a name.' };
    var pid = (person && person.playerId) || null;
    for (var i = 0; i < rec.hand.seats.length; i++) {
      var s = rec.hand.seats[i];
      if (s.name.toLowerCase() === name.toLowerCase() || (pid && s.playerId === pid)) {
        return { error: name + ' is already in this hand.' };
      }
    }
    if (rec.hand.seats.length >= 10) return { error: 'Ten seats is a full table.' };
    /* Seat numbers are only ever an ordering, so the next free one does. */
    var next = 0;
    rec.hand.seats.forEach(function (x) { next = Math.max(next, x.seat + 1); });
    var seat = {
      seat: next, name: name, playerId: pid, liveId: null, stack: null,
      hero: !!(person && person.hero)
    };
    rec.hand.seats.push(seat);
    castOf(rec).push(seat.seat);
    if (rec.hand.seats.length === 1) rec.hand.buttonSeat = seat.seat;
    if (rec.hand.seats.length >= 2) rec.stage = rec.stage === 'empty' ? 'setup' : rec.stage;
    return { seat: seat };
  }

  function setButton(rec, seat) {
    if (!seatById(rec, seat)) return { error: 'Nobody is in that seat.' };
    rec.hand.buttonSeat = seat;
    return { buttonSeat: seat };
  }

  function setBlinds(rec, sb, bb, ante) {
    var s = Number(sb), b = Number(bb), a = ante == null ? rec.hand.ante : Number(ante);
    if (!isFinite(s) || s <= 0) return { error: 'The small blind has to be a number.' };
    if (!isFinite(b) || b <= 0) return { error: 'The big blind has to be a number.' };
    if (b < s) return { error: 'The big blind cannot be smaller than the small blind.' };
    if (!isFinite(a) || a < 0) return { error: 'An ante cannot be negative.' };
    rec.hand.sb = s; rec.hand.bb = b; rec.hand.ante = a;
    return { sb: s, bb: b, ante: a };
  }

  /** A straddle is a blind raise: `utg` sits to the big blind's left. */
  function setStraddle(rec, type, amount) {
    if (!type) { rec.hand.straddle = null; return { straddle: null }; }
    var a = Number(amount);
    if (!isFinite(a) || a <= 0) return { error: 'How much is the straddle?' };
    if (a <= num(rec.hand.bb)) return { error: 'A straddle is bigger than the big blind.' };
    rec.hand.straddle = { type: type, amount: a };
    return { straddle: rec.hand.straddle };
  }

  function setStack(rec, seat, v) {
    var s = seatById(rec, seat);
    if (!s) return { error: 'Nobody is in that seat.' };
    if (v == null || v === '') { s.stack = null; return { stack: null }; }
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return { error: 'A stack has to be more than zero.' };
    s.stack = n;
    return { stack: n };
  }

  /* ── cards ─────────────────────────────────────────────────── */

  /**
   * Set a seat's cards. `null` in a slot clears it; `?` is the marker for
   * a villain who showed one — it is a card entry and never a card, so it
   * never collides and never gets ranked.
   */
  function setHole(rec, seat, cards) {
    if (!seatById(rec, seat)) return { error: 'Nobody is in that seat.' };
    var list = arr(cards).filter(function (c) { return c === UNKNOWN || Ev.isCard(c); })
      .map(function (c) { return c === UNKNOWN ? c : Ev.code(c); }).slice(0, 2);
    if (!list.length) delete rec.hand.hole[seat];
    else rec.hand.hole[seat] = list;
    return { cards: list };
  }

  function setBoard(rec, street, cards) {
    if (street < 1 || street > 3) return { error: 'That is not a street.' };
    var want = HR.BOARD_COUNT[street];
    var list = arr(cards).filter(Ev.isCard).map(Ev.code).slice(0, want);
    rec.hand.boards[street] = list;
    return { cards: list, complete: list.length === want };
  }

  /** Every card already spoken for, so a picker can grey them out. */
  function usedCards(rec) {
    var used = {};
    rec.hand.boards.forEach(function (b) {
      arr(b).forEach(function (c) { if (Ev.isCard(c)) used[Ev.code(c)] = true; });
    });
    Object.keys(rec.hand.hole).forEach(function (k) {
      arr(rec.hand.hole[k]).forEach(function (c) { if (Ev.isCard(c)) used[Ev.code(c)] = true; });
    });
    return used;
  }

  /* ── playing it out ────────────────────────────────────────── */

  function begin(rec) {
    var bad = readyToPlay(rec);
    if (bad) return { error: bad };
    rec.stage = 'play';
    autoFold(rec);
    return { stage: 'play' };
  }

  function readyToPlay(rec) {
    var h = rec.hand;
    if (h.seats.length < 2) return 'A hand needs at least two players.';
    /* Ernest, 08/09/2026: *"when i record a hand it should have a name
       attached to it."* Hand recall lets a hand run on bare positions —
       the hub does not, because a hand with a nameless seat cannot join
       up with the money, which is the entire reason the two apps merged. */
    var blank = h.seats.filter(function (s) { return !String(s.name || '').trim(); });
    if (blank.length) return 'Every seat needs a name — a nameless seat cannot be anybody.';
    if (castOf(rec).length < 2) return 'A hand needs at least two players in it.';
    if (!(num(h.bb) > 0) || !(num(h.sb) > 0)) return 'Set the blinds first.';
    if (num(h.sb) > num(h.bb)) return 'The big blind cannot be smaller than the small blind.';
    if (!seatById(rec, h.buttonSeat)) return 'Put the button on somebody.';
    return null;
  }

  /** The derived state: whose turn, what they may do, what is wrong. */
  function state(rec) {
    var h = rec.hand;
    var snap = HR.replay(h);
    var next = snap.next || { type: 'showdown' };
    var legal = next.type === 'action' ? HR.legalFor(h, snap, next.seat) : null;
    return {
      snap: snap,
      next: next,
      legal: legal,
      pot: snap.pot,
      street: snap.streets.length ? snap.streets.length - 1 : 0,
      problems: problems(rec)
    };
  }

  /**
   * One action. The engine decides what is legal; this only refuses what
   * it says is impossible, so the rules live in one place.
   */
  function act(rec, action, to) {
    if (rec.stage !== 'play') return { error: 'This hand is not in play.' };
    var st = state(rec);
    if (st.next.type !== 'action') return { error: 'Nobody is to act.' };
    var seat = st.next.seat, L = st.legal;
    var a = String(action || '').toLowerCase();

    if (a === 'check' && !L.canCheck) return { error: 'There is a bet to answer.' };
    if (a === 'call' && !L.canCall) return { error: 'There is nothing to call.' };
    if (a === 'fold' && L.canCheck) {
      /* Folding for free is legal and is also almost always a misclick. */
      return { error: 'Checking is free — fold only if that is really what happened.', soft: true };
    }
    var amount = null;
    if (a === 'bet' || a === 'raise') {
      amount = Number(to);
      if (!isFinite(amount) || amount <= 0) return { error: 'How much?' };
      /* The stack is checked before the size rules. Facing a jam with 300
         behind, "that is smaller than the current bet" is true and
         useless — what happened is that he cannot cover it. */
      if (L.allInTo != null && amount > L.allInTo) {
        return { error: seatById(rec, seat).name + ' does not have that much.' };
      }
      if (amount <= L.currentBet) {
        return { error: 'A ' + a + ' has to be more than ' + L.currentBet + '.' };
      }
      if (amount < L.minRaiseTo && !(L.allInTo != null && amount === L.allInTo)) {
        return { error: 'The smallest raise here is to ' + L.minRaiseTo + '.' };
      }
    }
    /**
     * **An all-in states its own size.**
     *
     * At the table nobody knows what the man across from you has behind
     * until he pushes it in — that is the moment the number becomes
     * known, and the moment to record it. Requiring the stack up front
     * meant the only way to log a jam by somebody whose stack had never
     * been entered was to type it as a raise, which the engine then had
     * no reason to cap: it matched the caller to the full raise and never
     * handed back the uncalled part. The archive shows what that costs —
     * hg-20260825-aq is 120 out on his net and 240 out on the pot for
     * exactly this reason.
     *
     * So: an amount given here is the all-in **total for this street**,
     * it is believed, and the seat's starting stack is back-filled from
     * it so every later street settles against a real number. With no
     * amount typed, a stack already on file still answers the question.
     *
     * Deliberately not subject to the raise rules. A short all-in for
     * less than the current bet is legal and common, and it is the case
     * that matters most — it is the one that creates a side pot.
     */
    if (a === 'allin') {
      var given = (to === '' || to == null) ? null : Number(to);
      if (given != null && (!isFinite(given) || given <= 0)) return { error: 'How much did they have?' };
      if (given == null && L.allInTo == null) {
        return { error: 'How much did they have? Enter the all-in total.' };
      }
      amount = given == null ? L.allInTo : given;
      if (amount < L.committed) {
        return { error: seatById(rec, seat).name + ' already has ' +
          L.committed + ' in on this street.' };
      }
      if (given != null) {
        /* The starting stack this all-in implies: whatever crossed the
           line on earlier streets, plus the whole of this one. */
        var prior = (st.snap.contrib[seat] || 0) - (L.committed || 0);
        var sObj = seatById(rec, seat);
        if (sObj) sObj.stack = prior + amount;
      }
    }
    rec.hand.actions.push({
      street: st.street, seat: seat,
      act: a === 'allin' ? 'allin' : a,
      to: amount
    });
    autoFold(rec);
    return { ok: true, seat: seat, action: a, to: amount };
  }

  /**
   * Undo is dropping the last thing entered — which is what the replay
   * makes cheap. Order matters: if a street has been dealt but nobody has
   * acted on it yet, the last thing entered was the board, and taking
   * back the previous street's final call instead would be maddening at
   * a table where the misdeal is what he is trying to fix.
   */
  function undo(rec) {
    var h = rec.hand;
    var top = 0;
    for (var st = 3; st >= 1; st--) { if (arr(h.boards[st]).length) { top = st; break; } }
    var actedOnTop = h.actions.some(function (a) { return a.street === top && !a.auto; });
    if (top && !actedOnTop) {
      h.boards[top] = [];
      return { undone: { board: top } };
    }
    /* An outsider's fold was never tapped, so taking one back would leave
       him staring at a decision that is not his to make. Find the last
       thing he *did* tap, drop it along with the derived folds sitting on
       top of it, and let `autoFold` put back whatever the new position
       genuinely implies.

       Nothing is dropped until the real action is found. Popping the
       derived folds first and *then* discovering there is nothing under
       them left the hand with the turn silently back on an outsider while
       the screen still showed the cast member's panel — so his next tap
       was filed against the wrong seat. */
    var i = h.actions.length - 1;
    while (i >= 0 && h.actions[i].auto) i--;
    if (i >= 0) {
      var undone = h.actions[i];
      h.actions.length = i;
      autoFold(rec);
      return { undone: undone };
    }
    /* Nothing but derived folds, or nothing at all: undo takes the deal
       itself back. That is the only way to change who was in the hand
       once it has started, and `toggleCast` says so in as many words. */
    if (rec.stage === 'play') {
      h.actions.length = 0;
      rec.stage = 'setup';
      return { undone: { dealt: true } };
    }
    return { error: 'Nothing to undo.' };
  }

  /* ── was he in it? ─────────────────────────────────────────── */

  /**
   * Whether a seat was *significant* in the hand — Ernest's own test.
   *
   * Two ways in: chips he chose to put in (a call, a bet, a raise, a jam),
   * or still holding cards when a board card hit the felt. Posting a blind
   * is neither, so the small blind who folds and the big blind who is
   * walked were never in the hand; the raiser who folds to a 3-bet was.
   *
   * `seat` defaults to the hero.
   */
  function significant(rec, seat) {
    var h = rec.hand;
    if (seat == null) {
      h.seats.forEach(function (s) { if (s.hero) seat = s.seat; });
    }
    if (seat == null || !seatById(rec, seat)) return false;
    if (!inCast(rec, seat)) return false;

    var voluntary = h.actions.some(function (a) {
      return a.seat === seat && !a.auto &&
        (a.act === 'call' || a.act === 'bet' || a.act === 'raise' || a.act === 'allin');
    });
    if (voluntary) return true;

    /* Live at the flop. `replay` folds him at the action that folded him,
       so the question is whether that action came before the flop. */
    if (!arr(h.boards[1]).length) return false;
    var foldedPreflop = h.actions.some(function (a) {
      return a.seat === seat && a.act === 'fold' && a.street === 0;
    });
    return !foldedPreflop;
  }

  /* ── the showdown ──────────────────────────────────────────── */

  /**
   * Who won, according to the cards.
   *
   * Folded seats are out; everyone still live is ranked. A seat whose
   * cards nobody saw comes back undecided and no winner is asserted —
   * see `eval.js`.
   */
  function resolve(rec) {
    var snap = HR.replay(rec.hand);
    var live = snap.live || [];
    return Ev.showdown(live.map(function (s) {
      return { seat: s, cards: rec.hand.hole[s] || [] };
    }), boardCards(rec));
  }

  function boardCards(rec) {
    return arr(rec.hand.boards[1]).concat(arr(rec.hand.boards[2]), arr(rec.hand.boards[3]));
  }

  /** The evaluator's answer, or Ernest's if he has given one. */
  function winners(rec) {
    if (rec.override && rec.override.length) return rec.override.slice();
    var r = resolve(rec);
    return r.ok ? r.winners : [];
  }

  function setWinners(rec, list) {
    var snap = HR.replay(rec.hand);
    var live = snap.live || [];
    var picked = arr(list).filter(function (s) { return live.indexOf(s) >= 0; });
    rec.override = picked.length ? picked : null;
    return { winners: winners(rec) };
  }

  /* ── what cannot have happened ─────────────────────────────── */

  function problems(rec) {
    var h = rec.hand;
    var out = Ev.problems({
      board: boardCards(rec),
      seats: h.seats.map(function (s) {
        return { seat: s.seat, name: s.name, cards: h.hole[s.seat] || [] };
      })
    });
    /* A board that ran ahead of itself — the turn dealt with no flop. */
    for (var st = 2; st <= 3; st++) {
      if (arr(h.boards[st]).length && arr(h.boards[st - 1]).length < HR.BOARD_COUNT[st - 1]) {
        out.push('There is a ' + (st === 2 ? 'turn' : 'river') + ' but no complete ' +
          (st === 2 ? 'flop' : 'turn') + '.');
      }
    }
    return out;
  }

  /**
   * The name a hand writes for itself: who was in it, and how big it got.
   *
   * He never has to type one, so no hand ever goes into the file as
   * "Hand 47" — and if he does type one, his wins.
   */
  function autoName(rec) {
    var cast = castOf(rec).slice().sort(function (a, b) { return a - b; });
    /* Name it after the people who actually played it. Everyone dealt in
       is in the cast, but "Una v Benny v Justin" for a hand Justin folded
       before the flop is three names to read and two people in it. Falls
       back to the cast when the hand never got that far. */
    var acted = cast.filter(function (s) { return significant(rec, s); });
    if (acted.length >= 2) cast = acted;
    var hero = [], rest = [];
    cast.forEach(function (s) {
      var st = seatById(rec, s);
      if (!st) return;
      if (st.hero) hero.push('You'); else rest.push(st.name);
    });
    var names = hero.concat(rest);
    if (!names.length) return 'A hand';
    var label = names.slice(0, 3).join(' v ');
    if (names.length > 3) label += ' +' + (names.length - 3);
    var pot = HR.replay(rec.hand).pot;
    return pot > 0 ? label + ' · ' + HR.fmtNum(pot) : label;
  }

  function setName(rec, s) {
    rec.hand.name = String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 80);
    return { name: rec.hand.name };
  }

  /** Ready to file? Returns a reason it is not, or null. */
  function readyToSave(rec) {
    var nameless = rec.hand.seats.filter(function (s) { return !String(s.name || '').trim(); });
    if (nameless.length) return 'Every seat needs a name — a nameless seat cannot be anybody.';
    var p = problems(rec);
    if (p.length) return p[0];
    var st = state(rec);
    if (st.next.type === 'action') return 'The hand is not finished — somebody is still to act.';
    if (st.next.type === 'board') {
      return 'The ' + ['', 'flop', 'turn', 'river'][st.next.street] + ' has not been dealt.';
    }
    var won = winners(rec);
    if (!won.length) return 'Nobody has won it yet.';
    /* A pot cannot go to somebody who was not in the hand. It can happen —
       take the two blinds out, have the whole cast fold, and the big blind
       gets a walk — but it means the cast is wrong, not that the hand is
       strange. Saying so beats filing a record that names a winner it also
       says was not in it. */
    var stray = won.filter(function (s) { return !inCast(rec, s); });
    if (stray.length) {
      var s0 = seatById(rec, stray[0]);
      return (s0 ? s0.name : 'Somebody') + ' took the pot, but you said they were not in the hand. ' +
        'Undo back to before the deal and put them in it.';
    }
    return null;
  }

  /* ── back the other way ────────────────────────────────────── */

  var STREET_NO = { preflop: 0, flop: 1, turn: 2, river: 3 };
  /* The engine writes money with a symbol; the hub stores a code, because
     a code is what converts. The picture would otherwise print HKD5/10. */
  var SYMBOL = { HKD: 'HK$', USD: 'US$', GBP: '£', EUR: '€', CNY: 'CN¥', JPY: 'JP¥' };

  /**
   * The store keeps ISO because ISO sorts. Everything he *reads* is day
   * first — every date in this app, and every date Hand recall ever wrote
   * onto a picture. Anything that is not strictly ISO is left alone: a
   * date already in his own format must not be transposed.
   */
  function displayDate(d) {

      var rec = readRebuyLine(String(lines[i]).trim());
      recs[i] = rec || null;
      if (rec) { var u = unitFrom(rec); if (u) units[u] = (units[u] || 0) + 1; }
    }
    var found = Object.keys(units);
    if (opts.unit) { out.unit = opts.unit; out.unitFrom = 'chosen'; }
    else if (found.length === 1) { out.unit = +found[0]; out.unitFrom = 'bracket'; }
    else if (found.length > 1) {
      out.unit = 1; out.unitFrom = 'mixed';
      out.warnings.push('Some rows read as written and others as thousands. Everything is ' +
        'shown as written — set the buy-in unit above if that is wrong.');
    }

    var seen = {};
    for (i = 0; i < lines.length; i++) {
      var line = String(lines[i]).trim();
      if (!line) continue;
      var m;

      /* the house style: name, the rebuys, then (cash-out, net) */
      if (recs[i]) {
        var r = recs[i];
        var buyIn = r.sum == null ? r.cashOut - r.net : r.sum * out.unit;
        var cash = r.cashOut == null ? null : r.cashOut;
        /* Net is never stored as a third independent number: everywhere else
           in this app net *is* cash-out minus buy-in, and a row that disagreed
           with its own two amounts would be wrong somewhere no matter what.
           The stated net is used as a check, and any gap is named. */
        var net = cash == null ? null : cash - buyIn;
        if (cash == null && r.net != null) { net = r.net; cash = buyIn + net; }
        if (r.net != null && net != null && Math.abs(r.net - net) > 0.5) {
          var gap = Math.round(r.net - net);
          out.warnings.push('"' + r.name + '": ' + Math.round(buyIn) + ' in and ' +
            Math.round(cash) + ' out is ' + sgn(net) + ', but the bracket says ' + sgn(r.net) +
            '. Kept ' + sgn(net) + (gap > 0
              ? ' — a gap that way is usually a dealer tip out of the stack, which is fine.'
              : ' — check the buy-ins.'));
        }
        push(out, seen, r.name, buyIn, cash, net);
        continue;
      }

      /* Amounts are tried before dates: "Marcus −3000" must never be read as
         a date, and a header like "6/8/2026 game" must never be read as a row. */
      m = line.match(/^(.+?)[\s:：]+(?:in\s+|buy(?:\s*in)?\s+)?([^\s]+)\s*(?:->|→|to|out|cash\s*out)\s*([^\s]+)\s*$/i);
      if (m && parseNumber(m[2]) != null && parseNumber(m[3]) != null) {
        push(out, seen, cleanName(m[1]), parseNumber(m[2]), parseNumber(m[3]), null);
        continue;
      }
      /* name ±X  (a net) */
      m = line.match(/^(.+?)[\s:：]+([+\-−–—(]?\s*(?:HK|US|CN|JP)?[$£€¥]?\s*[\d.,]+\s*[kKmM]?\)?)\s*$/);
      if (m) {
        var v = parseNumber(m[2]);
        var nm = cleanName(m[1]);
        if (v != null && nm && !/^\d+$/.test(nm)) {
          var signed = /^[+\-−–—(]/.test(String(m[2]).trim());
          if (!signed) out.warnings.push('"' + line + '" had no sign — read as a win. Fix it below if it was a loss.');
          push(out, seen, nm, null, null, v);
          continue;
        }
      }
      if (out.date == null) {
        var d = S.findDate(line);
        if (d) { out.date = d; continue; }
      }
      if (/[\d]/.test(line) && line.length < 80) {
        out.warnings.push('Skipped "' + line.trim() + '" — no name and amount found.');
      }
    }
    if (!out.rows.length) {
      out.warnings.push('Nothing recognised. Each line needs a name and an amount, like "Marcus −3,000".');
    }
    if (out.unitFrom === 'default' && recs.some(function (r) { return r && r.hasBracket && r.sum; })) {
      out.warnings.push('No row gave both a cash-out and a net, so there is nothing to say whether ' +
        'the listed buy-ins are written in full or in thousands. They are read as written — ' +
        'set the buy-in unit above if that is wrong.');
    }
    if (out.unitFrom === 'bracket' && out.unit !== 1) {
      out.warnings.push('The listed buy-ins are read as thousands — a row with both a cash-out and ' +
        'a net says so. Change the buy-in unit above if that is wrong.');
    }
    var total = out.rows.reduce(function (t, r) { return t + (r.net || 0); }, 0);
    out.totals.net = total;
    if (out.rows.length > 1 && Math.abs(total) > 0.5) {
      out.warnings.push('The nets add up to ' + (total > 0 ? '+' : '−') + Math.abs(Math.round(total)) +
        ' rather than 0 — ' + (total < 0
          ? Math.abs(Math.round(total)) + ' left the table, which is usually the dealer tip. ' +
            'That is fine; check nobody is missing.'
          : 'someone is missing, or an amount is wrong.'));
    }
    return out;
  }

  function push(out, seen, name, buyIn, cashOut, net) {
    if (!name) return;
    var key = name.toLowerCase();
    if (seen[key]) { out.warnings.push('"' + name + '" appears twice — kept the first.'); return; }
    seen[key] = true;
    out.rows.push(row(name, buyIn, cashOut, net, false));
    out.matched++;
  }


  /** The Share message first; a chat summary if that finds nothing. */
  function read(text, opts) {
    opts = opts || {};
    var out = parseTrackerLedger(text, opts);
    if (!out.rows.length || !out.matched) out = parseFreeForm(text, opts);
    return out;
  }

  return {
    read: read, parseTrackerLedger: parseTrackerLedger, parseFreeForm: parseFreeForm,
    parseNumber: parseNumber, stripFence: stripFence, normDate: normDate, findDate: findDate,
    isHeroName: isHeroName
  };
}));
</script>
<script>/* ============================================================
   Poker hub — app shell, v0.8.0. The pictures.

   The shell is the poker ledger's, at Ernest's request and because it is
   the most developed of the three: a top header with scrolling tabs,
   sections ruled underneath, statcard figures in mono, and the verdict as
   the single Garamond flash on the page. The live table is the home game
   tracker's — its roster row with status as a superscript on the name,
   its two-figures-only stat pair, its timeline, its share block, its
   undo-covers-everything. Cards, list rows, chips and the bottom command
   bar are Hand recall's.

   What stage 2 changes beyond the screen: a night that starts here never
   lacks hours, and there is no roster to reconcile afterwards because
   **sitting down is the identity step**. A seat resolves to one player id
   before its buy-in is taken, so the ledger row, the dossier and (in
   stage 3) the hands all land on one record rather than on a string that
   happens to match. Settling files the night through the same importer a
   tracker file goes through — one code path, one set of assertions.

   Stage 3 adds the recorder: a hand logged at the table, on the roster
   that is already there, with the evaluator naming the winner. Its money
   is estimated and stays that way. The Players tab is the first slice of
   stage 4 — who makes the most and who makes the least, from counted
   chips only.

   Zero network requests. Everything is inlined by build.mjs.
   ============================================================ */
(function () {
  'use strict';

  var APP_VERSION = '1.2.0';
  var STAGE = 'Rebuild · EDB 2.0.0';
  var EDS_VERSION = '2.0.0';

  var Settle = window.PHSettle, Layers = window.PHLayers, Ident = window.PHIdentity;
  var Imp = window.PHImport, Backup = window.PHBackup, StoreMod = window.PHStore;
  var Stats = window.PLStats, Live = window.PHLive, Metrics = window.PHMetrics;
  var HR = window.PHEngine, Ev = window.PHEval, Rec = window.PHRecord;
  var Profile = window.PHProfile, Hero = window.PHHero, CoachOut = window.PHCoachExport, Paste = window.PHPaste;

  var store = StoreMod.create({});
  var VIEW = { name: 'home', id: null, filter: null, sub: 'table' };
  var pending = null, pendingRaw = null, pendingConfirm = null;
  var toastTimer = null, tickTimer = null, Charts = null;
  var liveUndo = [];
  var tellCat = 'Tell';

  /* ── tiny DOM ──────────────────────────────────────────── */

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function icon(name, size) {
    return '<span class="i"><svg width="' + (size || 18) + '" height="' + (size || 18) +
      '" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false">' +
      (window.PHICONS[name] || '') + '</svg></span>';
  }
  function monogram(h) {
    return '<span class="mark"><svg viewBox="20 35 434 158" style="height:' + h +
      'px;width:auto;display:block" aria-hidden="true"><use href="#edb-mark"/></svg></span>';
  }
  function toast(msg, kind) {
    var el = $('toast');
    el.className = 'toast ' + (kind || 'ok');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 4200);
  }
  function now() { return Date.now(); }

  /* ── money ─────────────────────────────────────────────── */

  function base() { return store.db.settings.baseCurrency || 'HKD'; }
  function cur() {
    return ({ HKD: 'HK$', USD: 'US$', GBP: '£', EUR: '€', CNY: 'CN¥', JPY: 'JP¥' })[base()] || (base() + ' ');
  }
  function money(n) { return Settle.money(n, cur()); }
  function signed(n) { return Settle.signedMoney(n, cur()); }
  /** Every estimated figure goes through here. The tilde is the rule. */
  function est(n) { return Layers.fmtEstimate(n, cur(), Settle.signedMoney); }
  function cls(n) { return n > 0 ? 'pos' : (n < 0 ? 'neg' : ''); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  /**
   * Which way a table fails to reconcile. `totals().net` is buy-ins less
   * cash-outs less the tip: positive means less money came off the table
   * than went on, so chips are missing from the count; negative means
   * somebody cashed out more than the pot holds.
   */
  /**
   * A signed figure with no currency on it — for a column that is already
   * money, where repeating HK$ on every row is noise. `signedMoney(n, '')`
   * does not do this: an empty currency is falsy, so it silently falls
   * back to the default and prints the symbol anyway.
   */
  function plainSigned(n) {
    n = Math.round(Number(n) || 0);
    return (n > 0 ? '+' : '') + Settle.plain(n);
  }
  function offBy(net) { return net === 0 ? 'balanced' : (net > 0 ? 'missing' : 'in excess'); }
  /* Below an hour, one decimal place rounds a real figure to "0 h" and
     makes a counted night look uncounted. Show two. */
  function hoursText(h) {
    if (h == null) return 'no hours';
    return (h < 1 ? Math.round(h * 100) / 100 : Math.round(h * 10) / 10) + ' h';
  }
  function fmtDate(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || '');
  }
  function hhmm(ts) {
    var d = new Date(ts);
    return Settle.pad2(d.getHours()) + ':' + Settle.pad2(d.getMinutes());
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : null; }

  /* ── cards, four-colour ────────────────────────────────── */

  var SUIT = { s: '♠', h: '♥', d: '♦', c: '♣' };
  var SUIT_CLASS = { '♠': 'sp', '♥': 'he', '♦': 'di', '♣': 'cl' };

  function cardChip(c, size) {
    if (!c) return '';
    var k = 'crd' + (size ? ' ' + size : '');
    if (c === '?' || c[0] === '?') return '<span class="' + k + ' unk">?</span>';
    var r = c[0], s = SUIT[c[1]] || '';
    return '<span class="' + k + ' ' + (SUIT_CLASS[s] || '') + '">' + esc(r) + s + '</span>';
  }
  function cardChips(list, size) {
    return (list || []).map(function (c) { return cardChip(c, size); }).join('');
  }
  function colourSuits(text) {
    return esc(text).replace(/[♠♥♦♣]/g, function (g) {
      return '<span class="s-' + SUIT_CLASS[g] + '">' + g + '</span>';
    });
  }
  /** The canonical log, one logical line per row, hanging-indented. */
  function handLog(text) {
    return '<div class="handlog">' + String(text).split('\n').map(function (ln) {
      return ln.trim() === '' ? '<div class="ll sp"></div>'
        : '<div class="ll">' + colourSuits(ln) + '</div>';
    }).join('') + '</div>';
  }

  /* ── banners ───────────────────────────────────────────── */

  function banners() {
    var out = '';
    var nag = store.backupDue();
    if (nag.due) {
      var why = nag.reason === 'never'
        ? 'This device has never been backed up.'
        : nag.reason === 'sessions'
          ? plural(nag.sessions, 'night') + ' logged since the last backup.'
          : 'It has been ' + plural(nag.days, 'day') + ' since the last backup.';
      out += '<div class="alert warn" role="status"><div>' + esc(why) +
        ' Everything is on this device only — take a backup file and put it somewhere else. ' +
        '<button class="btn btn-ghost" data-act="backup" style="margin-top:8px">Back up now</button></div></div>';
    }
    var orphans = store.orphanRows();
    if (orphans.length) {
      var dates = orphans.map(function (r) { return store.resolveLedgerRow(r).date || 'no date'; });
      var uniq = dates.filter(function (d, i) { return dates.indexOf(d) === i; });
      out += '<div class="alert err"><div>' + plural(orphans.length, 'ledger row') +
        ' belong to no session — ' + esc(uniq.join(', ')) +
        '. Something of yours is missing from the log.</div></div>';
    }
    if (store.quotaHit()) {
      out += '<div class="alert err"><div>This browser is out of storage space, so the last change was not ' +
        'saved. Take a backup, then clear some space.</div></div>';
    }
    return out;
  }

  /* ══════════════════════════════════════════════════════════
     LIVE
     ══════════════════════════════════════════════════════════ */

  function live() { return store.db.live; }

  /** Snapshot before every mutation — the tracker's undo, kept. */
  function liveCommit(fn) {
    if (!live()) return;
    liveUndo.push(JSON.stringify(live()));
    if (liveUndo.length > Live.UNDO_CAP) liveUndo.shift();
    var r = fn(live());
    if (r && r.error) { liveUndo.pop(); toast(r.error, 'err'); return r; }
    store.saveLive();
    render();
    return r;
  }
  function liveUndoStep() {
    if (!liveUndo.length) { toast('Nothing to undo.', 'err'); return; }
    try { store.db.live = JSON.parse(liveUndo.pop()); } catch (e) { return; }
    store.saveLive(); render();
    toast('Undone.', 'ok');
  }

  function viewLive() {
    var L = live();
    if (!L) {
      var last = sortedSessions()[0];
      var m0 = store.db.meta || {};
      return page(banners() +
        '<div class="empty"><span class="tag">No night running</span>' +
        '<h3>Start one when the first buy-in lands</h3>' +
        '<p>The clock starts with the first player, and the night files itself in the ledger when you settle.</p>' +
        '<div class="acts"><button class="btn btn-primary" data-act="start-live">Start a night</button>' +
        '<button class="btn btn-ghost" data-act="recall-start">Record a hand from memory</button>' +
        '<button class="btn btn-ghost" data-act="log-night">Log a past night</button></div></div>' +
        (last
          ? '<div class="section"><h2>Last night</h2><div class="rowlist">' + sessionRow(last) + '</div></div>'
          : '') +
        (m0.lastBackupAt ? '' : ''));
    }

    var t = Live.totals(L);

    /* Timeline, tonight's hands and the seating are sub-screens of the
       table, reached from the three buttons under the roster and left
       with Back. */
    if (VIEW.sub === 'timeline') return page(liveTimeline(L));
    if (VIEW.sub === 'hands') return page(liveHands(L));
    if (VIEW.sub === 'seats') return page(seatingBlock(L));

    /* Venue, blinds, who is seated and the clock live in the top strip
       (`tableSpecs`), so the body starts with the money. */
    return '<main class="main container tablemain">' + liveTable(L, t) + '</main>';
  }

  /**
   * The top strip on the table: venue as the title, then blinds · seated
   * · the clock. The clock is the pause control — tapping it stops the
   * hours, and the dot turns amber so a paused night is never mistaken
   * for a running one.
   */
  function tableSpecs(L) {
    var seated = L.players.filter(function (p) { return !p.cashedOut; }).length;
    var out = L.players.length - seated;
    var paused = Live.isPaused(L);
    var bits = [];
    if (L.stakes) bits.push('<span class="mono">' + esc(L.stakes) + '</span>');
    bits.push(L.players.length
      ? '<span class="mono">' + seated + '</span> seated' + (out ? ' · <span class="mono">' + out + '</span> out' : '')
      : 'nobody seated');
    return '<span class="specs"><span class="sx">' + bits.join(' · ') + '</span>' +
      '<button class="clockbtn' + (paused ? ' paused' : '') + '" data-act="live-pause" aria-label="' +
      (paused ? 'Resume the clock' : 'Pause the clock') + '">' +
      '<span class="dotlive" aria-hidden="true"></span>' +
      '<span class="clock">' + esc(Live.clock(Live.elapsed(L, now()))) + '</span>' +
      (paused ? '<span class="pz">paused</span>' : '') + '</button></span>';
  }

  /**
   * The banner above the roster: total in, total out. Out counts the
   * dealer's tip, because the tip leaves the pot like any cash-out — so the
   * two figures meet exactly when the night balances. Once the last player
   * is out it says whether they did; while anyone is seated the difference
   * is just the chips in front of them, and calling that missing money
   * would be a lie told all night.
   */
  function liveSummary(L, t) {
    if (!L.players.length) {
      return '<div class="tsum hintline" id="tsum"><span class="tl">Seat the first player below. The clock starts with the first buy-in.</span></div>';
    }
    var out = Settle.round2(t.cashouts + t.tip);
    var st = '';
    if (!t.seated) {
      st = t.net === 0
        ? '<span class="st ok">' + icon('check-circle', 12) + ' balanced</span>'
        : '<span class="st off">' + esc(Settle.plain(Math.abs(t.net))) + ' ' + esc(offBy(t.net)) + '</span>';
    }
    return '<div class="tsum tbanner" id="tsum">' +
      '<div class="tb"><span class="l">Total in</span><span class="n">' + esc(Settle.plain(t.buyins)) + '</span></div>' +
      '<div class="tb"><span class="l">Total out' + st + '</span><span class="n' + (!t.seated && t.net !== 0 ? ' off' : '') + '">' +
      esc(Settle.plain(out)) + '</span></div></div>';
  }

  /** The player card at the table: who this is, what they have in, the
   *  read, a tell, and the corrections — one sheet, so the roster row
   *  carries only what is needed at a glance. */
  function playerCard(L, p) {
    var bi = Settle.totalBuyIn(p);
    var who = p.playerId ? store.playerById(p.playerId) : null;
    var rebuys = p.buyins.length - 1;
    var firstIn = null;
    L.events.forEach(function (e) { if (e.name === p.name && e.type === 'buyin' && (firstIn == null || e.ts < firstIn)) firstIn = e.ts; });
    var h = '<div class="statgrid tight" style="margin-bottom:16px">' +
      stat('Bought in', Settle.plain(bi), '', p.cashedOut ? '' : 'in play') +
      stat('Rebuys', String(Math.max(0, rebuys)), '') +
      (p.cashedOut
        ? stat('Cashed out', Settle.plain(p.cashout), '', 'result ' + plainSigned(Settle.round2(Number(p.cashout) - bi)))
        : stat('Seated since', firstIn ? hhmm(firstIn) : '—', '')) +
      '</div>';
    if (who) {
      h += '<div class="section dsec" style="margin-top:0">' + peekRead(who) + '</div>';
    }
    h += '<div class="section"><h2>Note a tell</h2>' +
      '<p class="hint">Physical reads are the one thing you cannot reconstruct afterwards. One line, dated, kept on ' +
      esc(p.name) + '.</p>' +
      '<div class="field" style="margin-top:8px"><label for="tell-text">What you saw</label>' +
      '<input class="input" id="tell-text" placeholder="stacks chips tall before a bluff"></div>' +
      '<div class="line" style="margin-top:8px">' +
      '<div class="segmented" role="group" aria-label="Kind of note">' +
      Live.NOTE_CATS.slice(0, 4).map(function (c, i) {
        return '<button data-act="tell-cat" data-cat="' + c + '" aria-pressed="' + (i === 0 ? 'true' : 'false') + '">' + c + '</button>';
      }).join('') + '</div>' +
      '<button class="btn btn-primary" data-act="save-tell" data-id="' + p.id + '">Save</button></div></div>';
    var notes = (L.notes || []).filter(function (n) { return n.seatId === p.id; });
    if (notes.length) {
      h += '<ul class="notelist" style="margin-top:0">' + notes.slice().reverse().map(function (n) {
        return '<li><span class="t">' + esc(hhmm(n.t)) + '</span><span class="g"><span class="tl-type adjust">' +
          esc(n.cat) + '</span> ' + esc(n.text) + '</span></li>';
      }).join('') + '</ul>';
    }
    h += '<div class="dact">' +
      '<button class="btn btn-ghost" data-act="edit-buyins" data-id="' + p.id + '">Correct buy-ins</button>' +
      (p.cashedOut
        ? '<button class="btn btn-ghost" data-act="reopen" data-id="' + p.id + '">Buy back in</button>'
        : '') +
      '<button class="btn btn-ghost" data-act="drop-player" data-id="' + p.id + '">' + icon('trash', 15) + ' Remove from the table</button>' +
      (who && !locked()
        ? '<button class="btn btn-ghost" data-act="go" data-to="player" data-id="' + esc(who.id) + '">Everything on ' +
        esc(who.name) + ' ' + icon('caret-right', 14) + '</button>'
        : '') +
      '</div>';
    return h;
  }
  /**
   * The roster, one person per line, on a four-column grid so the money
   * lines up down the table: name (and the read's type) · total in · the
   * rebuy box · cash out. 44 px rows — the touch floor — which is what
   * puts eight people, the seat row, the dealer and the three buttons on
   * one iPhone screen.
   */
  function liveTable(L, t) {
    var h = liveSummary(L, t);
    h += '<div id="playerList">';
    L.players.forEach(function (p) { h += rosterRow(p); });
    h += '</div>';
    h += seatRow(L);
    h += dealerLine(L);

    var hands = liveHandList(L);
    var trio = function (sub, ic, label, n, live) {
      return '<button class="btn btn-ghost" data-act="live-sub" data-sub="' + sub + '">' + icon(ic, 16) +
        '<span>' + label + '</span>' + (n ? '<span class="ct">' + n + '</span>' : '') +
        (live ? '<span class="dotlive" aria-label="a hand is in progress"></span>' : '') + '</button>';
    };
    h += '<div class="trio">' +
      trio('hands', 'diamond', 'History', hands.length, !!L.rec) +
      trio('timeline', 'clock', 'Timeline', 0) +
      trio('seats', 'chair', 'Seating', 0) + '</div>';

    /* An empty table has the room: the felt is drawn under it, so seats
       can be set before anybody sits. Once people do, the roster takes
       the screen and the felt lives under Seating. */
    if (!L.players.length) h += '<div style="margin-top:16px">' + seatingBlock(L) + '</div>';

    return h + endNightBlock();
  }

  function rosterRow(p) {
    var bi = Settle.totalBuyIn(p);
    /* Just the name — the read lives on the player card, a tap away. */
    var nameBtn = '<button class="pname" data-act="player-card" data-id="' + p.id + '">' +
      '<span class="pn">' + esc(p.name) + '</span></button>';
    if (p.cashedOut) {
      var net = Settle.round2(Number(p.cashout) - bi);
      return '<div class="prow out">' + nameBtn +
        '<span class="psum"><span class="in">' + esc(Settle.plain(bi)) + '→' + esc(Settle.plain(p.cashout)) + '</span>' +
        '<span class="nt ' + cls(net) + '">' + esc(plainSigned(net)) + '</span></span>' +
        '<button class="btn btn-ghost pbtn" data-act="reopen" data-id="' + p.id + '" aria-label="' + esc(p.name) +
        ' buys back in">' + icon('arrow-clockwise', 15) + '</button></div>';
    }
    var n = p.buyins.length;
    return '<div class="prow">' + nameBtn +
      '<button class="pamt tapnum" data-act="edit-buyins" data-id="' + p.id + '" aria-label="Correct ' +
      esc(p.name) + '’s buy-ins">' + esc(Settle.plain(bi)) +
      (n > 1 ? '<span class="nb">×' + n + '</span>' : '') + '</button>' +
      '<span class="topup"><input class="input" inputmode="decimal" data-topup="' + p.id + '" aria-label="Top up ' +
      esc(p.name) + '" placeholder="rebuy">' +
      '<button class="topadd" data-act="topup" data-id="' + p.id + '" aria-label="Add ' + esc(p.name) + '’s rebuy">' +
      icon('plus', 16) + '</button></span>' +
      '<button class="btn btn-ghost pbtn" data-act="cashout" data-id="' + p.id + '">Cash out</button></div>';
  }

  /**
   * Seating somebody, in place: a ghost row under the roster. Typing a
   * name offers the people already in the file, so the seat links to the
   * person, not to a spelling — the same identity step the old form had,
   * without the form.
   */
  var SEAT_OPEN = false;
  function seatRow(L) {
    /* At rest, one quiet line — like "+ Dealer". It opens in place; an
       empty table starts open, because seating is the only thing to do. */
    if (!SEAT_OPEN && L.players.length) return seatQuiet();
    return seatOpenHTML(L);
  }
  function seatQuiet() {
    return '<button class="seat-quiet" id="seat-row" data-act="seat-open">' + icon('plus', 14) + ' Seat someone</button>';
  }
  function seatOpenHTML(L) {
    return '<div class="prow ghost" id="seat-row">' +
      '<input class="input gname" id="seat-name" placeholder="' + (L.players.length ? 'Seat someone' : 'First player') +
      '" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Name of the player to seat">' +
      '<input class="input gamt" id="seat-amount" inputmode="decimal" placeholder="buy-in" aria-label="Their buy-in">' +
      '<button class="btn btn-ghost pbtn" data-act="seat-add">Seat</button></div>' +
      '<div class="seatstrip" id="seat-strip" hidden><div class="chips" id="seat-sug"></div>' +
      '<div class="seatmatch" id="seat-match"></div></div>';
  }

  /* The dealer: a name for the record and the tip as a settlement party.
     Pot-funded, so it is the one counted amount in nobody's net — logged
     here so the night's page can say where it went. Saved as typed, with
     no button: leaving the field is the save. */
  function dealerLine(L) {
    if (!L.dealer) {
      return '<button class="dline-add" data-act="toggle-dealer">' + icon('plus', 14) + ' Dealer</button>';
    }
    return '<div class="prow dline"><span class="dwho"><span class="dlab">Dealer</span>' +
      '<input class="input" id="dealer-name" placeholder="who dealt" autocomplete="off" autocapitalize="words" ' +
      'autocorrect="off" spellcheck="false" aria-label="Who dealt" value="' + esc(L.dealerName || '') + '"></span>' +
      '<input class="input dtip" id="tip" inputmode="decimal" placeholder="tip" aria-label="Dealer tip, ' + esc(cur()) +
      ', from the pot" value="' + esc(L.tip || '') + '">' +
      '<button class="icon-btn dx" data-act="drop-dealer" aria-label="No dealer">' + icon('x', 16) + '</button></div>';
  }

  /**
   * The recorder as a sheet over the table. The hand in progress lives on
   * the night (`L.rec`) so it survives the phone locking; the sheet is
   * only how it is shown — closing it leaves the hand where it was.
   */
  function recordSheet() {
    var r = rec();
    var inner = !r
      ? '<div class="empty"><h3>No hand in progress</h3></div>'
      : (r.stage === 'play' ? recPlay(r) : recSetup(r));
    /* The recorder's own cmdbar is the last thing it emits; it becomes the
       sheet's footer by moving it out of the scrolling body. */
    var cut = inner.lastIndexOf('<div class="cmdbar">');
    var bodyHTML = cut >= 0 ? inner.slice(0, cut) : inner;
    var footHTML = cut >= 0 ? inner.slice(cut) : '';
    var title = r ? ((r.recall ? 'Hand from memory' : 'Hand ' + esc(String(r.hand.no))) +
      (r.stage === 'play' ? '' : ' · setting up')) : 'Hand';
    var subtitle = r && r.stage === 'play' ? 'Tap a seat’s cards to enter them. Undo takes back the last thing.' :
      'Who is in it, where the button is, the stakes, your cards.';
    return '<div class="sheetwrap"><div class="scrim" data-act="rec-close"></div>' +
      '<section class="sheet" role="dialog" aria-label="' + esc(title) + '">' +
      '<div class="handle" aria-hidden="true"></div>' +
      '<div class="sheet-head"><div><h3>' + title + '</h3><span class="caption">' + subtitle + '</span></div>' +
      '<button class="icon-btn" data-act="rec-close" aria-label="Close — the hand is kept">' + icon('x', 16) + '</button></div>' +
      '<div class="sheet-body">' + bodyHTML + '</div>' + footHTML + '</section></div>';
  }

  /* ══════════════════════════════════════════════════════════
     THE FELT

     One convention everywhere, taken from Hand recall v2.2.0: the dealer
     is at **6 o'clock**, seat 1 is the chair on the dealer's left, and the
     numbers run clockwise. You read a table standing behind the dealer,
     looking up it — so the picture in his hand and the chairs in front of
     him are the same way round. `PHEngine.seatAnchors` is the single
     source of that shape, shared with the share picture, so the two
     cannot drift.
     ══════════════════════════════════════════════════════════ */

  /* The plaque is 68×30 and hangs off the anchor by half of that, so the
     ring has to sit a plaque-and-a-bit inside the box or the top row is
     clipped. Sized from the plaque rather than guessed. */
  var FELT_W = 340, FELT_H = 330, PLAQUE_W = 68, PLAQUE_H = 30;

  function feltSVG(L) {
    var n = L.tableSize;
    var rx = FELT_W / 2 - PLAQUE_W / 2 - 6, ry = FELT_H / 2 - PLAQUE_H / 2 - 20;
    var cx = FELT_W / 2, cy = FELT_H / 2;
    var anchors = HR.seatAnchors(cx, cy, rx, ry, n);
    var pos = Live.positionsFor(L);

    var h = '<svg class="felt" viewBox="0 0 ' + FELT_W + ' ' + FELT_H + '" ' +
      'role="img" aria-label="The table">' +
      '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (rx - 14) + '" ry="' + (ry - 14) +
      '" class="feltbed"/>';

    /* The dealer's station, at the bottom, so the table has an orientation
       the way a real one does. */
    h += '<g class="dealer"><rect x="' + (cx - 26) + '" y="' + (cy + ry - 20) +
      '" width="52" height="18" rx="9"/>' +
      '<text x="' + cx + '" y="' + (cy + ry - 7) + '">DEALER</text></g>';

    for (var i = 0; i < n; i++) {
      var a = anchors[i];
      var p = Live.playerInSeat(L, i);
      var on = p && !p.cashedOut;
      var isBtn = L.buttonSeat === i;
      h += '<g class="seat' + (p ? ' taken' : ' free') + (p && p.cashedOut ? ' out' : '') +
        (p && p.hero ? ' me' : '') + '" data-act="seat-tap" data-seat="' + i + '">' +
        '<rect x="' + (a.x - 34) + '" y="' + (a.y - 15) + '" width="68" height="30" rx="8"/>' +
        '<text class="nm" x="' + a.x + '" y="' + (a.y - 1) + '">' +
        esc(p ? clipName(p.name, 10) : String(i + 1)) + '</text>' +
        '<text class="ps" x="' + a.x + '" y="' + (a.y + 10) + '">' +
        esc(p ? (pos[i] || '') : 'empty') + '</text>' +
        (isBtn
          ? '<circle class="btn" cx="' + (a.x + 30) + '" cy="' + (a.y - 14) + '" r="8"/>' +
          '<text class="btnt" x="' + (a.x + 30) + '" y="' + (a.y - 11) + '">D</text>'
          : '') +
        '</g>';
    }
    return h + '</svg>';
  }

  function clipName(s, n) {
    s = String(s || '');
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }

  function seatingBlock(L) {
    var free = Live.emptySeats(L).length;
    return '<div class="feltwrap">' + feltSVG(L) + '</div>' +
      '<p class="hint">Tap a chair to move somebody, or to put the button on it. ' +
      plural(L.tableSize, 'chair') + ', ' + free + ' free.</p>' +
      '<div class="line" style="margin-top:10px">' +
      '<button class="btn btn-ghost" data-act="randomise">' + icon('shuffle', 15) +
      ' Randomise</button>' +
      '<button class="btn btn-ghost" data-act="share-seating">' + icon('share-network', 15) +
      ' Share the seating</button>' +
      '<button class="btn btn-ghost" data-act="table-size">' + icon('users', 15) + ' ' +
      L.tableSize + '-handed</button>' +
      '</div>';
  }


  /**
   * A night left running is the normal accident — the app was closed
   * before anyone cashed out, and the next game needs a clean table.
   * Settling is the way out that keeps the money; this is the way out
   * that admits there was none.
   */
  function endNightBlock() {
    /* An empty table is the commonest thing to be stuck with — opened,
       then forgotten — so the way out sits on the table as well as in the
       menu. Quiet, and below everything that matters. */
    return '<div class="endnight"><button class="btn btn-ghost btn-danger" data-act="end-live">' + icon('x-circle', 15) +
      ' End this night without filing it</button>' +
      '<p class="hint">Nothing reaches the ledger. For a night opened by mistake, or one never closed.</p></div>';
  }

  function liveTimeline(L) {
    if (!L.events.length) {
      return '<div class="empty"><h3>Nothing yet</h3><p>Every buy-in, rebuy and cash-out lands here, ' +
        'timed. It is what dates the night and what counts the hours.</p></div>';
    }
    return '<ul class="notelist">' + L.events.slice().reverse().map(function (e) {
      return '<li><span class="t">' + esc(hhmm(e.ts)) + '</span>' +
        '<span class="g"><span class="tl-type ' + esc(e.type) + '">' + esc(e.type) + '</span> ' +
        esc(e.name) + '</span>' +
        '<span class="mono">' + (e.amount == null ? '' : esc(Settle.signedMoney(e.amount, cur()))) +
        '</span></li>';
    }).join('') + '</ul>';
  }

  /* ══════════════════════════════════════════════════════════
     HANDS, DURING THE NIGHT

     A hand recorded here needs no roster: the seats, the names and the
     player ids are already on the table. It carries `liveId` until the
     night is filed, and picks up its `sessionId` at settle.
     ══════════════════════════════════════════════════════════ */

  function liveHandList(L) {
    if (!L) return [];
    return store.hands.filter(function (h) { return h.liveId === L.id; })
      .sort(function (a, b) { return (b.no || 0) - (a.no || 0); });
  }

  function nextHandNo(L) {
    var n = 0;
    liveHandList(L).forEach(function (h) { n = Math.max(n, Number(h.no) || 0); });
    return n + 1;
  }

  function liveHands(L) {
    var list = liveHandList(L);
    var h = '<button class="btn btn-primary" data-act="rec-start">' + icon('spade', 16) +
      ' Record a hand</button>' +
      (L.rec ? '<button class="btn btn-ghost" data-act="rec-open" style="margin-left:8px">' +
        icon('arrow-clockwise', 15) + ' Carry on with hand ' + esc(String(L.rec.hand.no)) +
        '</button>' : '');
    if (!list.length) {
      return h + '<div class="empty" style="margin-top:16px"><h3>No hands yet tonight</h3>' +
        '<p>Everyone at the table is already a seat, so a hand takes the cards and the actions ' +
        'and nothing else. What it works out — who won, and for how much — is an estimate and ' +
        'is kept apart from the money you count at the end.</p></div>';
    }
    return h + '<div class="rowlist" style="margin-top:16px">' + list.map(function (x) {
      return handRow(x);
    }).join('') + '</div>';
  }

  /* ══════════════════════════════════════════════════════════
     THE RECORDER

     Full screen, because at a table it is the only thing being done. The
     hand in progress lives on the live session (`L.rec`), so it survives
     the phone locking, Safari evicting the tab, and the walk to the
     kitchen — the same guarantee the rest of the night has.

     The engine decides everything: who acts, what is legal, what the pot
     is, where the side pots split. This is the screen around it.
     ══════════════════════════════════════════════════════════ */

  var RANK_ORDER = 'AKQJT98765432';
  var SUITS = [['s', '♠'], ['h', '♥'], ['d', '♦'], ['c', '♣']];
  var pick = null;      /* the card picker's target, while it is open */

  /**
   * The hand in progress. A live one lives on the night (so it survives
   * the phone locking); a remembered one lives in `meta`, because there
   * is no night to hang it on yet. One of the two, never both — starting
   * either clears the other.
   */
  function rec() {
    var L = live();
    if (L && L.rec) return L.rec;
    return (store.db.meta && store.db.meta.recall) || null;
  }

  function recCommit(fn) {
    var r = rec();
    if (!r) return null;
    var out = fn(r);
    if (out && out.error) { toast(out.error, out.soft ? 'warn' : 'err'); return out; }
    if (r.recall) store.saveMeta(); else store.saveLive();
    render();
    return out;
  }

  /** Persist the recorder without repainting — for typing, which repaints itself. */
  function saveRec() {
    var r = rec();
    if (!r) return;
    if (r.recall) store.saveMeta(); else store.saveLive();
  }

  function clearRec() {
    var L = live();
    if (L && L.rec) { L.rec = null; store.saveLive(); }
    if (store.db.meta && store.db.meta.recall) { store.db.meta.recall = null; store.saveMeta(); }
  }

  /** Filled slots use the app's own card chip; empty ones show the gap. */
  function cardSlots(list, want, size) {
    var out = '';
    for (var i = 0; i < want; i++) {
      out += (list && list[i]) ? cardChip(list[i], size)
        : '<span class="crd ' + (size || '') + ' empty"></span>';
    }
    return out;
  }

  /* ── the picker ────────────────────────────────────────── */

  function openCards(kind, key, want, title) {
    var r = rec();
    if (!r) return;
    var cur = kind === 'board' ? (r.hand.boards[key] || []).slice()
      : (r.hand.hole[key] || []).slice();
    pick = { kind: kind, key: key, want: want, cards: cur, rank: null };
    openModal(title, cardsBody(), [
      { label: 'Clear', act: 'cards-clear' },
      { label: 'Done', act: 'cards-done', primary: true }
    ]);
  }

  function cardsBody() {
    var r = rec();
    var used = Rec.usedCards(r);
    /* A slot does not take cards from itself. What is *committed* to this
       slot is exempt — clear it and the same cards must still be
       offered — while what has been picked in this draft is taken, so the
       same card cannot go in twice. Reading the draft for both was wrong:
       clearing a slot left its own cards greyed out with no way back. */
    var owned = pick.kind === 'board'
      ? (r.hand.boards[pick.key] || []) : (r.hand.hole[pick.key] || []);
    owned.forEach(function (c) { if (c !== Rec.UNKNOWN) delete used[Ev.code(c)]; });
    pick.cards.forEach(function (c) { if (c !== Rec.UNKNOWN) used[Ev.code(c)] = true; });

    var h = '<div class="pickrow">' + cardSlots(pick.cards, pick.want, 'lg') +
      (pick.cards.length
        ? '<button class="btn btn-ghost" data-act="cards-back" style="margin-left:10px">' +
        icon('arrow-u-up-left', 15) + '</button>' : '') + '</div>';

    h += '<div class="ranks">' + RANK_ORDER.split('').map(function (rk) {
      return '<button class="rk' + (pick.rank === rk ? ' on' : '') +
        '" data-rank="' + rk + '"' + (pick.cards.length >= pick.want ? ' disabled' : '') +
        '>' + rk + '</button>';
    }).join('') + '</div>';

    h += '<div class="suits">' + SUITS.map(function (s) {
      var taken = pick.rank && used[pick.rank + s[0]];
      return '<button class="su s-' + SUIT_CLASS[s[1]] + '" data-suit="' + s[0] + '"' +
        (!pick.rank || taken ? ' disabled' : '') + '>' + s[1] + '</button>';
    }).join('') + '</div>';

    h += '<p class="hint">' + (pick.rank
      ? 'Now the suit.'
      : (pick.cards.length >= pick.want ? 'That is all of them.' : 'Pick a rank, then a suit.')) +
      '</p>';

    if (pick.kind === 'hole') {
      h += '<button class="chipbtn" data-suit="?"' +
        (pick.cards.length >= pick.want ? ' disabled' : '') +
        '>They only showed one — mark the other unknown</button>';
    }
    return h;
  }

  function refreshCards() {
    var b = document.querySelector('#modal .modal-body');
    if (b) b.innerHTML = cardsBody();
  }

  /* ── setting a hand up ─────────────────────────────────── */

  /**
   * The cast, drawn as the table.
   *
   * Tapping a chip takes somebody out of the *hand*, never off the table —
   * so the positions stay right and their blind stays in the pot. This is
   * Hand recall's own methodology, which is what Ernest asked for.
   */
  function castBlock(r) {
    var seats = r.hand.seats.slice().sort(function (a, b) { return a.seat - b.seat; });
    var out = seats.filter(function (s) { return !Rec.inCast(r, s.seat); });
    var sess = r.recall && r.sessionId ? store.sessionById(r.sessionId) : null;
    var h = '<div class="section"><h2>' +
      (r.recall ? 'Who was at the table' : 'Who was in it') + '</h2>' +
      '<p class="hint">' +
      (r.recall
        ? (sess ? esc(sess.location || 'No venue') + ' · ' + esc(fmtDate(sess.date)) + '. ' : '') +
        'Add everybody you remember — the positions are read off the table, so the more of it ' +
        'you name the truer they are. Everyone is matched to their own record. Then tap anyone ' +
        'who was not in the hand.'
        : 'Tap anyone who was not. They stay at the table — their blind is still in the pot — ' +
        'and they fold the moment the action reaches them.') +
      '</p>' +
      '<div class="chips" style="margin-top:10px">' +
      seats.map(function (st) {
        var on = Rec.inCast(r, st.seat);
        return '<button class="chipbtn' + (on ? ' on' : ' off') +
          '" data-act="rec-cast" data-seat="' + st.seat + '">' +
          esc(st.name) + (st.hero ? ' <span class="n">you</span>' : '') + '</button>';
      }).join('') +
      (r.recall
        ? '<button class="chipbtn" data-act="rec-add-seat">' + icon('plus', 12) +
        ' Add someone</button>'
        : '') + '</div>';
    if (out.length) {
      var who = out.map(function (s) { return s.hero ? 'You' : s.name; });
      var last = who.pop();
      h += '<p class="hint" style="margin-top:8px">' +
        esc(who.length ? who.join(', ') + ' and ' + last : last) +
        (out.length === 1 ? ' was' : ' were') + ' not in it. Still ' +
        esc(String(r.hand.seats.length)) + ' handed, and their blinds are still in the pot.</p>';
    }
    /* Removing a chair renumbers everybody's position, so it is kept well
       away from the cast chips and only ever offered where the table is
       something he typed rather than something he sat at. */
    if (r.recall && r.hand.seats.length > 2) {
      h += '<p class="hint" style="margin-top:10px">Added by mistake?</p>' +
        '<div class="chips">' + seats.map(function (st) {
          return '<button class="chipbtn sm" data-act="rec-seat" data-seat="' + st.seat + '">' +
            icon('x', 11) + ' ' + esc(st.name) + '</button>';
        }).join('') + '</div>';
    }
    return h + '</div>';
  }

  /** Under the gun unless he has said otherwise for this hand. */
  function straddleType() {
    var r = rec();
    if (r && r.hand.straddle && r.hand.straddle.type) return r.hand.straddle.type;
    return window._stradType === 'miss' ? 'miss' : 'utg';
  }

  function recSetup(r) {
    var h = castBlock(r);

    h += '<div class="section"><h2>The button</h2>' +
      (r.hand.seats.length < 2
        ? '<p class="hint">Add at least two people first.</p>'
        : '<div class="chips">' + Rec.order(r).map(function (seat) {
        var s = Rec.seatById(r, seat);
        return '<button class="chipbtn' + (r.hand.buttonSeat === seat ? ' on' : '') +
          '" data-act="rec-button" data-seat="' + seat + '">' + esc(s.name) +
          (r.hand.buttonSeat === seat ? ' <span class="n">BTN</span>' : '') + '</button>';
      }).join('') + '</div>' +
      '<p class="hint">Positions follow from it, so this is the one thing worth getting right.</p>') +
      '</div>';

    h += '<div class="section"><h2>Stakes</h2><div class="formgrid">' +
      '<div class="field"><label for="rc-sb">Small blind</label>' +
      '<input class="input" id="rc-sb" inputmode="decimal" value="' + esc(r.hand.sb || '') + '"></div>' +
      '<div class="field"><label for="rc-bb">Big blind</label>' +
      '<input class="input" id="rc-bb" inputmode="decimal" value="' + esc(r.hand.bb || '') + '"></div>' +
      '<div class="field"><label for="rc-ante">Ante, each</label>' +
      '<input class="input" id="rc-ante" inputmode="decimal" value="' + esc(r.hand.ante || '') + '"></div>' +
      '<div class="field"><label for="rc-strad">Straddle</label>' +
      '<input class="input" id="rc-strad" inputmode="decimal" placeholder="none" value="' +
      esc((r.hand.straddle && r.hand.straddle.amount) || '') + '"></div>' +
      '</div>' +
      /* **Where the straddle sits.** It had always been posted under the
         gun, because that is the only type the handler ever passed — and
         his own game straddles the button in 21 of the 55 hands in the
         coaching archive. A Mississippi straddle acts last and moves
         first-to-act to the small blind, so getting it wrong moves every
         position in the hand. */
      '<div class="line" style="margin-top:10px">' +
      '<span class="hint" style="margin:0">Straddle from</span>' +
      '<div class="segmented" role="group" aria-label="Straddle position">' +
      [['utg', 'Under the gun'], ['miss', 'The button']].map(function (x) {
        var on = (r.hand.straddle && r.hand.straddle.type)
          ? r.hand.straddle.type === x[0]
          : straddleType() === x[0];
        return '<button data-act="rec-strad-type" data-type="' + x[0] + '" aria-pressed="' +
          (on ? 'true' : 'false') + '">' + x[1] + '</button>';
      }).join('') + '</div></div>' +
      '<button class="btn btn-ghost" data-act="rec-stakes" style="margin-top:12px">Set</button>' +
      '</div>';

    var heroSeat = null;
    r.hand.seats.forEach(function (s) { if (s.hero) heroSeat = s.seat; });
    h += '<div class="section"><h2>Your cards</h2>' +
      (heroSeat == null
        ? '<div class="alert warn">Nobody at this table is you, so this hand is one you watched. ' +
        'It will be recorded without your cards.</div>'
        : !Rec.inCast(r, heroSeat)
          ? '<p class="hint">You were not in this one, so there are no cards to enter. ' +
          'Whatever the blind cost you is still counted.</p>'
          : '<button class="cardbtn" data-act="rec-hole" data-seat="' + heroSeat + '">' +
          cardSlots(r.hand.hole[heroSeat], 2, 'lg') + '</button>' +
          '<p class="hint">Optional — a hand you watched is still worth keeping.</p>') +
      '</div>';

    var bad = Rec.readyToPlay(r);
    if (bad) h += '<div class="alert warn">' + esc(bad) + '</div>';
    return h + '<div class="cmdbar"><div class="line">' +
      '<button class="btn btn-ghost" data-act="rec-cancel">' + icon('x', 15) + ' Drop it</button>' +
      '<button class="btn btn-primary" data-act="rec-begin"' + (bad ? ' disabled' : '') + '>' +
      icon('play', 16) + ' Deal</button></div></div>';
  }

  /* ── playing it out ────────────────────────────────────── */

  function recPlay(r) {
    var st = Rec.state(r);
    var board = Rec.boardCards(r);
    var h = '';

    st.problems.forEach(function (p) { h += '<div class="alert err">' + esc(p) + '</div>'; });

    h += '<div class="handhead">' +
      '<div class="board">' + (board.length
        ? cardChips(board)
        : '<span class="muted-t">preflop</span>') + '</div>' +
      '<div class="pot"><span class="n">' + esc(Settle.plain(st.pot)) + '</span>' +
      '<span class="l">in the pot</span></div></div>';

    /* Every seat, in position order, with what it has done. */
    h += '<div class="seatlist">' + Rec.order(r).map(function (seat) {
      var s = Rec.seatById(r, seat);
      var folded = !!st.snap.folded[seat];
      var acting = st.next.type === 'action' && st.next.seat === seat;
      var inv = st.snap.contrib[seat] || 0;
      var outsider = !Rec.inCast(r, seat);
      return '<div class="seatrow' + (folded ? ' folded' : '') + (acting ? ' acting' : '') +
        (outsider ? ' outsider' : '') + '">' +
        '<span class="pos">' + esc(st.snap.positions[seat]) + '</span>' +
        '<span class="who">' + esc(s.name) + (s.hero ? ' <span class="n">you</span>' : '') + '</span>' +
        (outsider
          ? '<span class="out">not in it</span>'
          : '<button class="cardbtn sm" data-act="rec-hole" data-seat="' + seat + '">' +
          cardSlots(r.hand.hole[seat], 2, 'sm') + '</button>') +
        '<span class="inv">' + (inv ? esc(Settle.plain(inv)) : '') +
        (st.snap.allin[seat] ? ' <span class="n">all in</span>' : '') + '</span></div>';
    }).join('') + '</div>';

    h += st.next.type === 'action' ? recAction(r, st)
      : st.next.type === 'board' ? recBoard(r, st)
        : recShowdown(r, st);

    return h + '<div class="cmdbar"><div class="line">' +
      '<button class="btn btn-ghost" data-act="rec-undo">' + icon('arrow-u-up-left', 15) +
      ' Undo</button>' +
      '<button class="btn btn-ghost" data-act="rec-cancel">' + icon('x', 15) + ' Drop it</button>' +
      '</div></div>';
  }

  function recAction(r, st) {
    var L = st.legal, s = Rec.seatById(r, st.next.seat);
    var pot = st.pot;
    /* Sizes people actually bet, rounded to the big blind so the buttons
       read like chips rather than like arithmetic. */
    var bbv = Number(r.hand.bb) || 1;
    var roundBB = function (v) { return Math.max(L.minRaiseTo, Math.round(v / bbv) * bbv); };
    var sizes = L.currentBet > 0
      ? [['½ pot', roundBB(L.currentBet + (pot + L.toCall) * 0.5)],
      ['pot', roundBB(L.currentBet + (pot + L.toCall))]]
      : [['⅓', roundBB(pot / 3)], ['½', roundBB(pot / 2)], ['¾', roundBB(pot * 0.75)],
      ['pot', roundBB(pot)]];

    var h = '<div class="actpanel"><h3>' + esc(s.name) + ' · ' +
      esc(st.snap.positions[st.next.seat]) + '</h3>' +
      '<div class="actrow">' +
      '<button class="btn btn-ghost" data-act="rec-act" data-a="fold">Fold</button>' +
      (L.canCheck
        ? '<button class="btn btn-ghost" data-act="rec-act" data-a="check">Check</button>'
        : '<button class="btn btn-ghost" data-act="rec-act" data-a="call">Call ' +
        esc(Settle.plain(L.toCall)) + '</button>') +
      '</div>' +
      '<div class="field" style="margin-top:12px"><label for="rc-amt">' +
      (L.isRaise ? 'Raise to' : 'Bet') + '</label>' +
      '<input class="input" id="rc-amt" inputmode="decimal" placeholder="' +
      esc(String(L.minRaiseTo)) + '"></div>' +
      '<div class="chips" style="margin-top:8px">' + sizes.map(function (x) {
        return '<button class="chipbtn" data-fill-amt="' + x[1] + '">' + x[0] + ' · ' +
          esc(Settle.plain(x[1])) + '</button>';
      }).join('') + '</div>' +
      '<div class="actrow" style="margin-top:12px">' +
      '<button class="btn btn-primary" data-act="rec-act" data-a="' +
      (L.isRaise ? 'raise' : 'bet') + '">' + (L.isRaise ? 'Raise' : 'Bet') + '</button>' +
      /* **The jam is the moment the stack becomes known.** Nobody knows
         what the man across the table has behind until he pushes it in,
         so the app asks for it here rather than up front: type the total
         into the box above and All in believes it, back-filling his
         stack so every later street settles against a real number. With
         a stack already on file the button carries the figure itself. */
      '<button class="btn btn-ghost" data-act="rec-act" data-a="allin">All in' +
      (L.allInTo != null ? ' ' + esc(Settle.plain(L.allInTo)) : '') + '</button>' +
      '</div>' +
      (L.allInTo == null
        ? '<p class="hint" style="margin-top:8px">All in reads the box above as their total — ' +
        'put it in if you know it, and the rest of the hand settles against it.</p>'
        : '') +
      '</div>';
    return h;
  }

  function recBoard(r, st) {
    var street = st.next.street;
    var name = ['', 'flop', 'turn', 'river'][street];
    return '<div class="actpanel"><h3>The ' + name + '</h3>' +
      (st.next.runout ? '<p class="hint">Everyone is all in — run it out.</p>' : '') +
      '<button class="cardbtn" data-act="rec-board" data-street="' + street + '">' +
      cardSlots(r.hand.boards[street], HR.BOARD_COUNT[street], 'lg') + '</button></div>';
  }

  function recShowdown(r, st) {
    var res = Rec.resolve(r);
    var live = st.snap.live || [];
    var chosen = Rec.winners(r);
    var h = '<div class="actpanel"><h3>Showdown</h3>';

    if (live.length === 1) {
      h += '<p class="hint">Everyone folded. ' +
        esc(Rec.seatById(r, live[0]).name) + ' takes it.</p>';
    } else if (res.ok) {
      h += '<div class="verdictline">' + icon('check-circle', 16) +
        '<span>' + esc(res.winners.map(function (s) { return Rec.seatById(r, s).name; }).join(' and ')) +
        (res.reason === 'split' ? ' split it' : ' wins') +
        (res.ranked.length ? ' — ' + esc(res.ranked[0].name) : '') + '</span></div>';
      h += '<ul class="ranklist">' + res.ranked.map(function (x) {
        return '<li><span>' + esc(Rec.seatById(r, x.seat).name) + '</span>' +
          '<span class="muted-t">' + esc(x.name) + '</span></li>';
      }).join('') + '</ul>';
    } else {
      h += '<p class="hint">' + (res.undecided.length
        ? 'Tap in the cards of anyone who showed, and it will work out who won. ' +
        'Otherwise say who took it.'
        : 'Say who took it.') + '</p>';
    }

    /* The override is always available. The evaluator can only rank the
       cards it was given, and Ernest was there. */
    h += '<p class="hint" style="margin-top:12px">Who won</p><div class="chips">' +
      live.map(function (seat) {
        return '<button class="chipbtn' + (chosen.indexOf(seat) >= 0 ? ' on' : '') +
          '" data-act="rec-winner" data-seat="' + seat + '">' +
          esc(Rec.seatById(r, seat).name) + '</button>';
      }).join('') + '</div>' +
      (r.override ? '<p class="hint">Your call, not the cards’.</p>' : '');

    /* Every hand goes into the file under a name. He never has to type
       one — the box arrives filled in with the one the hand wrote for
       itself, and anything he types replaces it. */
    h += '<div class="field" style="margin-top:14px"><label for="rc-name">Call it</label>' +
      '<input class="input" id="rc-name" maxlength="80" value="' +
      esc(r.hand.name || Rec.autoName(r)) + '"></div>';

    var heroSeat = null;
    r.hand.seats.forEach(function (s) { if (s.hero) heroSeat = s.seat; });
    if (heroSeat != null && !Rec.significant(r)) {
      var cost = st.snap.contrib[heroSeat] || 0;
      h += '<p class="hint">Filed as a hand you watched — you posted' +
        (cost ? ' ' + esc(Settle.plain(cost)) : ' nothing') +
        ' and never had a decision in it. The money still counts.</p>';
    }

    h += '<div class="field" style="margin-top:12px"><label for="rc-note">Note</label>' +
      '<textarea class="textarea" id="rc-note" rows="2" placeholder="' +
      'What made it worth keeping">' + esc(r.hand.note || '') + '</textarea></div>';

    var bad = Rec.readyToSave(r);
    if (bad) h += '<div class="alert warn">' + esc(bad) + '</div>';
    h += '<button class="btn btn-primary" data-act="rec-save"' + (bad ? ' disabled' : '') +
      ' style="margin-top:12px">' + icon('floppy-disk', 16) + ' Keep this hand</button>';
    return h + '</div>';
  }

  /* ══════════════════════════════════════════════════════════
     A HAND FROM MEMORY

     Ernest, 21/08/2026: *"I also need a button that lets me add hands
     just based off recall if possible."* Most hands worth keeping are
     remembered on the way home, not tapped in at the table. The only
     thing a live night supplied was a roster and a date; here he picks
     both, and everything after that is the same recorder.
     ══════════════════════════════════════════════════════════ */

  /** The recorder's state when no night is running lives in the store. */
