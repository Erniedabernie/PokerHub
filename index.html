    if (n < 0) return { error: 'It cannot be negative.' };
    if (n > 100000000) return { error: 'That is too large.' };
    return { amount: Settle.round2(n) };
  }

  /* ══════════════════════════════════════════════════════════
     THE SEATING

     A chair is an index, 0 .. tableSize−1. Seat 0 is the chair on the
     dealer's left and the numbers run clockwise, which is how a card room
     numbers them and how `PHEngine.seatAnchors` draws them — so the app's
     table, the share picture and the actual room read the same way round.

     The button is a **seat**, not a person: it stays put when somebody
     moves and passes round the table, which is what happens in the room.
     A re-draw settles it afresh, because that is what a re-draw is.
     ══════════════════════════════════════════════════════════ */

  /** Everyone still in a chair, in seat order. Cashed-out seats stay taken
      until the player is removed — they are still sitting there. */
  function seated(live) {
    return live.players.slice().sort(function (a, b) {
      return (a.seat == null ? 99 : a.seat) - (b.seat == null ? 99 : b.seat);
    });
  }

  function playerInSeat(live, seat) {
    for (var i = 0; i < live.players.length; i++) {
      if (live.players[i].seat === seat) return live.players[i];
    }
    return null;
  }

  function seatFree(live, seat) {
    return seat != null && seat >= 0 && seat < live.tableSize && !playerInSeat(live, seat);
  }

  function firstFreeSeat(live) {
    for (var i = 0; i < live.tableSize; i++) if (!playerInSeat(live, i)) return i;
    return null;
  }

  function emptySeats(live) {
    var out = [];
    for (var i = 0; i < live.tableSize; i++) if (!playerInSeat(live, i)) out.push(i);
    return out;
  }

  /** Grow or shrink the table. It can never be smaller than what is used. */
  function setTableSize(live, n) {
    var want = seatCount(n);
    var highest = -1;
    live.players.forEach(function (p) { if (p.seat != null) highest = Math.max(highest, p.seat); });
    if (want <= highest) {
      return { error: 'Seat ' + (highest + 1) + ' is taken. Move them first.' };
    }
    live.tableSize = want;
    if (live.buttonSeat >= want) live.buttonSeat = 0;
    return { tableSize: want };
  }

  function setButton(live, seat) {
    if (seat == null || seat < 0 || seat >= live.tableSize) return { error: 'No such chair.' };
    live.buttonSeat = seat;
    return { buttonSeat: seat };
  }

  /**
   * Move somebody, or swap two people.
   *
   * People change chairs, usually to get position on somebody. An occupied
   * target is a swap; an empty one is a move. The button does not travel
   * with them: move into the button seat and you have the button, which is
   * what happens at the table.
   */
  function moveSeat(live, id, seat) {
    var p = byId(live, id);
    if (!p) return { error: 'Nobody by that id.' };
    if (seat == null || seat < 0 || seat >= live.tableSize) return { error: 'No such chair.' };
    if (p.seat === seat) return { player: p, moved: false };
    var other = playerInSeat(live, seat);
    var was = p.seat;
    p.seat = seat;
    if (other) other.seat = was;
    return { player: p, swappedWith: other || null, moved: true };
  }

  /**
   * Draw the whole table again — Fisher–Yates over the chairs, button
   * included. The button is part of the draw because a re-draw is meant to
   * settle everything afresh.
   *
   * `opts.rng` makes it testable; without one it uses `Math.random`.
   * Returns the order the seats were dealt in, which is what the draw
   * animation replays.
   */
  function randomise(live, opts) {
    opts = opts || {};
    var rnd = opts.rng || Math.random;
    var n = live.players.length;
    if (n < 2) return { error: 'Two people at the table, at least.' };
    if (live.tableSize < n) live.tableSize = seatCount(n);

    var chairs = [];
    for (var i = 0; i < live.tableSize; i++) chairs.push(i);
    for (var j = chairs.length - 1; j > 0; j--) {
      var k = Math.floor(rnd() * (j + 1));
      var t = chairs[j]; chairs[j] = chairs[k]; chairs[k] = t;
    }
    var order = live.players.slice();
    for (var m = order.length - 1; m > 0; m--) {
      var q = Math.floor(rnd() * (m + 1));
      var tmp = order[m]; order[m] = order[q]; order[q] = tmp;
    }
    order.forEach(function (p, idx) { p.seat = chairs[idx]; });
    /* The button goes to somebody, not to an empty chair: a draw that
       parked it on a gap would leave the table with no button at all and
       hand the first position to whoever happened to sit clockwise of a
       hole. */
    var taken = order.map(function (p) { return p.seat; });
    live.buttonSeat = taken[Math.floor(rnd() * taken.length)];
    return { order: order.map(function (p) { return p.id; }), buttonSeat: live.buttonSeat };
  }

  /**
   * The seating, in the shape the picture renderers want.
   * `seats` is in draw order when one is given, otherwise seat order — the
   * animation pitches names in that order.
   */
  function seatingPlan(live, opts) {
    opts = opts || {};
    var list = opts.order
      ? opts.order.map(function (id) { return byId(live, id); }).filter(Boolean)
      : seated(live);
    var ids = live.players.map(function (p) { return p.seat; })
      .filter(function (x) { return x != null; })
      .sort(function (a, b) { return a - b; });
    var pos = positionsFor(live);
    return {
      venue: live.venue || '',
      /* The renderer prints this straight onto the picture, so it is the
         date as a person reads it, not the epoch it is stored as. */
      date: Settle.dateOnly(live.startedAt || opts.now || 0),
      stakes: live.stakes || '',
      buttonSeat: live.buttonSeat,
      tableSize: live.tableSize,
      seats: list.filter(function (p) { return p.seat != null; }).map(function (p) {
        return { seat: p.seat, name: p.name, pos: pos[p.seat] || '', hero: !!p.hero };
      }),
      order: ids
    };
  }

  /**
   * Position labels for the seats that are taken, from the button round.
   * The engine owns the naming, so the table, the recorder and the share
   * picture cannot disagree about who is under the gun.
   */
  function positionsFor(live) {
    var taken = live.players.map(function (p) { return p.seat; })
      .filter(function (x) { return x != null; });
    if (!taken.length) return {};
    var order = Imp.seatOrder
      ? Imp.seatOrder(taken, live.buttonSeat)
      : orderFrom(taken, live.buttonSeat);
    var names = POSITIONS[order.length] || [];
    var out = {};
    order.forEach(function (seat, i) { out[seat] = names[i] || ('S' + (seat + 1)); });
    return out;
  }

  /* The engine's own tables, duplicated here only so `live.js` stays
     loadable without it in node. Kept identical on purpose. */
  var POSITIONS = {
    2: ['SB', 'BB'],
    3: ['SB', 'BB', 'BTN'],
    4: ['SB', 'BB', 'CO', 'BTN'],
    5: ['SB', 'BB', 'HJ', 'CO', 'BTN'],
    6: ['SB', 'BB', 'LJ', 'HJ', 'CO', 'BTN'],
    7: ['SB', 'BB', 'UTG', 'LJ', 'HJ', 'CO', 'BTN'],
    8: ['SB', 'BB', 'UTG', 'UTG+1', 'LJ', 'HJ', 'CO', 'BTN'],
    9: ['SB', 'BB', 'UTG', 'UTG+1', 'UTG+2', 'LJ', 'HJ', 'CO', 'BTN'],
    10: ['SB', 'BB', 'UTG', 'UTG+1', 'UTG+2', 'UTG+3', 'LJ', 'HJ', 'CO', 'BTN']
  };

  function orderFrom(seats, buttonSeat) {
    var ids = seats.slice().sort(function (a, b) { return a - b; });
    if (!ids.length) return [];
    if (ids.indexOf(buttonSeat) < 0) buttonSeat = ids[ids.length - 1];
    if (ids.length === 2) {
      var other = ids[0] === buttonSeat ? ids[1] : ids[0];
      return [buttonSeat, other];
    }
    var at = ids.indexOf(buttonSeat);
    var out = [];
    for (var i = 1; i <= ids.length; i++) out.push(ids[(at + i) % ids.length]);
    return out;
  }

  /* ── the timeline ──────────────────────────────────────────── */

  function logEvent(live, name, type, amount, now) {
    var ts = now || 0;
    if (!live.startedAt) {
      live.startedAt = ts;
      if (!live.segments.length) live.segments.push({ start: ts, end: null });
    }
    live.events.push({
      name: name, type: type,
      amount: amount == null ? null : Settle.round2(amount),
      ts: ts
    });
  }

  function byId(live, id) {
    for (var i = 0; i < live.players.length; i++) if (live.players[i].id === id) return live.players[i];
    return null;
  }

  /* ── actions ───────────────────────────────────────────────── */

  /**
   * Seat somebody.
   *
   * `opts.playerId` is the person this seat *is* — resolved by the caller,
   * which is the only layer with the store. A seat that carries it settles
   * by id rather than by name, so the ledger row lands on the same record
   * whether the night was typed `Pat`, `patrick` or `Patrick`. Null is
   * legal and means the hero, who has no opponent record by design.
   */
  function addPlayer(live, name, amount, now, opts) {
    opts = opts || {};
    var vn = validName(live, name); if (vn.error) return vn;
    /* One person cannot occupy two seats. Names alone would not catch it —
       `Pat` and `Patrick` are different strings and the same man — and the
       cost is silent: a ledger row is keyed on (session, player), so the
       second seat would overwrite the first and the night would stop
       summing to zero without saying anything. */
    if (opts.playerId) {
      for (var d = 0; d < live.players.length; d++) {
        if (live.players[d].playerId === opts.playerId) {
          return { error: live.players[d].name + ' is already at the table.' };
        }
      }
    }
    /* The hero has no player record, so the check above cannot catch him.
       `heroName` is an alias list — "Ernest, EDB" out of the box — and
       both aliases are him: seat one under each and the table has two
       heroes, which every downstream reader resolves differently. `replay`
       takes the last, `heroIndex` the first, so a hand would report one
       chair's cards and the other chair's money. */
    if (opts.hero) {
      for (var hh = 0; hh < live.players.length; hh++) {
        if (live.players[hh].hero) {
          return { error: 'You are already at this table, as ' + live.players[hh].name + '.' };
        }
      }
    }
    var va = validAmount(amount); if (va.error) return va;
    var p = {
      id: live.nextId++, name: vn.name, playerId: opts.playerId || null,
      /* His own chair is marked on the share picture; nobody else's is. */
      hero: !!opts.hero,
      /* A chair, chosen or the first free one. Somebody who sits down at a
         full table gets one anyway — the table grows rather than refusing
         a real person who is really there. */
      seat: null,
      buyins: [va.amount], cashedOut: false, cashout: 0
    };
    live.players.push(p);
    var want = opts.seat;
    if (want == null || !seatFree(live, want)) want = firstFreeSeat(live);
    if (want == null) { live.tableSize = seatCount(live.tableSize + 1); want = firstFreeSeat(live); }
    p.seat = want;
    logEvent(live, vn.name, 'buyin', va.amount, now);
    return { player: p };
  }

  function topUp(live, id, amount, now) {
    var p = byId(live, id); if (!p) return { error: 'Nobody by that id.' };
    if (p.cashedOut) return { error: p.name + ' has already cashed out. Buy them back in first.' };
    var va = validAmount(amount); if (va.error) return va;
    p.buyins.push(va.amount);
    logEvent(live, p.name, 'buyin', va.amount, now);
    return { player: p };
  }

  function cashOut(live, id, amount, now) {
    var p = byId(live, id); if (!p) return { error: 'Nobody by that id.' };
    var va = validAmount(amount, { allowZero: true }); if (va.error) return va;
    p.cashedOut = true;
    p.cashout = va.amount;
    logEvent(live, p.name, 'cashout', va.amount, now);
    return { player: p };
  }

  function reopen(live, id, now) {
    var p = byId(live, id); if (!p) return { error: 'Nobody by that id.' };
    if (!p.cashedOut) return { error: p.name + ' is still playing.' };
    p.cashedOut = false;
    p.cashout = 0;
    logEvent(live, p.name, 'reopen', null, now);
    return { player: p };
  }

  /** Correct a buy-in that was mistyped. The timeline records the fix. */
  function adjustBuyIn(live, id, index, amount, now) {
    var p = byId(live, id); if (!p) return { error: 'Nobody by that id.' };
    if (index < 0 || index >= p.buyins.length) return { error: 'No such buy-in.' };
    var va = validAmount(amount); if (va.error) return va;
    var was = p.buyins[index];
    if (was === va.amount) return { player: p };
    p.buyins[index] = va.amount;
    logEvent(live, p.name, 'adjust', va.amount - was, now);
    return { player: p, was: was };
  }

  function removePlayer(live, id, now) {
    var p = byId(live, id); if (!p) return { error: 'Nobody by that id.' };
    var total = Settle.totalBuyIn(p);
    live.players = live.players.filter(function (x) { return x.id !== id; });
    logEvent(live, p.name, 'adjust', -total, now);
    return { removed: p };
  }

  function setTip(live, amount) {
    var va = validAmount(amount, { allowZero: true });
    if (va.error) return va;
    live.tip = va.amount;
    if (!live.dealer) live.tip = 0;
    return { tip: live.tip };
  }

  /* ── notes ─────────────────────────────────────────────────── */

  /**
   * A read, taken at the table. Physical tells are the one class that
   * cannot be reconstructed from a hand history afterwards, so the point
   * is that this costs one tap while the hand is still in front of him.
   */
  function addNote(live, text, cat, seatId, now) {
    var s = String(text == null ? '' : text).trim();
    if (!s) return { error: 'Nothing to note.' };
    var seat = seatId == null ? null : byId(live, seatId);
    live.notes.push({
      t: now || 0,
      cat: NOTE_CATS.indexOf(cat) >= 0 ? cat : 'Note',
      text: s,
      seatId: seat ? seat.id : null,
      name: seat ? seat.name : ''
    });
    return { note: live.notes[live.notes.length - 1] };
  }

  /** Who dealt. A label for the night's record, nothing more — the tip is
   *  the settlement party, the name is so the ledger can say whose it was. */
  function setDealer(live, name) {
    live.dealerName = String(name == null ? '' : name).trim();
    return { dealerName: live.dealerName };
  }

  function removeNote(live, index) {
    if (index < 0 || index >= live.notes.length) return { error: 'No such note.' };
    return { removed: live.notes.splice(index, 1)[0] };
  }

  /* ── pause and hours ───────────────────────────────────────── */

  function isPaused(live) {
    var last = live.segments[live.segments.length - 1];
    return !!last && last.end != null;
  }

  function pause(live, now) {
    var last = live.segments[live.segments.length - 1];
    if (!last || last.end != null) return { error: 'Not running.' };
    last.end = now || 0;
    return { paused: true };
  }

  function resume(live, now) {
    if (!isPaused(live)) return { error: 'Already running.' };
    live.segments.push({ start: now || 0, end: null });
    return { paused: false };
  }

  /**
   * Hours actually played, in milliseconds.
   *
   * Segments are the record; the timeline is the fallback for a session
   * that predates them. A break is not poker, so a paused stretch is not
   * counted — which is the whole reason the pause exists.
   */
  function elapsed(live, now) {
    now = now || 0;
    if (live.segments && live.segments.length) {
      var t = 0;
      live.segments.forEach(function (sg) {
        var end = sg.end == null ? now : sg.end;
        if (end > sg.start) t += end - sg.start;
      });
      return t;
    }
    var start = Settle.sessionStart(live);
    if (!start) return 0;
    var last = Settle.sessionEnd(live) || now;
    return Math.max(0, last - start);
  }

  function hours(live, now) {
    var ms = elapsed(live, now);
    return ms > 0 ? Math.round((ms / 3600000) * 100) / 100 : null;
  }

  function clock(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + ':' + (m < 10 ? '0' : '') + m;
  }

  /* ── settling ──────────────────────────────────────────────── */

  function totals(live) { return Settle.totals(live); }
  function settle(live) { return Settle.settle(live); }

  function shareText(live, opts) {
    opts = opts || {};
    return Settle.ledgerText(live, {
      fence: opts.fence !== false,
      currency: opts.currency,
      title: live.venue || 'Home game'
    });
  }

  /** Who is Ernest at this table? Index into `players`, or −1. */
  function heroIndex(live, settings) {
    for (var i = 0; i < live.players.length; i++) {
      if (Imp.looksLikeHero(live.players[i].name, settings)) return i;
    }
    return -1;
  }

  /**
   * The live state as a tracker export.
   *
   * Committing goes through `planTracker` rather than writing rows here:
   * that path resolves identity, refuses to duplicate a row for a player
   * who already has one for this night, and carries the timeline onto the
   * session for the rebuy-timing work in stage 4.
   */
  function toTrackerPayload(live) {
    return {
      app: 'home-game-tracker',
      version: 1,
      savedAt: null,
      state: {
        players: live.players.map(function (p) {
          return {
            id: p.id, name: p.name, buyins: p.buyins.slice(),
            cashedOut: !!p.cashedOut, cashout: num(p.cashout)
          };
        }),
        events: clone(live.events),
        tip: live.dealer ? num(live.tip) : 0,
        dealer: !!live.dealer,
        nextId: live.nextId,
        startedAt: live.startedAt
      }
    };
  }

  /**
   * File the night. Returns the import plan — the caller previews it and
   * calls `Imp.commit`, exactly as it would for a file, so a live night
   * and an imported one land through one code path.
   */
  function plan(store, live, opts) {
    opts = opts || {};
    var now = opts.now || 0;
    var hi = opts.heroIndex;
    if (hi == null) hi = heroIndex(live, store.db.settings);
    var p = Imp.planTracker(store, toTrackerPayload(live), {
      now: now,
      venue: live.venue || store.db.settings.defaultLocation || '',
      stakes: live.stakes || store.db.settings.defaultStakes || '',
      currency: live.currency,
      heroIndex: hi < 0 && opts.heroIndex == null ? undefined : hi,
      hours: hours(live, now),
      liveNotes: live.notes,
      dealerName: live.dealer ? (live.dealerName || '') : '',
      /* Identity was settled when they sat down. Aligned to `players`, so
         the importer resolves by id and never has to guess from a name it
         has already been told the answer to. */
      playerIds: live.players.map(function (p) { return p.playerId || null; })
    });
    return p;
  }

  return {
    NOTE_CATS: NOTE_CATS, UNDO_CAP: UNDO_CAP, DEALER_NAME: DEALER_NAME,
    MIN_SEATS: MIN_SEATS, MAX_SEATS: MAX_SEATS, POSITIONS: POSITIONS,
    create: create, validName: validName, validAmount: validAmount,
    seatCount: seatCount, seated: seated, playerInSeat: playerInSeat,
    seatFree: seatFree, firstFreeSeat: firstFreeSeat, emptySeats: emptySeats,
    setTableSize: setTableSize, setButton: setButton, moveSeat: moveSeat,
    randomise: randomise, seatingPlan: seatingPlan, positionsFor: positionsFor,
    orderFrom: orderFrom,
    byId: byId, logEvent: logEvent, setDealer: setDealer,
    addPlayer: addPlayer, topUp: topUp, cashOut: cashOut, reopen: reopen,
    adjustBuyIn: adjustBuyIn, removePlayer: removePlayer, setTip: setTip,
    addNote: addNote, removeNote: removeNote,
    isPaused: isPaused, pause: pause, resume: resume,
    elapsed: elapsed, hours: hours, clock: clock,
    totals: totals, settle: settle, shareText: shareText,
    heroIndex: heroIndex, toTrackerPayload: toTrackerPayload, plan: plan
  };
}));
</script>
<script>/* A minimal animated-GIF encoder. ~150 lines, no dependencies, no network.

   Why hand-rolled: the app is one file with zero network requests, so pulling
   in gif.js or similar was never an option. Only what is needed is here —
   GIF89a, a global palette, LZW, and the Netscape loop block.

   Colour: GIF is palette-based and the app is near-monochrome, so instead of
   quantising properly (median cut, error diffusion — a lot of code for no
   visible gain here) the palette is BUILT from the ramps the design system
   actually uses. Every pixel then finds its nearest entry, cached by RGB, so a
   frame costs one hash lookup per distinct colour rather than a search.

   window.GIF.encode(frames, {width, height, delay, palette, loop}) -> Uint8Array
     frames  : ImageData[] — same size, in order
     delay   : centiseconds per frame (GIF's unit, not milliseconds)
     palette : [[r,g,b], …] up to 256 entries; index 0 is the background
     loop    : true (default) repeats forever; false plays once and FREEZES on
               the last frame. Looping is the Netscape 2.0 application block —
               omit it and a decoder stops rather than starting over, which is
               what you want when the last frame is the answer. */
(function () {
  'use strict';

  /* ---- bit-level output ------------------------------------------------ */
  function Bytes() { this.a = []; }
  Bytes.prototype.byte = function (b) { this.a.push(b & 255); };
  Bytes.prototype.word = function (w) { this.byte(w); this.byte(w >> 8); };
  Bytes.prototype.str = function (s) {
    for (var i = 0; i < s.length; i++) this.byte(s.charCodeAt(i));
  };
  Bytes.prototype.bytes = function (arr) {
    for (var i = 0; i < arr.length; i++) this.byte(arr[i]);
  };

  /* GIF's LZW writes codes LSB-first into a stream that is then cut into
     sub-blocks of at most 255 bytes. */
  function LZW(minCodeSize) {
    this.min = minCodeSize;
    this.out = [];
    this.cur = 0;
    this.bits = 0;
  }
  LZW.prototype.write = function (code, size) {
    this.cur |= code << this.bits;
    this.bits += size;
    while (this.bits >= 8) {
      this.out.push(this.cur & 255);
      this.cur >>= 8;
      this.bits -= 8;
    }
  };
  LZW.prototype.flush = function () {
    if (this.bits > 0) { this.out.push(this.cur & 255); this.cur = 0; this.bits = 0; }
    return this.out;
  };

  function lzwCompress(indices, minCodeSize) {
    var clear = 1 << minCodeSize;
    var eoi = clear + 1;
    var size = minCodeSize + 1;
    var next = eoi + 1;
    var dict = Object.create(null);
    var w = new LZW(minCodeSize);

    w.write(clear, size);
    var prev = indices[0];
    for (var i = 1; i < indices.length; i++) {
      var k = indices[i];
      var key = prev * 4096 + k;
      if (dict[key] !== undefined) { prev = dict[key]; continue; }
      w.write(prev, size);
      dict[key] = next++;
      if (next === (1 << size) + 1 && size < 12) size++;
      else if (next > 4095) {
        w.write(clear, size);
        dict = Object.create(null);
        next = eoi + 1;
        size = minCodeSize + 1;
      }
      prev = k;
    }
    w.write(prev, size);
    w.write(eoi, size);
    return w.flush();
  }

  /* ---- palette --------------------------------------------------------- */
  function nearestFactory(palette) {
    var cache = Object.create(null);
    return function (r, g, b) {
      var key = (r << 16) | (g << 8) | b;
      var hit = cache[key];
      if (hit !== undefined) return hit;
      var best = 0, bestD = Infinity;
      for (var i = 0; i < palette.length; i++) {
        var p = palette[i];
        var dr = r - p[0], dg = g - p[1], db = b - p[2];
        /* weighted for perceived brightness — green carries most of it */
        var d = dr * dr * 3 + dg * dg * 6 + db * db;
        if (d < bestD) { bestD = d; best = i; }
      }
      cache[key] = best;
      return best;
    };
  }

  /* A ramp between two colours, endpoints included. */
  function ramp(a, b, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var t = n === 1 ? 0 : i / (n - 1);
      out.push([
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t)
      ]);
    }
    return out;
  }

  function hexRGB(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  /* ---- encode ---------------------------------------------------------- */
  function encode(frames, opts) {
    if (!frames.length) throw new Error('no frames');
    var W = opts.width, H = opts.height;
    var pal = opts.palette.slice(0, 256);
    /* GIF wants a power-of-two palette; pad with the background rather than
       black, so a rounding error can never show up as a dark speck */
    var bits = Math.max(2, Math.ceil(Math.log(pal.length) / Math.LN2));
    var full = 1 << bits;
    while (pal.length < full) pal.push(pal[0]);

    var nearest = nearestFactory(pal);
    var b = new Bytes();
    b.str('GIF89a');
    b.word(W); b.word(H);
    b.byte(0xF0 | (bits - 1));      /* global table, 8-bit colour, size */
    b.byte(0); b.byte(0);
    pal.forEach(function (c) { b.byte(c[0]); b.byte(c[1]); b.byte(c[2]); });

    /* Netscape 2.0 application block — the only way to say "loop forever".
       Left out entirely when the animation should stop on its last frame:
       there is no "loop once" every decoder agrees on, but every decoder
       agrees on the absence of this block. */
    if (opts.loop !== false) {
      b.byte(0x21); b.byte(0xFF); b.byte(11);
      b.str('NETSCAPE2.0');
      b.byte(3); b.byte(1); b.word(0); b.byte(0);
    }

    frames.forEach(function (frame, i) {
      var delay = Array.isArray(opts.delay) ? opts.delay[i] : opts.delay;
      b.byte(0x21); b.byte(0xF9); b.byte(4);
      /* packed byte: disposal method in bits 2-4. 0x04 is disposal 1, "do not
         dispose" — leave the frame up. Every frame here is full-size and
         opaque, so each simply paints over the last, and the final one stays
         on screen when the animation stops. (0x08 would be "restore to
         background", which flickers black between frames.) */
      b.byte(0x04);
      b.word(delay); b.byte(0); b.byte(0);

      b.byte(0x2C);
      b.word(0); b.word(0); b.word(W); b.word(H);
      b.byte(0);                    /* no local table, not interlaced */

      var d = frame.data;
      var idx = new Uint8Array(W * H);
      for (var p = 0, q = 0; q < idx.length; p += 4, q++) {
        idx[q] = nearest(d[p], d[p + 1], d[p + 2]);
      }
      var min = Math.max(2, bits);
      var bytes = lzwCompress(idx, min);
      b.byte(min);
      for (var o = 0; o < bytes.length; o += 255) {
        var chunk = bytes.slice(o, o + 255);
        b.byte(chunk.length);
        b.bytes(chunk);
      }
      b.byte(0);
    });

    b.byte(0x3B);
    return new Uint8Array(b.a);
  }

  var API = { encode: encode, ramp: ramp, hexRGB: hexRGB };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  /* The renderers reach for it as `GIF`; the build names it `PHGif` like
     every other module. Both, so neither file has to change. */
  var root = typeof globalThis !== 'undefined' ? globalThis : this;
  root.GIF = API;
  root.PHGif = API;
})();
</script>

<script>/* ============================================================
   Poker hub — the picture renderers.

   **Hand recall's `image.js`, vendored** — v2.2.0, with exactly one line
   changed: the signature says *Poker hub*, because this is the app that
   drew it. Everything else is byte for byte, so a picture shared from
   here is one Hand recall would have drawn. Four outputs,
   all drawn on a canvas from theme tokens read live, so a light-theme
   picture comes out light:

     · `renderSeatingPlan(plan, opts)` — the 900×800 table map. Who is in
       which chair, their position, where the button is. Shareable before
       a card is dealt.
     · `renderSeatingGif(plan)` — the draw, animated: names pitched from
       the dealer, one per beat, freezing on the final seating. That last
       frame *is* the still, so the two cannot disagree.
     · `renderHandImage(hd, 'card')` — the compact hand picture.
     · `renderHandImage(hd, 'table')` — the felt, the GG-style share.

   Depends on `PHEngine` (seat anchors, the hand rows), `PHGif` (the
   hand-rolled GIF89a encoder) and `MARK_PATHS`.
   Every draw helper saves and restores the context — canvas state is
   global, and a stray textAlign silently wrecks the layout below it.
   ============================================================ */
(function () {
  'use strict';

  var HR = window.HR;
  var W = 1080;

  function tokens() {
    var cs = getComputedStyle(document.documentElement);
    function t(n, fb) { return (cs.getPropertyValue(n) || '').trim() || fb; }
    return {
      bg: t('--bg', '#050a0e'),
      surface: t('--surface', '#091622'),
      high: t('--surface-high', '#0f2030'),
      border: t('--border', '#16293d'),
      text: t('--text', '#eaf4ff'),
      muted: t('--muted-text', '#6a90b8'),
      accent: t('--accent', '#0077b6'),
      accentText: t('--accent-text', '#5bc0eb'),
      accentDim: t('--accent-dim', 'rgba(0,119,182,0.18)'),
      up: t('--success-text', '#10b981'),
      down: t('--error-text', '#e11d48'),
      su_s: t('--su-s', '#eaf4ff'),
      su_h: t('--su-h', '#e11d48'),
      su_d: t('--su-d', '#0ea5e9'),
      su_c: t('--su-c', '#3fae82')
    };
  }

  var UI = '"Source Sans 3", system-ui, sans-serif';
  var MONO = '"Fira Mono", ui-monospace, monospace';
  var SERIF = '"EB Garamond", Georgia, serif';

  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function card(ctx, C, x, y, w, hh, c) {
    var unk = c === HR.UNKNOWN;
    ctx.save();
    rr(ctx, x, y, w, hh, Math.max(4, w * 0.13));
    ctx.fillStyle = unk ? C.high : C.surface; ctx.fill();
    ctx.strokeStyle = C.border; ctx.lineWidth = Math.max(1.5, w * 0.035); ctx.stroke();
    if (unk) {
      ctx.fillStyle = C.muted;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '500 ' + Math.round(hh * 0.42) + 'px ' + MONO;
      ctx.fillText('?', x + w / 2, y + hh * 0.52);
    } else if (c) {
      ctx.fillStyle = C['su_' + c[1]];
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '500 ' + Math.round(hh * 0.40) + 'px ' + MONO;
      ctx.fillText(c[0], x + w / 2, y + hh * 0.33);
      ctx.font = Math.round(hh * 0.36) + 'px ' + MONO;
      ctx.fillText(HR.SUIT_GLYPH[c[1]], x + w / 2, y + hh * 0.71);
    }
    ctx.restore();
  }

  /* draws a row of cards and returns the width it occupied */
  function cards(ctx, C, x, y, w, hh, list, gap) {
    list = list || [];
    list.forEach(function (c, i) { card(ctx, C, x + i * (w + gap), y, w, hh, c); });
    return list.length ? list.length * (w + gap) - gap : 0;
  }

  /* a hand that got to the end but was never shown */
  function unknownCards(ctx, C, x, y, w, hh, gap) {
    return cards(ctx, C, x, y, w, hh, [HR.UNKNOWN, HR.UNKNOWN], gap);
  }

  /* street label — mono, not the tracked Garamond tag: "PF" must read as one word */
  function streetTag(ctx, C, x, y, str) {
    ctx.save();
    ctx.font = '500 24px ' + MONO;
    ctx.fillStyle = C.accentText;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function label(ctx, C, x, y, str, colour, size) {
    ctx.save();
    ctx.font = (size || 24) + 'px ' + UI;
    ctx.fillStyle = colour || C.muted;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function right(ctx, C, x, y, str, font, colour) {
    ctx.save();
    ctx.font = font; ctx.fillStyle = colour;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function hairline(ctx, C, x1, x2, y, weight) {
    ctx.save();
    ctx.strokeStyle = C.border; ctx.lineWidth = weight || 1;
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
    ctx.restore();
  }

  function wrap(ctx, str, maxW) {
    var words = String(str).split(' ');
    var lines = [], cur = '';
    words.forEach(function (w) {
      var test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function clip(ctx, str, maxW) {
    if (ctx.measureText(str).width <= maxW) return str;
    var s = str;
    while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }

  /* The scalpel mark, drawn to match the SVG in the document head rather than
     approximating it. The E's stem is knocked out with an even-odd clip, which
     is exactly what the SVG mask does; the scalpel then sits in the gap. */
  function monogram(ctx, C, x, y, hh, alpha) {
    var P = window.MARK_PATHS;
    if (!P || !window.Path2D) return 0;
    var sc = hh / 158;                       /* viewBox 20 35 434 158 */
    ctx.save();
    ctx.globalAlpha = alpha == null ? 0.72 : alpha;
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    ctx.translate(-20, -35);
    ctx.fillStyle = C.text;

    /* letterforms are drawn y-up at 1/5 scale, same as the SVG */
    function glyph(dx, d) {
      ctx.save();
      ctx.translate(dx, 190); ctx.scale(0.2, -0.2);
      ctx.fill(new Path2D(d));
      ctx.restore();
    }
    ctx.save();
    var mask = new Path2D();
    mask.rect(-20, -20, 700, 260);
    mask.rect(-10, 18, 72, 196);             /* the stem, cut out */
    ctx.clip(mask, 'evenodd');
    glyph(0, P.e);
    ctx.restore();
    ctx.save();
    ctx.translate(20, 38);
    ctx.fill(new Path2D(P.scalpel), 'evenodd');
    ctx.restore();
    glyph(155, P.d);
    glyph(311, P.b);

    ctx.restore();
    return 434 * sc;
  }

  /* The one line changed from Hand recall's original: a picture shared out
     of the hub says which app drew it, and this is that app. */
  function signature(ctx, C, cv, P) {
    monogram(ctx, C, P, cv.height - 46, 24, 0.72);
    right(ctx, C, cv.width - P, cv.height - 28, 'Poker hub', '20px ' + UI, C.muted);
  }

  function resultBox(ctx, C, r, x, y, w) {
    ctx.save();
    rr(ctx, x, y, w, 96, 6);
    ctx.fillStyle = C.surface; ctx.fill();
    ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    var lead = r.chop ? 'Chop ' + HR.fmtNum(r.snap.pot)
      : r.winner ? r.winner.name + ' wins ' + HR.fmtNum(r.winner.amount)
        : 'Result';
    label(ctx, C, x + 26, y + 58, lead, C.muted, 26);
    if (r.heroNetLine) {
      var net = (r.heroName || 'Hero') + ' ' +
        (r.heroNet > 0 ? '+' : r.heroNet < 0 ? '−' : '') + HR.fmtNum(Math.abs(r.heroNet));
      right(ctx, C, x + w - 26, y + 62, net, '500 38px ' + MONO,
        r.heroNet > 0 ? C.up : r.heroNet < 0 ? C.down : C.text);
    }
    return 96;
  }

  /* --------------------------------------------------------- layout: card
     Board across the top, then the action with no card thumbnails, then the
     hands that were shown, then the result. */

  function header(ctx, C, r, P) {
    ctx.save();
    ctx.font = '600 52px ' + SERIF; ctx.fillStyle = C.text;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(r.head.split(' · ')[0], P, 96);          /* the date, large */
    ctx.restore();
    var rest = r.head.split(' · ').slice(1);
    label(ctx, C, P, 132, rest.slice().reverse().join('  ·  '), C.muted, 26);
    /* straddle and effective stack get their own line, and only when set */
    if (r.head2) label(ctx, C, P, 166, r.head2.split(' · ').join('  ·  '), C.muted, 24);
  }

  function boardRow(ctx, C, r, P, y) {
    var list = r.boardFull;
    if (!list.length) return 0;
    var bw = 96, bh = 132, gap = 12, groupGap = 26;
    /* flop | turn | river, so the runout reads in streets */
    var groups = [list.slice(0, 3), list.slice(3, 4), list.slice(4, 5)]
      .filter(function (g) { return g.length; });
    var total = groups.reduce(function (t, g) {
      return t + g.length * (bw + gap) - gap + groupGap;
    }, -groupGap);
    var x = (W - total) / 2;
    groups.forEach(function (g) {
      cards(ctx, C, x, y, bw, bh, g, gap);
      x += g.length * (bw + gap) - gap + groupGap;
    });
    return bh;
  }

  function handsBlock(ctx, C, r, P, y) {
    if (!r.hands.length) return 0;
    var rowH = 78, cw = 52, ch = 72, gap = 8;
    r.hands.forEach(function (hand, i) {
      var top = y + i * rowH;
      label(ctx, C, P, top + 46, hand.name, C.text, 28);
      var list = hand.cards || [HR.UNKNOWN, HR.UNKNOWN];
      var tw = list.length * (cw + gap) - gap;
      cards(ctx, C, W - P - tw, top + 4, cw, ch, list, gap);
      if (i < r.hands.length - 1) hairline(ctx, C, P, W - P, top + rowH - 3, 1);
    });
    return r.hands.length * rowH;
  }

  function renderCard(hd) {
    var C = tokens();
    var r = HR.toRows(hd);
    var P = 64;
    var innerW = W - P * 2;
    var textX = P + 96;
    var textW = innerW - 96 - 130;          // leaves room for the pot column

    /* measure first so the canvas ends exactly where the content does */
    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '27px ' + UI;
    var lineSets = r.rows.map(function (row) {
      return row.text ? wrap(probe, row.text, textW) : [];
    });
    var rowH = lineSets.map(function (ls) { return Math.max(50, 22 + ls.length * 34); });

    var headTop = 176 + (r.head2 ? 40 : 0);             // second line when set
    var height = headTop;                               // title block
    if (r.boardFull.length) height += 24 + 132 + 26;    // board row
    height += 8;
    rowH.forEach(function (x) { height += x; });
    if (r.hands.length) height += 26 + r.hands.length * 78;
    height += 18 + 96;                                  // result card
    height += 76;                                       // signature band

    var cv = document.createElement('canvas');
    cv.width = W; cv.height = Math.round(height);
    var ctx = cv.getContext('2d');
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, cv.height);

    header(ctx, C, r, P);
    var y = headTop;
    if (r.boardFull.length) {
      y += 24;
      y += boardRow(ctx, C, r, P, y) + 26;
    }
    hairline(ctx, C, P, W - P, y - 8, 2);
    y += 8;

    /* the action — no board thumbnails, the board is up top */
    r.rows.forEach(function (row, i) {
      streetTag(ctx, C, P, y + 30, row.tag);
      right(ctx, C, W - P, y + 30, HR.fmtNum(row.pot), '22px ' + MONO, C.muted);
      lineSets[i].forEach(function (ln, k) {
        label(ctx, C, textX, y + 30 + k * 34, ln, C.text, 27);
      });
      y += rowH[i];
      if (i < r.rows.length - 1) hairline(ctx, C, P, W - P, y - 12, 1);
    });

    if (r.hands.length) {
      hairline(ctx, C, P, W - P, y + 12, 2);
      y += 26;
      y += handsBlock(ctx, C, r, P, y);
    }

    y += 18;
    y += resultBox(ctx, C, r, P, y, innerW);
    signature(ctx, C, cv, P);
    return cv;
  }

  /* -------------------------------------------------------- layout: table */

  function renderTable(hd) {
    var C = tokens();
    var r = HR.toRows(hd);
    var snap = r.snap;
    var P = 64;
    var headerH = 176 + (r.head2 ? 40 : 0);
    var tableH = 1000;
    var textX = P + 96;
    var textW = W - P * 2 - 96 - 130;

    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '24px ' + UI;
    var lineSets = r.rows.map(function (row) {
      return row.text ? wrap(probe, row.text, textW) : [];
    });
    var rowH = lineSets.map(function (ls) { return Math.max(48, 24 + ls.length * 32); });

    var cv = document.createElement('canvas');
    cv.width = W;
    cv.height = headerH + tableH + 26 + rowH.reduce(function (a, b) { return a + b; }, 0) +
      24 + 96 + 76;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, cv.height);

    header(ctx, C, r, P);

    /* felt */
    var cx = W / 2, cy = headerH + tableH / 2;
    /* vertical oval, matching the app; rx is capped by the plaque either side */
    var rx = 250, ry = 400;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.high; ctx.fill();
    ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    /* board across the middle, flop | turn | river, pot below it */
    var groups = [hd.boards[1] || [], hd.boards[2] || [], hd.boards[3] || []]
      .filter(function (g) { return g.length; });
    var bw = 62, bh = 86, gap = 8, groupGap = 20;
    if (groups.length) {
      var total = groups.reduce(function (t, g) {
        return t + g.length * (bw + gap) - gap + groupGap;
      }, -groupGap);
      var x = cx - total / 2;
      groups.forEach(function (g) {
        cards(ctx, C, x, cy - bh - 10, bw, bh, g, gap);
        x += g.length * (bw + gap) - gap + groupGap;
      });
    }
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '22px ' + UI; ctx.fillStyle = C.muted;
    ctx.fillText('POT', cx, cy + (groups.length ? 34 : -6));
    ctx.font = '500 44px ' + MONO; ctx.fillStyle = C.text;
    ctx.fillText(HR.fmtNum(snap.pot), cx, cy + (groups.length ? 84 : 44));
    ctx.restore();

    /* the dealer's station, bottom middle — same layout as the app's table and
       the seating plan: one convention on every surface */
    (function () {
      var dw = 150, dh = 44;
      var dx = cx - dw / 2, dy = cy + ry - dh / 2;
      ctx.save();
      rr(ctx, dx, dy, dw, dh, 6);
      ctx.fillStyle = C.surface; ctx.fill();
      ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = '18px ' + UI; ctx.fillStyle = C.muted;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('DEALER', cx, dy + 29);
      ctx.restore();
    })();

    /* seats — same anchors as the app's table, so the picture matches */
    var anchors = HR.seatAnchors(cx, cy, rx + 172, ry + 64,
      hd.players || snap.order.length);
    var sbw = 190, sbh = 96;
    snap.order.forEach(function (seatIdx) {
      var p = snap.seatMap[seatIdx];
      var pos = anchors[seatIdx] || { x: cx, y: cy - ry - 78 };
      var sx = pos.x, sy = pos.y;
      var folded = !!snap.folded[seatIdx];

      ctx.save();
      ctx.globalAlpha = folded ? 0.42 : 1;
      rr(ctx, sx - sbw / 2, sy - sbh / 2, sbw, sbh, 6);
      ctx.fillStyle = p.hero ? C.accentDim : C.high; ctx.fill();
      ctx.strokeStyle = p.hero ? C.accent : C.border; ctx.lineWidth = 2; ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '500 26px ' + UI; ctx.fillStyle = C.text;
      /* the same rule as everywhere else: a seat with no name wears its
         position — never a dash, and never the position printed twice */

      ctx.fillText(clip(ctx, plaque, sbw - 48), sx, sy - 10);
      ctx.font = '20px ' + MONO; ctx.fillStyle = C.muted;
      var behind = p.stack == null ? null : p.stack - (snap.contrib[seatIdx] || 0);
      var sub = plaque === snap.positions[seatIdx] ? '' : snap.positions[seatIdx];
      if (snap.allin[seatIdx]) sub += (sub ? '  ' : '') + 'all-in';
      else if (behind != null) sub += (sub ? '  ' : '') + HR.fmtNum(behind);
      if (sub) ctx.fillText(sub, sx, sy + 22);

        ctx.save();
        ctx.globalAlpha = folded ? 0.42 : 1;

      if (seatIdx === hd.buttonSeat) {
        ctx.save();
        ctx.beginPath();

        ctx.fillStyle = C.text; ctx.fill();
        ctx.font = '500 19px ' + MONO; ctx.fillStyle = C.bg;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      right(ctx, C, W - P, y + 24, HR.fmtNum(row.pot), '22px ' + MONO, C.muted);
      lineSets[i].forEach(function (ln, k) {

      });
      y += rowH[i];
      hairline(ctx, C, P, W - P, y - 14, 1);
    });

    y += 24;
    resultBox(ctx, C, r, P, y, W - P * 2);
    signature(ctx, C, cv, P);
    return cv;
  }

  /* ---------------------------------------------------- the seating plan
     Who is sitting where, as a picture worth sending to a group chat before
     the cards come out. Drawn from the same anchors as the app's table and the
     hand pictures, so the three never disagree about the shape of the room.

     One frame function serves both outputs: the still is a single call, and the
     animation is the same call with the names moved around. */

  function planFrame(ctx, C, plan, seating, opts) {
    var w = opts.w, hgt = opts.h;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, w, hgt);
    var P = Math.round(40 * (w / 900));

    ctx.save();
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    var hs = w / 900;
    ctx.font = '600 ' + Math.round(40 * hs) + 'px ' + SERIF; ctx.fillStyle = C.text;
    ctx.fillText(plan.venue || 'Seating', P, P + 38 * hs);
    ctx.font = Math.round(20 * hs) + 'px ' + UI; ctx.fillStyle = C.muted;
    ctx.fillText(plan.date + '  ·  ' + plan.stakes, P, P + 70 * hs);
    ctx.restore();

    /* The felt is sized from the plaques, not the other way round: a plaque is
       a fixed fraction of the width, and the ring has to be wide enough that
       two neighbours at the bottom — the closest pair on a tall oval — clear
       each other. */
    var G = planGeometry(w, hgt);
    var cx = G.cx, cy = G.cy, sbw = G.sbw, sbh = G.sbh, rx = G.rx, ry = G.ry;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.high; ctx.fill();
    ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    /* The dealer sits at 6 o'clock, and everything else follows from that:
       seat 1 on their left is the bottom-left chair, and the cards are pitched
       from the near edge of the table rather than the far one. */

      var dw = Math.round(sbw * 0.78), dh = Math.round(sbh * 0.62);
      var dx = cx - dw / 2, dy = cy + ry - dh / 2;
      ctx.save();
      rr(ctx, dx, dy, dw, dh, 6);
      ctx.fillStyle = C.surface; ctx.fill();
      ctx.strokeStyle = C.border; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = Math.round(dh * 0.40) + 'px ' + UI; ctx.fillStyle = C.muted;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('DEALER', cx, dy + dh / 2 + 1);
      ctx.restore();
    })();

    ctx.save();

    ctx.font = Math.round(18 * (w / 900)) + 'px ' + UI; ctx.fillStyle = C.muted;

      ctx.strokeStyle = lit ? C.accent : C.border; ctx.lineWidth = 2; ctx.stroke();

      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '600 ' + Math.round(sbh * 0.31) + 'px ' + UI; ctx.fillStyle = C.text;

      if (who.sub !== false) {
        ctx.font = Math.round(sbh * 0.23) + 'px ' + MONO; ctx.fillStyle = C.muted;

          (who.pos ? '  ' + who.pos : '')), a.x, a.y + Math.round(sbh * 0.31));

      ctx.restore();

      if (who.seat === plan.buttonSeat && !who.dim && who.button !== false) {

        ctx.beginPath();

        ctx.fillStyle = C.bg; ctx.font = '600 ' + Math.round(dr * 1.15) + 'px ' + UI;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

       asked for this one to carry neither the mark nor the app name — it is a
       seating plan going into a group chat, not a piece of his work. Deliberate
       override, and the only surface with one. */
  }

     frame renderer and by the animation, so a card in flight and the chair it
     lands on cannot disagree.

     THE DEALER IS AT THE BOTTOM — the engine's anchors leave their gap there,
     so this is now the same ring the app's table and the hand pictures use.
     Seat 1, the chair on the dealer's left, falls at the bottom left where the
     eye starts, and the numbers run clockwise from it. */

    var sbw = Math.round(w * 0.215), sbh = Math.round(w * 0.078);

    var ringY = (hgt - top - foot) / 2 - sbh / 2 - 6;

      P: P, cx: cx, cy: cy, sbw: sbw, sbh: sbh, ringX: ringX, ringY: ringY,
      rx: ringX - sbw * 0.62, ry: ringY - sbh * 0.75,
      /* seat index -> {x, y}. Only the TAKEN chairs get a place: a six-handed
         plan drawn on a ten-seat ring leaves gaps, and the ring is sized from
         the plaque, so the seats that exist are spread evenly round it. */
      anchors: function (plan) {
        var taken = plan.seats.map(function (x) { return x.seat; })
          .sort(function (a, b) { return a - b; });
        var ring = HR.seatAnchors(cx, cy, ringX, ringY, taken.length);
        var out = {};
        taken.forEach(function (seatIdx, i) { out[seatIdx] = ring[i]; });
        return out;
      }
    };
  }

  /* seat -> {name, pos, hero} for the seating as it actually stands */
  function planSeating(plan) {
    var out = {};
    plan.seats.forEach(function (x) {
      out[x.seat] = { name: x.name, pos: x.pos, hero: x.hero };
    });
    return out;
  }

  /* opts.plain drops the hero highlight — the still marks his chair, the
     animation does not, because during the draw nobody is anybody yet. One
     entry point for both so the rule is testable rather than asserted. */
  window.renderSeatingPlan = function (plan, opts) {
    var C = tokens();
    var cv = document.createElement('canvas');
    cv.width = 900; cv.height = 800;
    planFrame(cv.getContext('2d'), C, plan, planSeating(plan), {
      w: cv.width, h: cv.height, plain: !!(opts && opts.plain)
    });
    return cv;
  };

  /* The draw, as an animation: names land one at a time, in the order the
     shuffle produced, each preceded by a few frames of the name flickering
     between the seats still free. It ends on the real seating — the picture and
     the GIF cannot disagree, because the last frame is the still. */
  /* THE DRAW, ANIMATED — names pitched from the dealer's station, one per beat,
     the way cards go round. Chosen from ten choreographies rendered side by
     side; the other nine are in the history of this file, not in it.

     Deliberately plainer than the still: no hero highlight, because during the
     draw nobody is anybody yet — the accent would say "this one matters" while
     the point is that none of them do until the chips land. The last frame is
     the still, so the two outputs cannot disagree about the result. */
  window.renderSeatingGif = function (plan) {
    var C = tokens();
    var W2 = 560, H2 = 510;
    var cv = document.createElement('canvas');
    cv.width = W2; cv.height = H2;
    var ctx = cv.getContext('2d');

    var order = plan.seats.slice();          /* the order they were drawn in */
    var finals = planSeating(plan);
    var geo = planGeometry(W2, H2);
    var anchors = geo.anchors(plan);
    var frames = [], delays = [];

    function shoot(seating, opts, delay) {
      planFrame(ctx, C, plan, seating, Object.assign({ w: W2, h: H2, plain: true }, opts));
      frames.push(ctx.getImageData(0, 0, W2, H2));
      delays.push(delay);
    }
    /* the finished plan, drawn WITHOUT `plain` so the opener and the freeze
       frame are exactly the shared still: names, seat numbers, positions, and
       his own chair marked */
    function still(delay) {
      planFrame(ctx, C, plan, planSeating(plan), {
        w: W2, h: H2, centre: plan.seats.length + ' seated'

      frames.push(ctx.getImageData(0, 0, W2, H2));
      delays.push(delay);
    }
    function seated(list) {
      var o = {};
      list.forEach(function (x) { o[x.seat] = finals[x.seat]; });
      return o;
    }
    /* ease-out: a pitched card leaves fast and arrives slow */
    function ease(t) { return 1 - Math.pow(1 - t, 3); }

    /* just inside the felt above the dealer's station — a card leaves the
       dealer's hands, it does not launch from on top of the sign */
    var from = { x: geo.cx, y: geo.cy + geo.ry - geo.sbh * 1.15 };
    var placed = [];

    /* OPENS ON THE ANSWER. The first frame is the finished seating plan, held
       long enough to read, and it is the frame every thumbnail and every
       not-yet-playing preview shows. It is also where a client that insists on
       looping — WhatsApp re-encodes GIFs as looping video — comes back to,
       instead of an empty table. The deal then runs from scratch and ends on
       the same picture. */
    still(120);
    shoot({}, { centre: 'Dealing for seats' }, 70);
    order.forEach(function (x, n) {
      var to = anchors[x.seat];
      for (var k = 0; k <= 5; k++) {
        var t = ease(k / 5);
        shoot(seated(placed), {
          centre: 'Dealing for seats',
          floats: [{
            x: from.x + (to.x - from.x) * t,
            y: from.y + (to.y - from.y) * t,
            name: x.name, sub: false, alpha: 0.55 + 0.45 * t
          }]
        }, 6);
      }
      placed.push(x);
      shoot(seated(placed), {
        centre: (n + 1) + ' of ' + order.length + ' seated'
      }, 20);
    });
    /* ...and closes on it. The animation STOPS here, so this is what stays on
       screen. Same frame as the opener, so however a client treats the file —
       freeze, loop, or show a poster frame — the seating is what you see. */
    still(500);

    /* the palette is built from the ramps the design actually uses, so text
       edges land on real in-between tones rather than being posterised */
    var G = window.GIF;
    var pal = [G.hexRGB(C.bg)]
      .concat(G.ramp(G.hexRGB(C.bg), G.hexRGB(C.text), 26))
      .concat(G.ramp(G.hexRGB(C.surface), G.hexRGB(C.text), 14))
      .concat(G.ramp(G.hexRGB(C.high), G.hexRGB(C.muted), 10))
      .concat(G.ramp(G.hexRGB(C.bg), G.hexRGB(C.accent), 8))
      .concat(G.ramp(G.hexRGB(C.surface), G.hexRGB(C.border), 6));
    return G.encode(frames, {
      width: W2, height: H2, delay: delays, palette: pal, loop: false
    });
  };

  window.renderHandImage = function (hd, style) {
    try {
      return style === 'table' ? renderTable(hd) : renderCard(hd);
    } catch (e) {
      var cv = document.createElement('canvas');
      cv.width = 720; cv.height = 200;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#050a0e'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#eaf4ff'; ctx.font = '22px sans-serif';
      ctx.fillText('Could not draw this hand.', 40, 100);
      return cv;
    }
  };
})();

<script>/* ============================================================
   Poker hub — the hand recorder. Stage 3.

   The point of recording a hand *here* rather than in Hand recall is that
   the table is already known. The seats, the names and — since v0.4.1 —
   the player ids are sitting in the live session, so a hand logged during
   a night lands on the same records the money does. There is no roster to
   reconcile because there is only one roster.

   Almost nothing in this file is hand logic. `engine.js` is Hand recall's
   own model, vendored: it replays the action list, works out positions,
   blinds, straddles, side pots and the uncalled-bet return, and says who
   acts next. `eval.js` names the winner. What is left — and all this file
   is — is the state around them:

     · build a hand from a live table rather than from a blank form
     · apply one edit at a time and let the replay derive the rest
     · undo, which is just dropping the last action
     · refuse to save something that cannot have happened

   **The money a hand reports is estimated, never counted.** Ernest,
   19/08/2026: *"the stack sizes usually are not 100% accurate. The amount
   won per hand is only a best guess estimate … for ledgers sake the
   homegametracker should be the truth."* So a hand's `heroNet` feeds
   analysis and nothing else; `layers.js` enforces it and the browser
   suite checks every such figure on screen carries its tilde.

   ── v0.7, the cast ──────────────────────────────────────────

   **The table is the table; the cast is who was in the hand.** This is
   Hand recall v1.9.1's methodology and Ernest asked for it by name:
   *"the methodology of the hand recall part should be the same as the
   app."* Naming the cast does **not** shrink the table. Everyone stays
   seated, so the position labels stay right, and an outsider's blind
   stays in the pot as dead money — which is exactly what a pot that
   somebody wins is made of. Outsiders fold the instant the action
   reaches them (`autoFold`), as real recorded actions; `engine.toRows`
   already drops a fold from anyone who never voluntarily acted, so the
   shared text reads as though they were never there.

   The old behaviour — dropping a seat out of `h.seats` — was wrong in a
   way that never announced itself: a 9-handed table where three people
   played became a **3-handed hand**, so the cut-off became the small
   blind and six dead blinds vanished from the pot.

   ── significance ────────────────────────────────────────────

   Ernest, 08/09/2026: *"not in hand means i was not significant in the
   hand. meaning if i folded a small blind or big blind it still means im
   not in the hand. if i raised and folded im technically in the hand."*

   So: **significant = he put chips in voluntarily, or he was still live
   when a board card was dealt.** A posted blind is not a decision, so
   posting and folding is nothing; a raise is a decision even if he folds
   to the 3-bet; and checking the big blind to see a flop puts him in the
   hand from the flop on. A walk to the big blind is not a hand. That
   middle case — big blind checks, sees a flop, folds — is the one his
   sentence does not settle, and seeing a flop is where I have put the
   line.

   It is a **label, not an accounting fudge**: a blind he lost is still
   money he lost, so `heroNet` never lies. `heroInHand: false` is what
   lets a rate count hands he played rather than hands he sat through.

   No DOM access.
   ============================================================ */
