  /* ── files ─────────────────────────────────────────────── */

  function readFile(file, cb) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      var parsed = null;
      try { parsed = JSON.parse(String(fr.result)); }
      catch (e) { toast('That file is not readable JSON.', 'err'); return; }
      cb(parsed);
    };
    fr.onerror = function () { toast('Could not read that file.', 'err'); };
    fr.readAsText(file);
  }
  function download(text, name) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  /**
   * A file out of the app. On a phone the share sheet is how a file gets
   * anywhere — AirDrop, Files, a chat — so it is offered first; a desktop
   * browser downloads it. `cb(how)` says which happened.
   */
  function shareFile(text, name, title, cb) {
    var done = function (how) { if (cb) cb(how); };
    try {
      if (typeof File !== 'undefined' && navigator.share && navigator.canShare) {
        var f = new File([text], name, { type: 'application/json' });
        if (navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f], title: title || name }).then(function () { done('shared'); })['catch'](function (err) {
            if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) { done('cancelled'); return; }
            download(text, name); done('downloaded');
          });
          return;
        }
      }
    } catch (e) { /* fall through to a download */ }
    download(text, name); done('downloaded');
  }
  /**
   * Copy, with the tracker's fallback kept.
   *
   * `navigator.clipboard` needs a secure context and a focused document,
   * and several webviews refuse it outright — an installed iOS web app
   * and a page opened from `file://` are both places it can simply not
   * fire. `execCommand('copy')` off a real selected textarea still works
   * in all of them, so the hidden payload in the modal is the fallback
   * rather than an error message telling him to select the text himself.
   */
  function copyText(t, srcId) {
    var done = function () { toast(srcId === 'ledgerRaw' ? 'Ledger copied.' : 'Copied.', 'ok'); };
    var manual = function () {
      var ta = srcId ? $(srcId) : null;
      var made = false;
      if (!ta) {
        ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', 'readonly');
        ta.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px';
        document.body.appendChild(ta);
        made = true;
      }
      var ok = false;
      try {
        ta.removeAttribute('aria-hidden');
        ta.focus();
        ta.select();
        if (ta.setSelectionRange) ta.setSelectionRange(0, String(ta.value).length);
        ok = document.execCommand('copy');
        ta.setAttribute('aria-hidden', 'true');
      } catch (e) { ok = false; }
      if (made) document.body.removeChild(ta);
      if (ok) done(); else toast('Could not copy — select the block and copy by hand.', 'err');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, manual);
    } else manual();
  }

  /**
   * The Share button, as the tracker had it: the whole group ledger —
   * everyone's buy-in, cash-out and net, the Pot and Tip lines, and the
   * who-pays-who once it balances (or how far out it is). A mid-game share
   * is just the state of the table. The preview is the bare table; what
   * leaves is fenced, so the columns survive in WhatsApp.
   */
  function openShareLedger() {
    var L = live();
    if (!L) return;
    var preview = Live.shareText(L, { fence: false, currency: cur() });
    var payload = Live.shareText(L, { currency: cur() });
    var acts = [{ label: 'Copy', act: 'ledger-copy', primary: true }];
    if (typeof navigator !== 'undefined' && navigator.share) acts.push({ label: 'Share…', act: 'ledger-share' });
    acts.push({ label: 'Close', act: 'close' });
    openModal('Group ledger',
      '<div class="ledgerblock" id="ledgerBox">' + esc(preview) + '</div>' +
      '<p class="hint">Sent as a code block so the columns line up in chat.</p>' +
      '<textarea id="ledgerRaw" readonly aria-hidden="true" tabindex="-1" ' +
      'style="position:absolute;left:-9999px;top:0;width:1px;height:1px">' + esc(payload) + '</textarea>', acts);
  }

  /** The share sheet — WhatsApp, Messages, anything the phone offers. */
  function shareOut(text, title) {
    if (!navigator.share) return copyText(text, 'share-raw');
    navigator.share({ title: title || 'Home game', text: text })['catch'](function (err) {
      /* A cancelled sheet is not a failure and must not shout. */
      if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
      copyText(text, 'share-raw');
    });
  }

  /* ══════════════════════════════════════════════════════════
     SHARING THE SEATING

     Two outputs from one plan: a still of the table, and the draw as an
     animation that freezes on the final seating. That last frame *is* the
     still, so the two cannot disagree about the result.

     Both are Hand recall's own renderers, vendored. The still marks his
     chair; the animation does not, because during a draw nobody is
     anybody yet.
     ══════════════════════════════════════════════════════════ */

  function planFor(L) {
    return Live.seatingPlan(L, { order: window._drawOrder || null, now: now() });
  }

  function showSeating() {
    var L = live();
    if (!L || L.players.length < 2) { toast('Seat at least two people first.', 'err'); return; }
    var plan = planFor(L);
    var cv;
    try { cv = window.renderSeatingPlan(plan, {}); }
    catch (e) { toast('Could not draw the table.', 'err'); return; }
    window._planPNG = cv.toDataURL('image/png');

    var body = '<img class="planimg" alt="The seating" src="' + window._planPNG + '">' +
      '<p class="hint">Seat 1 is on the dealer’s left and the numbers run clockwise — the card ' +
      'room’s convention, so this reads against the actual chairs.</p>' +
      '<div class="line" style="margin-top:12px">' +
      '<button class="btn btn-ghost" data-act="seating-share-png">' + icon('table', 15) +
      ' The picture</button>' +
      '<button class="btn btn-ghost" data-act="seating-share-gif">' + icon('film-strip', 15) +
      ' The draw, animated</button></div>';
    openModal('The seating', body, []);
  }

  /**
   * Out to whatever the phone offers. A canvas becomes a file, and the
   * share sheet takes files where it can; a browser without one downloads
   * instead, which is the same outcome one step later.
   */
  function sharePlan(kind) {
    var L = live();
    var plan = planFor(L);
    var name = 'seating-' + (Settle.isoDate(L.startedAt || now())) + '.' +
      (kind === 'gif' ? 'gif' : 'png');
    var blobP;
    if (kind === 'gif') {
      toast('Drawing the animation…', 'ok');
      try {
        var bytes = window.renderSeatingGif(plan);
        blobP = Promise.resolve(new Blob([bytes], { type: 'image/gif' }));
      } catch (e) { toast('Could not draw the animation.', 'err'); return; }
    } else {
      blobP = new Promise(function (res) {
        window.renderSeatingPlan(plan, {}).toBlob(function (b) { res(b); }, 'image/png');
      });
    }
    blobP.then(function (blob) {
      var file = null;
      try { file = new File([blob], name, { type: blob.type }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        navigator.share({ files: [file], title: L.venue || 'The seating' })['catch'](function (err) {
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
          downloadBlob(blob, name);
        });
        return;
      }
      downloadBlob(blob, name);
    });
  }

  /* ══════════════════════════════════════════════════════════
     SHARING A HAND

     Hand recall's other two renderers, vendored since v0.6 and reaching
     no screen until now: the **card**, which reads like a hand history
     with the board up top, and the **table**, which draws the felt.

     Both take the raw hand the engine replays, not the record the store
     keeps — so `Rec.toHand` puts a stored hand back into that shape. That
     is what makes an **imported** hand drawable too, which matters more
     than the recorded ones: everything from Hand recall arrives as a
     record.
     ══════════════════════════════════════════════════════════ */

  function handStyle() {
    return store.db.settings.handImageStyle === 'table' ? 'table' : 'card';
  }

  function handPicture(hd, style) {
    var raw = Rec.toPicture(hd);
    /* `renderHandImage` swallows its own errors and hands back a canvas
       reading "Could not draw this hand", which is right on a phone and
       useless to the caller. The engine is forgiving enough to draw a
       hand with nobody in it — an empty felt and no action, which is a
       picture of nothing — so the emptiness is refused here rather than
       shared. `toRows` is what the renderer calls first, so anything it
       cannot survive is caught one step earlier. */
    if (!raw || (raw.seats || []).length < 2) throw new Error('too few seats to draw');
    HR.toRows(raw);
    return window.renderHandImage(raw, style);
  }

  /**
   * The hand as text — what he reads on the page and what he copies.
   *
   * **Drawn from the same place the picture is**, rather than from the
   * `text` the record was saved with. Since v0.8 `finish` writes that text
   * the way the picture draws it, so for a new hand the two are identical
   * either way. A hand recorded *before* v0.8 has "HKD5/10" and an ISO
   * date frozen into its text, and there is no migration that could reach
   * a file already on his phone — so the text is derived, and the archived
   * copy is the fallback rather than the source.
   */
  function handText(hd) {
    if (!hd) return '';
    try {
      var t = HR.toText(Rec.toPicture(hd), { fence: false, note: true });
      if (t && t.trim()) return t;
    } catch (e) { /* a record too sparse to replay — use what it came with */ }
    return hd.text || '';
  }

  function showHandImage(id) {
    var hd = store.handById(id);
    /* The sheet outlives nothing, but say so rather than doing nothing —
       a button that silently does not work is worse than one that says
       why. */
    if (!hd) { closeModal(); toast('That hand is gone.', 'err'); return false; }
    var style = handStyle();
    var cv;
    try { cv = handPicture(hd, style); }
    catch (e) { toast('Could not draw this hand.', 'err'); return false; }
    window._handPNG = cv.toDataURL('image/png');
    window._handShareId = id;

    var body = '<img class="planimg" alt="' + esc(handTitle(hd)) + '" src="' +
      window._handPNG + '">' +
      '<div class="segmented" role="group" aria-label="Picture style" style="margin-top:12px">' +
      [['card', 'The hand'], ['table', 'The felt']].map(function (x) {
        return '<button data-act="hand-style" data-style="' + x[0] + '" aria-pressed="' +
          (style === x[0] ? 'true' : 'false') + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      '<p class="hint">' + (style === 'table'
        ? 'The felt, with everyone in their chair — the same geometry as the seating plan.'
        : 'The board first, then the action street by street. Reads like a hand history.') +
      '</p>' +
      '<div class="line" style="margin-top:12px">' +
      '<button class="btn btn-primary" data-act="hand-share-png">' + icon('share-network', 15) +
      ' Send the picture</button>' +
      '<button class="btn btn-ghost" data-act="hand-copy-text">' + icon('copy-simple', 15) +
      ' Copy the text</button></div>' +
      '<textarea id="share-raw" readonly aria-hidden="true" tabindex="-1" ' +
      'style="position:absolute;left:-9999px;top:0;width:1px;height:1px">' +
      esc(handText(hd)) + '</textarea>';
    openModal(handTitle(hd), body, []);
    return true;
  }

  function shareHandPNG() {
    var hd = store.handById(window._handShareId);
    if (!hd) { closeModal(); toast('That hand is gone.', 'err'); return; }
    var name = 'hand-' + (hd.date || 'x') + '-' + (hd.no || 0) + '.png';
    var cv;
    try { cv = handPicture(hd, handStyle()); }
    catch (e) { toast('Could not draw this hand.', 'err'); return; }
    cv.toBlob(function (blob) {
      var file = null;
      try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        navigator.share({ files: [file], title: handTitle(hd) })['catch'](function (err) {
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
          downloadBlob(blob, name);
        });
        return;
      }
      downloadBlob(blob, name);
    }, 'image/png');
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('Saved ' + name + '.', 'ok');
  }

  /* ── settle ────────────────────────────────────────────── */

  function showSettlePreview() {
    var L = live();
    var r = Live.settle(L);
    var body = settleBody(L);
    if (pending && !pending.ok && pending.questions.length) body += previewBody(pending);
    /* No "back to the table" — the ✕ is already that, and a modal whose
       only action is to close itself is a button that says nothing. */
    var btns = [];
    if (r.ok) {
      if (typeof navigator !== 'undefined' && navigator.share) {
        btns.push({ label: 'Share', act: 'share-settle' });
      }
      btns.push({ label: 'Copy', act: 'copy-share' });
      if (pending && pending.ok) btns.push({ label: 'File it', act: 'do-settle', primary: true });
    }
    openModal('Settle up', body, btns);
  }

  function openSettle() {
    var L = live();
    if (!L) return;
    pending = null;
    if (Live.settle(L).ok) {
      pending = Live.plan(store, L, { now: now() });
      pending.fromLive = true;
      pending._opts = {};
    }
    showSettlePreview();
  }

  function doSettle() {
    var L = live();
    var liveId = L ? L.id : null;
    Imp.commit(store, pending).then(function (rep) {
      /* Hands recorded tonight have been waiting for the night to have an
         id. A hand belongs to the night it was played in — that is what
         makes it deletable with it and countable against it. */
      var mine = store.hands.filter(function (h) { return h.liveId === liveId; });
      mine.forEach(function (h) { h.sessionId = rep.sessionId; h.liveId = null; });
      return (mine.length ? store.putHands(mine) : Promise.resolve())
        .then(function () { return { rep: rep, hands: mine.length }; });
    }).then(function (out) {
      store.db.live = null;
      store.saveLive();
      liveUndo = [];
      pending = null;
      closeModal();
      HISTORY = [];
      VIEW = { name: 'session', id: out.rep.sessionId, filter: null, sub: 'table' };
      render();
      var filedLine = 'Filed — ' + hoursText(out.rep.hours) + ', ' +
        plural(out.rep.ledgerRows + (out.rep.updatedLedgerRows || 0), 'ledger row') +
        (out.hands ? ', ' + plural(out.hands, 'hand') : '') + '.';
      /* The backup, attached to an action he already takes. The settle is
         the one moment every night when the phone is in his hand and the
         data has just grown; one more tap here is the whole backup habit. */
      openModal('Night filed', '<p>' + esc(filedLine) + '</p>' +
        '<p class="hint" style="margin-top:8px">Everything is on this phone only. Back it up now and tonight leaves with you — ' +
        'the share sheet takes it to Files, AirDrop or your computer.</p>',
        [{ label: 'Later', act: 'close' }, { label: 'Back up now', act: 'backup', primary: true }]);
    }).catch(function (err) { toast(err.message, 'err'); });
  }

  /* ── events ────────────────────────────────────────────── */

  var ROOTS = { live: 1, nights: 1, players: 1, home: 1 };

  function go(to, id, opts) {
    if (locked() && to !== 'live') { toast('Table mode is on — unlock to leave the table.', 'err'); return; }
    /* Leaving for another screen from inside a sheet leaves the sheet
       behind otherwise — the read peeked at the table is the first sheet
       with a way out to another page. */
    if ($('modal') && !$('modal').hidden) closeModal();
    var moved = VIEW.name !== to || VIEW.id !== (id || null);
    /* A root tap starts a fresh trail; a deep view remembers where it came
       from so Back returns there — a hand is reached from a night, a
       player or the list, and PARENT alone cannot know which. */
    if (ROOTS[to]) HISTORY = [];
    else if (moved && !(opts && opts.back)) {
      HISTORY.push({ name: VIEW.name, id: VIEW.id, filter: VIEW.filter, sub: VIEW.sub });
      if (HISTORY.length > 30) HISTORY.shift();
    }
    VIEW = { name: to, id: id || null, filter: null, sub: to === 'live' ? 'table' : VIEW.sub };
    render();
    /* A new page opens at its top. Nothing ever reset the scroll, so a
       person tapped low in the Players list opened half-way down their
       own page — past the read, which is the one thing on it he came for. */
    if (moved && typeof window.scrollTo === 'function') window.scrollTo(0, 0);
  }

  function goBack() {
    if (VIEW.name === 'live' && VIEW.sub !== 'table' && live()) { VIEW.sub = 'table'; render(); return; }
    if (VIEW.name === 'record') { VIEW = { name: 'live', id: null, filter: null, sub: 'table' }; render(); return; }
    var prev = HISTORY.pop();
    if (prev && !(locked() && prev.name !== 'live')) {
      VIEW = prev; render();
      if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
      return;
    }
    go(PARENT[VIEW.name] || 'home', null, { back: true });
  }

  /**
   * Enter accepts the thing in front of you.
   *
   * Every input in this app sits in a form with exactly one obvious
   * action, so Enter runs it: the primary button of an open modal, the
   * Add beside a rebuy field, the Set beside the tip. In a destructive
   * confirm the primary button is Cancel, which is the right thing for a
   * key pressed by reflex to do.
   */
  function onKey(e) {
    if (e.key === 'Escape') {
      pending = null; closeModal();
      var m2 = $('menu'); if (m2) m2.hidden = true;
      return;
    }
    if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (!t || t.tagName === 'TEXTAREA' || t.isContentEditable) return;
    /* A focused button already answers to Enter. Acting again here would
       fire the chip *and* the primary action behind it. */
    if (t.tagName === 'BUTTON' || t.tagName === 'A' || t.tagName === 'SELECT') return;

    /* Name first, amount second: Enter on a name with no buy-in yet moves
       along rather than submitting a form it knows is incomplete. */
    if (t.id === 'ap-name') {
      var amt = $('ap-amount');
      if (amt && !String(amt.value).trim()) { e.preventDefault(); amt.focus(); return; }
    }
    /* The seat row: the same name-then-amount order, then seat. */
    if (t.id === 'seat-name') {
      e.preventDefault();
      var sa = $('seat-amount');
      if (sa && !String(sa.value).trim()) { sa.focus(); return; }
      seatFromRow();
      return;
    }
    if (t.id === 'seat-amount') { e.preventDefault(); seatFromRow(); return; }
    /* Dealer fields save when left; Enter just leaves. */
    if (t.id === 'tip' || t.id === 'dealer-name') { e.preventDefault(); t.blur(); return; }
    var modal = $('modal');
    if (modal && !modal.hidden) {
      var pb = modal.querySelector('.modal-actions .btn-primary');
      if (pb) { e.preventDefault(); pb.click(); }
      return;
    }
    if (t.tagName !== 'INPUT') return;
    var tu = t.getAttribute('data-topup');
    if (tu) {
      var b = document.querySelector('[data-act="topup"][data-id="' + tu + '"]');
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
  }

  function onClick(e) {
    var ans = e.target.closest('[data-answer]');
    if (ans) { answerQuestion(ans.getAttribute('data-answer'), ans.getAttribute('data-value')); return; }

    var rk = e.target.closest('[data-rank]');
    if (rk && pick) { pick.rank = rk.getAttribute('data-rank'); return refreshCards(); }
    var su = e.target.closest('[data-suit]');
    if (su && pick) {
      var v = su.getAttribute('data-suit');
      if (v === '?') pick.cards.push(Rec.UNKNOWN);
      else if (pick.rank) pick.cards.push(pick.rank + v);
      pick.rank = null;
      return refreshCards();
    }
    var amt = e.target.closest('[data-fill-amt]');
    if (amt) {
      var ai = $('rc-amt');
      if (ai) { ai.value = amt.getAttribute('data-fill-amt'); ai.focus(); }
      return;
    }

    var sf = e.target.closest('[data-seat-fill]');
    if (sf) {
      var sni = $('seat-name');
      if (sni) { sni.value = sf.getAttribute('data-seat-fill'); refreshSeatRow(true); }
      var sai = $('seat-amount');
      if (sai) { sai.focus(); sai.select(); }
      return;
    }

    var fill = e.target.closest('[data-fill-name]');
    if (fill) {
      $('ap-name').value = fill.getAttribute('data-fill-name');
      refreshAddPlayer();
      var amtEl = $('ap-amount');
      if (amtEl) { amtEl.focus(); amtEl.select(); }
      return;
    }

    var el = e.target.closest('[data-act], [data-theme-set]');
    if (!el) { var mm = $('menu'); if (mm && !mm.hidden) mm.hidden = true; return; }

    var t = el.getAttribute('data-theme-set');
    if (t) { setTheme(t); render(); $('menu').hidden = false; return; }

    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');

    /* ── navigation ── */
    if (act === 'go') return go(el.getAttribute('data-to'), id);
    if (act === 'back') return goBack();
    if (act === 'player-hands') {
      VIEW = { name: 'hands', id: null, filter: { playerId: id }, sub: VIEW.sub };
      return render();
    }
    if (act === 'clear-filter') return go('hands');
    if (act === 'sort-players') {
      VIEW = { name: 'players', id: null, filter: { sort: el.getAttribute('data-sort') }, sub: VIEW.sub };
      return render();
    }
    if (act === 'menu') {
      var m = $('menu'); m.hidden = !m.hidden;
      var gb = document.querySelector('[data-act="menu"]'); if (gb) gb.setAttribute('aria-expanded', String(!m.hidden));
      return;
    }
    if (act === 'open-settings') {
      openModal('Settings', settingsForm(), [
        { label: 'Cancel', act: 'close' }, { label: 'Save', act: 'save-settings', primary: true }
      ]);
      return;
    }
    if (act === 'go-data') return go('data');
    if (act === 'close') { pending = null; return closeModal(); }
    if (act === 'live-sub') {
      VIEW.sub = el.getAttribute('data-sub'); render();
      if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
      return;
    }
    if (act === 'player-card') {
      var Lc = live(); if (!Lc) return;
      var pc = Live.byId(Lc, Number(id));
      if (!pc) return;
      tellCat = 'Tell';
      openModal(pc.name, playerCard(Lc, pc), [], 'tell-text');
      return;
    }
    if (act === 'tell-cat') {
      tellCat = el.getAttribute('data-cat');
      document.querySelectorAll('[data-act="tell-cat"]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-cat') === tellCat ? 'true' : 'false');
      });
      return;
    }
    if (act === 'save-tell') {
      var tt = $('tell-text');
      var r0 = liveCommit(function (L) { return Live.addNote(L, tt ? tt.value : '', tellCat, Number(id), now()); });
      if (r0 && !r0.error) {
        closeModal();
        toast(tellCat + ' noted.', 'ok');
      }
      return;
    }
    if (act === 'rec-close') {
      VIEW = { name: 'live', id: null, filter: null, sub: 'table' }; render(); return;
    }


    /* ── a past night ── */
    if (act === 'log-night') {
      lnMe = 'played';
      openModal('Log a past night', logNightForm(), [
        { label: 'Cancel', act: 'close' }, { label: 'Review', act: 'ln-review', primary: true }
      ], 'ln-date');
      return;
    }
    if (act === 'ln-me') { setLnMe(el.getAttribute('data-me')); return; }
    if (act === 'ln-paste') { lnApplyPaste(); return; }
    if (act === 'ln-add') {
      var wrap = $('ln-rows'); if (!wrap) return;
      var n = wrap.querySelectorAll('.rrow').length;
      var tmp = document.createElement('div');
      tmp.innerHTML = logNightForm();
      var fresh = tmp.querySelector('.rrow');
      fresh.setAttribute('data-row', String(n));
      fresh.querySelectorAll('input').forEach(function (inp) { inp.value = ''; });
      wrap.appendChild(fresh);
      fresh.querySelector('[data-ln="name"]').focus();
      return;
    }
    if (act === 'ln-drop') {
      var rr = el.closest('.rrow'); if (rr) rr.remove(); lnBalance(); return;
    }
    if (act === 'ln-review') {
      var built = logNightPayload();
      if (built.error) {
        toast(built.error, 'err');
        if (built.field && $(built.field)) $(built.field).focus();
        return;
      }
      pendingRaw = built.payload;
      pending = Imp.plan(store, built.payload, built.opts);
      pending._opts = built.opts;
      pending.logged = true;
      var tot = Settle.totals(built.payload.state);
      if (tot.net !== 0) {
        pending.warnings.unshift('The money does not balance: buy-ins and cash-outs are ' +
          Settle.plain(Math.abs(tot.net)) + ' apart. The night is filed as you typed it and marked as not reconciling.');
      }
      showImportPreview();
      return;
    }

    /* ── live ── */
    if (act === 'start-live') {
      openModal('Start a night', startLiveForm(), [
        { label: 'Cancel', act: 'close' }, { label: 'Start', act: 'do-start-live', primary: true }
      ]);
      return;
    }
    if (act === 'do-start-live') {
      store.db.live = Live.create({
        now: now(),
        venue: $('lv-venue').value.trim(),
        stakes: $('lv-stakes').value.trim(),
        currency: base(),
        tableSize: Number($('lv-seats').value),
        dealer: !!$('lv-dealer').value
      });
      liveUndo = [];
      store.saveLive();
      closeModal();
      VIEW = { name: 'live', id: null, filter: null, sub: 'table' };
      render();
      toast('Night open. The clock starts with the first buy-in.', 'ok');
      return;
    }
    if (act === 'seat-add') return seatFromRow();
    if (act === 'seat-open') {
      SEAT_OPEN = true;
      var q = $('seat-row');
      if (q) q.outerHTML = seatOpenHTML(live());
      var sn = $('seat-name');
      if (sn) sn.focus();
      return;
    }
    if (act === 'share-ledger') return openShareLedger();
    if (act === 'ledger-copy') {
      var tx = $('ledgerRaw') ? $('ledgerRaw').value : Live.shareText(live(), { currency: cur() });
      copyText(tx, 'ledgerRaw');
      return;
    }
    if (act === 'ledger-share') {
      var tx2 = $('ledgerRaw') ? $('ledgerRaw').value : Live.shareText(live(), { currency: cur() });
      if (navigator.share) navigator.share({ title: 'Home game ledger', text: tx2 })['catch'](function () { });
      return;
    }
    if (act === 'topup') {
      var inp = document.querySelector('[data-topup="' + id + '"]');
      if (!inp || !inp.value.trim()) { toast('How much?', 'err'); return; }
      var amt = inp.value;
      var rr = liveCommit(function (L) { return Live.topUp(L, Number(id), amt, now()); });
      if (rr && !rr.error) toast(rr.player.name + ' topped up.', 'ok');
      return;
    }
    if (act === 'cashout') {
      var cp = Live.byId(live(), Number(id));
      if (!cp) return;
      window._cashId = Number(id);
      openModal('Cash out ' + cp.name,
        '<p class="hint" style="margin-bottom:12px">' + esc(cp.name) + ' bought in for ' +
        esc(money(Settle.totalBuyIn(cp))) + '. What are they leaving with?</p>' +
        '<div class="field"><label for="co-amount">Cash-out</label>' +
        '<input class="input" id="co-amount" inputmode="decimal" value="0"></div>',
        [{ label: 'Cancel', act: 'close' }, { label: 'Cash out', act: 'do-cashout', primary: true }],
        'co-amount');
      var co = $('co-amount'); if (co) co.select();
      return;
    }
    if (act === 'do-cashout') {
      var cv = $('co-amount').value;
      var r2 = liveCommit(function (L) { return Live.cashOut(L, window._cashId, cv, now()); });
      if (r2 && !r2.error) { closeModal(); toast(r2.player.name + ' is out.', 'ok'); }
      return;
    }
    if (act === 'reopen') { liveCommit(function (L) { return Live.reopen(L, Number(id), now()); }); return; }
    if (act === 'edit-buyins') {
      var ep = Live.byId(live(), Number(id));
      if (!ep) return;
      window._editBuyId = Number(id);
      openModal(ep.name + '’s buy-ins',
        '<p class="hint" style="margin-bottom:12px">Correct one that was mistyped. The timeline ' +
        'records the fix rather than hiding it.</p>' +
        ep.buyins.map(function (b, i) {
          return '<div class="field"><label for="bi-' + i + '">Buy-in ' + (i + 1) + '</label>' +
            '<input class="input" id="bi-' + i + '" inputmode="decimal" value="' + esc(b) + '"></div>';
        }).join(''),
        [{ label: 'Cancel', act: 'close' }, { label: 'Save', act: 'do-edit-buyins', primary: true }]);
      return;
    }
    if (act === 'do-edit-buyins') {
      var pid = window._editBuyId;
      var ep2 = Live.byId(live(), pid);
      var vals = ep2.buyins.map(function (b, i) { return $('bi-' + i).value; });
      var bad = false;
      liveCommit(function (L) {
        for (var i = 0; i < vals.length; i++) {
          var res = Live.adjustBuyIn(L, pid, i, vals[i], now());
          if (res.error) { bad = true; return res; }
        }
        return {};
      });
      if (!bad) { closeModal(); toast('Corrected.', 'ok'); }
      return;
    }
    if (act === 'drop-player') {
      var dp2 = Live.byId(live(), Number(id));
      if (!dp2) return;
      confirmDestroy({
        title: 'Take ' + dp2.name + ' off the table?',
        body: 'Their buy-ins come out of the pot. This is for a name entered by mistake — for ' +
          'someone who has left, cash them out instead.',
        list: [esc(money(Settle.totalBuyIn(dp2))) + ' of buy-ins'],
        undoable: false,
        run: function () {
          var res = liveCommit(function (L) { return Live.removePlayer(L, Number(id), now()); });
          return res && !res.error ? dp2.name + ' removed. Undo is on the live bar.' : '';
        }
      });
      return;
    }
    if (act === 'toggle-dealer') { liveCommit(function (L) { L.dealer = true; return {}; }); return; }
    if (act === 'drop-dealer') {
      liveCommit(function (L) { L.dealer = false; L.tip = 0; L.dealerName = ''; return {}; });
      return;
    }
    if (act === 'live-pause') {
      liveCommit(function (L) { return Live.isPaused(L) ? Live.resume(L, now()) : Live.pause(L, now()); });
      return;
    }
    if (act === 'live-undo') return liveUndoStep();

    /* ── the seating ── */
    if (act === 'seat-tap') {
      var Ls = live();
      var seatNo = Number(el.getAttribute('data-seat'));
      var sitter = Live.playerInSeat(Ls, seatNo);
      window._seatTap = seatNo;
      var body = '<p class="hint">Chair ' + (seatNo + 1) +
        (sitter ? ' — ' + esc(sitter.name) : ' — empty') + '.</p>';
      var btns = [{ label: 'Close', act: 'close' }];
      if (Ls.buttonSeat !== seatNo) {
        body += '<button class="btn btn-ghost" data-act="seat-button" style="margin-top:10px">' +
          'Put the button here</button>';
      } else {
        body += '<p class="hint">The button is on this chair. It is a seat, not a person — ' +
          'it stays put when somebody moves, and passes round.</p>';
      }
      if (Ls.players.length > 1) {
        body += '<p class="hint" style="margin-top:14px">' +
          (sitter ? 'Swap ' + esc(sitter.name) + ' with' : 'Move somebody here') + '</p>' +
          '<div class="chips">' + Live.seated(Ls)
            .filter(function (p) { return p.seat !== seatNo; })
            .map(function (p) {
              return '<button class="chipbtn" data-act="seat-move" data-id="' + p.id + '">' +
                esc(p.name) + '</button>';
            }).join('') + '</div>';
      }
      openModal(sitter ? sitter.name + '’s chair' : 'Chair ' + (seatNo + 1), body, btns);
      return;
    }
    if (act === 'seat-button') {
      var sb = window._seatTap;
      closeModal();
      liveCommit(function (L) { return Live.setButton(L, sb); });
      return;
    }
    if (act === 'seat-move') {
      var mv = window._seatTap;
      closeModal();
      var res2 = liveCommit(function (L) { return Live.moveSeat(L, Number(id), mv); });
      if (res2 && !res2.error) {
        toast(res2.swappedWith
          ? res2.player.name + ' and ' + res2.swappedWith.name + ' swapped.'
          : res2.player.name + ' moved.', 'ok');
      }
      return;
    }
    if (act === 'table-size') {
      var Lt = live();
      openModal('How many chairs?',
        '<p class="hint">The felt is drawn with this many, and the positions follow from who is ' +
        'actually sitting — an empty chair is skipped.</p>' +
        '<div class="chips" style="margin-top:12px">' +
        [2, 3, 4, 5, 6, 7, 8, 9, 10].map(function (n) {
          return '<button class="chipbtn' + (Lt.tableSize === n ? ' on' : '') +
            '" data-act="do-table-size" data-n="' + n + '">' + n + '</button>';
        }).join('') + '</div>',
        [{ label: 'Close', act: 'close' }]);
      return;
    }
    if (act === 'do-table-size') {
      var wantN = Number(el.getAttribute('data-n'));
      var rs = liveCommit(function (L) { return Live.setTableSize(L, wantN); });
      if (rs && !rs.error) { closeModal(); toast(wantN + ' handed.', 'ok'); }
      return;
    }
    if (act === 'randomise') {
      var Lr2 = live();
      if (Lr2.players.length < 2) { toast('Two people at the table, at least.', 'err'); return; }
      if (Lr2.rec) { toast('Finish or drop the hand you are recording first.', 'err'); return; }
      confirmDestroy({
        title: 'Draw the table again?',
        body: 'Everybody gets a new chair and the button is drawn with them — that is what a ' +
          're-draw is. Hands already recorded keep the seats they were played at.',
        list: [], undoable: false, action: 'Draw',
        run: function () {
          var out = liveCommit(function (L) { return Live.randomise(L); });
          if (out && !out.error) window._drawOrder = out.order;
          return out && !out.error ? 'Drawn.' : '';
        }
      });
      return;
    }
    if (act === 'share-seating') return showSeating();
    if (act === 'seating-share-png') return sharePlan('png');
    if (act === 'seating-share-gif') return sharePlan('gif');

    /* ── sharing a hand ── */
    if (act === 'hand-share') return showHandImage(id);
    if (act === 'hand-style') {
      /* Draw it before remembering it: a style that cannot be drawn is not
         a style he chose. */
      var want = el.getAttribute('data-style') === 'table' ? 'table' : 'card';
      var was = store.db.settings.handImageStyle;
      store.db.settings.handImageStyle = want;
      if (showHandImage(window._handShareId)) store.saveSettings();
      else store.db.settings.handImageStyle = was;   /* it never drew */
      return;
    }
    if (act === 'hand-share-png') return shareHandPNG();
    if (act === 'hand-copy-text') {
      var hcd = store.handById(window._handShareId);
      if (!hcd) { closeModal(); toast('That hand is gone.', 'err'); return; }
      copyText(handText(hcd), 'share-raw');
      return;
    }

    /* ── the recorder ── */
    if (act === 'rec-start') {
      var Lr = live();
      if (!Lr) return;
      var seatedNow = Lr.players.filter(function (p) { return !p.cashedOut; });
      if (seatedNow.length < 2) { toast('Two players at the table, at least.', 'err'); return; }
      if (rec()) {
        confirmDestroy({
          title: 'Start a new hand?',
          body: recTitle() + ' is half recorded. Starting another drops it.',
          list: [], undoable: false, action: 'Drop it and start',
          run: function () { clearRec(); startRecording(); return ''; }
        });
        return;
      }
      return startRecording();
    }
    if (act === 'rec-open') { VIEW = { name: 'record', id: null, filter: null, sub: VIEW.sub }; return render(); }

    /* ── a hand from memory ── */
    if (act === 'recall-start') {
      if (rec()) {
        confirmDestroy({
          title: 'Start a new hand?',
          body: recTitle() + ' is half recorded. Starting another drops it.',
          list: [], undoable: false, action: 'Drop it and start',
          run: function () { clearRec(); openModal('Which night?', pickNightForm(), []); return ''; }
        });
        return;
      }
      openModal('Which night?', pickNightForm(), []);
      return;
    }
    if (act === 'recall-night') return startRecall(id, null, null);
    if (act === 'recall-new-night') {
      return startRecall(null, $('rn-date').value, $('rn-venue').value.trim());
    }
    if (act === 'rec-add-seat') {
      var rr = rec();
      var sess2 = rr && rr.sessionId ? store.sessionById(rr.sessionId) : null;
      window._recallPrefer = {};
      if (sess2) (sess2.villains || []).forEach(function (v) { window._recallPrefer[v] = true; });
      openModal('Who else was in it', seatPickerForm(), [
        { label: 'Cancel', act: 'close' },
        { label: 'Add', act: 'do-add-seat', primary: true }
      ], 'ap-name');
      return;
    }
    if (act === 'do-add-seat') {
      var typedS = $('ap-name').value;
      var resS = apResolve({ players: rec().hand.seats }, typedS);
      if (resS.state === 'empty') { toast('Give them a name.', 'err'); return; }
      if (resS.state === 'refused') { toast(resS.msg, 'err'); return; }
      var pidS = null, nameS = resS.name;
      if (resS.state !== 'hero') {
        var eS = Ident.ensure(store.db.players, typedS, { now: now() });
        if (!eS.player) { toast('Give them a name.', 'err'); return; }
        pidS = eS.player.id; nameS = eS.player.name;
        store.savePlayers();
      }
      var addRes = recCommit(function (r) {
        return Rec.addSeat(r, { name: nameS, playerId: pidS, hero: resS.state === 'hero' });
      });
      if (addRes && !addRes.error) { closeModal(); toast(nameS + ' added.', 'ok'); }
      return;
    }
    if (act === 'rec-cancel') {
      confirmDestroy({
        title: 'Drop this hand?',
        body: 'Nothing about the night changes — a hand is only ever an estimate on top of it.',
        list: [], undoable: false, action: 'Drop it',
        run: function () {
          var wasRecall = rec() && rec().recall;
          clearRec();
          VIEW = wasRecall
            ? { name: 'hands', id: null, filter: null, sub: VIEW.sub }
            : { name: 'live', id: null, filter: null, sub: 'hands' };
          return 'Hand dropped.';
        }
      });
      return;
    }
    if (act === 'rec-seat') {
      var seatKey = el.getAttribute('data-seat');
      recCommit(function (r) {
        return Rec.toggleSeat(r, seatKey != null ? Number(seatKey) : Number(id));
      });
      return;
    }
    if (act === 'rec-cast') {
      recCommit(function (r) { return Rec.toggleCast(r, Number(el.getAttribute('data-seat'))); });
      return;
    }
    if (act === 'rec-button') {
      recCommit(function (r) { return Rec.setButton(r, Number(el.getAttribute('data-seat'))); });
      return;
    }
    if (act === 'rec-stakes') {
      var sv = $('rc-sb').value, bv = $('rc-bb').value, av = $('rc-ante').value || 0;
      var stv = $('rc-strad').value;
      var okStakes = recCommit(function (r) {
        var out = Rec.setBlinds(r, sv, bv, av);
        if (out.error) return out;
        /* A night opened without stakes learns them here rather than
           asking again every hand — and the ledger row gets them too. */
        var Ls = live();
        if (Ls && !Ls.stakes) Ls.stakes = r.hand.sb + '/' + r.hand.bb;
        return stv && Number(stv) > 0
          ? Rec.setStraddle(r, straddleType(), stv)
          : Rec.setStraddle(r, null);
      });
      if (okStakes && !okStakes.error) toast('Set.', 'ok');
      return;
    }
    if (act === 'rec-strad-type') {
      /* Toggled in place, never re-rendered: the amount sits in an input
         beside it and a repaint would throw away whatever he has typed
         but not yet set — the same trap the name and note boxes fell into
         in v0.8.0. */
      window._stradType = el.getAttribute('data-type') === 'miss' ? 'miss' : 'utg';
      var btns = document.querySelectorAll('[data-act="rec-strad-type"]');
      for (var bi = 0; bi < btns.length; bi++) {
        btns[bi].setAttribute('aria-pressed',
          btns[bi].getAttribute('data-type') === window._stradType ? 'true' : 'false');
      }
      var rst = rec();
      if (rst && rst.hand.straddle) {
        Rec.setStraddle(rst, window._stradType, rst.hand.straddle.amount);
        saveRec();
      }
      return;
    }
    if (act === 'rec-hole') {
      var hs = Number(el.getAttribute('data-seat'));
      var hr = rec();
      openCards('hole', hs, 2, (Rec.seatById(hr, hs) || {}).name + '’s cards');
      return;
    }
    if (act === 'rec-board') {
      var bst = Number(el.getAttribute('data-street'));
      openCards('board', bst, HR.BOARD_COUNT[bst], 'The ' + ['', 'flop', 'turn', 'river'][bst]);
      return;
    }
    if (act === 'cards-clear') { pick.cards = []; pick.rank = null; return refreshCards(); }
    if (act === 'cards-back') { pick.cards.pop(); pick.rank = null; return refreshCards(); }
    if (act === 'cards-done') {
      var p2 = pick;
      pick = null;
      closeModal();
      recCommit(function (r) {
        return p2.kind === 'board' ? Rec.setBoard(r, p2.key, p2.cards)
          : Rec.setHole(r, p2.key, p2.cards);
      });
      return;
    }
    if (act === 'rec-begin') {
      var began = recCommit(function (r) { return Rec.begin(r); });
      if (began && !began.error) toast('Dealt.', 'ok');
      return;
    }
    if (act === 'rec-act') {
      var a2 = el.getAttribute('data-a');
      var amtEl2 = $('rc-amt');
      var to = amtEl2 ? amtEl2.value : null;
      recCommit(function (r) { return Rec.act(r, a2, to); });
      return;
    }
    if (act === 'rec-undo') {
      var un = recCommit(function (r) { return Rec.undo(r); });
      if (un && un.undone && un.undone.dealt) {
        toast('Back before the deal — who was in it can be changed again.', 'ok');
      }
      return;
    }
    if (act === 'rec-winner') {
      var ws = Number(el.getAttribute('data-seat'));
      recCommit(function (r) {
        var cur = Rec.winners(r).slice();
        var at = cur.indexOf(ws);
        if (at >= 0) cur.splice(at, 1); else cur.push(ws);
        return Rec.setWinners(r, cur);
      });
      return;
    }
    if (act === 'rec-save') return saveHand();

    if (act === 'end-live') {
      var Le = live();
      if (!Le) return;
      var te = Live.totals(Le);
      var hands = liveHandList(Le);
      var listE = [];
      if (Le.players.length) {
        listE.push(plural(Le.players.length, 'player') + ' and ' +
          esc(money(te.buyins)) + ' of buy-ins');
      }
      if (hands.length) listE.push(plural(hands.length, 'hand') + ' recorded tonight');
      if (Le.notes.length) listE.push(plural(Le.notes.length, 'read'));
      if (!listE.length) listE.push('an empty table');
      confirmDestroy({
        title: 'End this night without filing it?',
        body: 'Nothing reaches the ledger — no session, no ledger row, no money. This is for a ' +
          'night opened by mistake or left running. To keep the money, cash everyone out and ' +
          'settle instead.',
        list: listE,
        undoable: false,
        action: 'End it',
        run: function () {
          var ids = hands.map(function (x) { return x.id; });
          store.db.live = null;
          store.saveLive();
          liveUndo = [];
          if (store.db.meta) { store.db.meta.recall = null; store.saveMeta(); }
          VIEW = { name: 'live', id: null, filter: null, sub: 'table' };
          if (!ids.length) return 'Night ended. Nothing was filed.';
          return Promise.all(ids.map(function (x) { return store.deleteHand(x); }))
            .then(function () {
              return 'Night ended — ' + plural(ids.length, 'unfiled hand') + ' went with it.';
            });
        }
      });
      return;
    }
    if (act === 'lock') {
      liveCommit(function (L) { L.locked = true; return {}; });
      toast('Table mode on. Only this screen is reachable.', 'ok');
      return;
    }
    if (act === 'unlock') { liveCommit(function (L) { L.locked = false; return {}; }); return; }
    if (act === 'settle') return openSettle();
    if (act === 'copy-share') return copyText(Live.shareText(live(), { currency: cur() }), 'share-raw');
    if (act === 'share-settle') {
      var sl = live();
      return shareOut(Live.shareText(sl, { currency: cur() }), sl.venue || 'Home game');
    }
    if (act === 'do-settle') return doSettle();

    /* ── destructive ── */
    if (act === 'do-destroy') return runConfirm();
    if (act === 'do-destroy-typed') {
      var word = ($('confirm-word') || {}).value || '';
      if (word.trim().toLowerCase() !== String(window._confirmWord || '').toLowerCase()) {
        toast('Type ' + window._confirmWord + ' to confirm.', 'err');
        return;
      }
      return runConfirm();
    }
    if (act === 'edit-session') {
      var es = store.sessionById(id);
      if (!es) return;
      window._editId = id;
      openModal('Edit this night', editSessionForm(es), [
        { label: 'Cancel', act: 'close' }, { label: 'Save', act: 'save-session', primary: true }
      ]);
      return;
    }
    if (act === 'save-session') return saveSessionEdit(window._editId);
    if (act === 'del-session') {
      var ds = store.sessionById(id);
      if (!ds) return;
      var imp = store.sessionImpact(id);
      var list = [esc(ds.location || 'No venue') + ' · ' + esc(fmtDate(ds.date))];
      if (imp.ledgerRows) list.push(plural(imp.ledgerRows, 'ledger row') + ' for ' +
        plural(imp.players, 'player') + ' (' + esc(signed(imp.net)) + ' between them)');
      if (imp.hands) list.push(plural(imp.hands, 'hand') + ' recorded that night');
      confirmDestroy({
        title: 'Remove this night?',
        body: 'A hand belongs to the night it was played in, so its hands go with it.',
        list: list,
        run: function () {
          return store.deleteSession(id).then(function (r4) {
            VIEW = { name: 'nights', id: null, filter: null, sub: VIEW.sub };
            return 'Night removed — ' + plural(r4.ledgerRows, 'ledger row') + ' and ' +
              plural(r4.hands, 'hand') + ' with it.';
          });
        }
      });
      return;
    }
    if (act === 'del-hand') {
      var dh = store.handById(id);
      if (!dh) return;
      confirmDestroy({
        title: 'Remove this hand?',
        body: 'The night and its counted money are untouched — only the hand goes.',
        list: [esc(handTitle(dh)) + ' · ' + esc(fmtDate(dh.date))],
        run: function () {
          return store.deleteHand(id).then(function () {
            VIEW = { name: 'hands', id: null, filter: null, sub: VIEW.sub };
            return 'Hand removed.';
          });
        }
      });
      return;
    }
    if (act === 'del-player') {
      var dpl = store.playerById(id);
      if (!dpl) return;
      var pi = store.playerImpact(id);
      confirmDestroy({
        title: 'Remove ' + dpl.name + '?',
        body: 'Their recorded hands stay intact — a hand is history. Only the record of them, and ' +
          'their money in your ledger, goes.',
        list: [plural(pi.ledgerRows, 'ledger row') + ' (' + esc(signed(pi.net)) + ')',
        'their seat in ' + plural(pi.hands, 'hand') + ' loses its link'],
        run: function () {
          return store.deletePlayer(id).then(function () {
            VIEW = { name: 'players', id: null, filter: null, sub: VIEW.sub };
            return dpl.name + ' removed.';
          });
        }
      });
      return;
    }
    /* ── the read ─────────────────────────────────────────── */
    if (act === 'edit-read') {
      var rp = store.playerById(id);
      if (!rp) return;
      READ_EDIT = rp.id;
      openModal((Profile.current(rp) ? 'Revise the read on ' : 'A read on ') + rp.name, readForm(rp),
        [{ label: 'Cancel', act: 'close' }, { label: 'Save the read', act: 'save-read', primary: true }]);
      return;
    }
    if (act === 'rd-type') {
      /* Toggled in place. Re-rendering the sheet would throw away every
         word typed into it — the same mistake the straddle toggle made. */
      Array.prototype.forEach.call(document.querySelectorAll('#rd-type .chipbtn'), function (b) {
        var on = b === el;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
      return;
    }
    if (act === 'save-read') {
      var sp2 = READ_EDIT && store.playerById(READ_EDIT);
      if (!sp2) { closeModal(); return; }
      var res2 = Profile.revise(sp2, readFromForm(), { asOf: todayISO(), by: 'you', now: now() });
      if (res2.error) { toast(res2.error, 'err'); return; }
      if (res2.unchanged) { closeModal(); toast('That is the read already — nothing changed.', 'ok'); return; }
      store.savePlayers();
      READ_EDIT = null;
      closeModal(); render();
      toast(res2.first ? 'Read saved.' : 'Read revised — the last one is in their history.', 'ok');
      return;
    }
    if (act === 'peek-read') {
      var pk = store.playerById(id);
      if (!pk) return;
      /* Table mode keeps him on the table, so the way out is not offered
         rather than offered and refused. */
      openModal(pk.name, peekRead(pk) + (locked() ? '' :
        '<div class="dact"><button class="btn btn-ghost" data-act="go" data-to="player" data-id="' +
        esc(pk.id) + '">Everything on ' + esc(pk.name) + ' ' + icon('caret-right', 14) + '</button></div>'), []);
      return;
    }
    if (act === 'export-coach') {
      var hs = store.hands.filter(function (x) { return !x.sentToCoachAt; });
      var dz2 = Profile.exportFor(store, { now: now() });
      if (!hs.length && !dz2.players.length) { toast('Nothing new to send — no hands and nobody observed yet.', 'err'); return; }
      var bundle = CoachOut.bundle(hs, dz2.players.length ? dz2 : null, { now: now(), version: APP_VERSION });
      var fname = 'poker-hub-to-coach-' + todayISO() + '.json';
      shareFile(JSON.stringify(bundle, null, 1), fname, 'Hands for the coach', function (how) {
        if (how === 'cancelled') { toast('Nothing sent.', 'err'); return; }
        var t9 = now();
        hs.forEach(function (x) { x.sentToCoachAt = t9; x.updatedAt = t9; });
        store.db.meta.lastCoachExportAt = t9; store.saveMeta();
        (hs.length ? store.putHands(hs) : Promise.resolve()).then(function () {
          render();
          toast(plural(hs.length, 'hand') + ' and ' + plural(dz2.players.length, 'read') +
            ' sent — import what the coach writes back.', 'ok');
        });
      });
      return;
    }
    if (act === 'export-dossier') {
      var dz = Profile.exportFor(store, { now: now() });
      if (!dz.players.length) { toast('Nobody has been observed yet — there is nothing to send.', 'err'); return; }
      download(JSON.stringify(dz, null, 2), 'poker-hub-reads-' + todayISO() + '.json');
      toast(plural(dz.players.length, 'person') + ' sent — import what the coach writes back.', 'ok');
      return;
    }

    if (act === 'player-settings') {
      var psp = store.playerById(id);
      if (!psp) return;
      openModal(psp.name, playerSettingsForm(psp), [{ label: 'Done', act: 'close', primary: true }]);
      return;
    }
    if (act === 'rename-player') {
      var nv = ($('pl-name') || {}).value || '';
      var rn = Ident.rename(store.db.players, id, nv, now());
      if (rn.error) {
        if (rn.clashId) {
          var other2 = store.playerById(rn.clashId);
          toast(rn.error, 'err');
          /* The answer to "that name is taken" is usually "they are the
             same person", so offer the merge rather than a dead end. */
          confirmDestroy({
            title: 'Is this ' + other2.name + '?',
            action: 'Merge them',
            body: 'There is already a record called ' + esc(other2.name) + '. If that is the ' +
              'same person, merging brings everything across and leaves one record.',
            list: [], undoable: true,
            run: function () {
              return store.mergePlayers(Ident, id, rn.clashId).then(function () {
                Ident.rename(store.db.players, id, nv, now());
                store.savePlayers();
                return 'Merged, and renamed.';
              });
            }
          });
          return;
        }
        toast(rn.error, 'err');
        return;
      }
      if (!rn.changed) { toast('That is already their name.', 'ok'); return; }
      store.savePlayers();
      render();
      openModal(rn.player.name, playerSettingsForm(rn.player),
        [{ label: 'Done', act: 'close', primary: true }]);
      toast('Now ' + rn.player.name + ' — everywhere.', 'ok');
      return;
    }
    if (act === 'drop-alias') {
      var al = el.getAttribute('data-alias');
      var pl2 = store.playerById(id);
      if (!pl2) return;
      Ident.removeAlias(pl2, al);
      store.touch(pl2, now());
      store.savePlayers();
      render();
      openModal(pl2.name, playerSettingsForm(pl2),
        [{ label: 'Done', act: 'close', primary: true }]);
      toast('“' + al + '” is not them.', 'ok');
      return;
    }
    if (act === 'do-merge-players') {
      var dropId = ($('merge-into') || {}).value || '';
      if (!dropId) { toast('Pick the record to merge in first.', 'err'); return; }
      var keep = store.playerById(id), drop = store.playerById(dropId);
      if (!keep || !drop) return;
      var di = store.playerImpact(dropId);
      confirmDestroy({
        title: 'Merge ' + drop.name + ' into ' + keep.name + '?',
        action: 'Merge',
        body: 'Nothing is lost — every night and every hand moves across, and “' + esc(drop.name) +
          '” is kept as an alias so old files still match.',
        list: [plural(di.ledgerRows, 'ledger row') + ' move to ' + esc(keep.name),
        plural(di.hands, 'hand') + ' re-pointed'],
        run: function () {
          return store.mergePlayers(Ident, id, dropId).then(function (mv) {
            VIEW = { name: 'player', id: id, filter: null, sub: VIEW.sub };
            return mv ? 'Merged — ' + plural(mv.ledgerRows, 'ledger row') + ' moved.' : 'Nothing to merge.';
          });
        }
      });
      return;
    }
    if (act === 'clear-all') {
      var c = store.counts();
      $('menu').hidden = true;
      confirmDestroy({
        title: 'Clear everything?',
        action: 'Clear everything',
        typed: 'delete',
        body: 'Every night, hand, player and ledger row on this device.',
        list: [plural(c.sessions, 'night'), plural(c.hands, 'hand'),
        plural(c.players, 'player'), plural(c.ledger, 'ledger row')],
        run: function () {
          return store.clearAll().then(function () {
            liveUndo = [];
            VIEW = { name: 'home', id: null, filter: null, sub: 'table' };
            return 'Cleared. Undo is available if that was wrong.';
          });
        }
      });
      return;
    }

    /* ── settings, data ── */
    if (act === 'save-settings') {
      var st2 = store.db.settings;
      st2.heroName = $('set-hero').value.trim();
      st2.startingBankroll = Number($('set-bankroll').value) || 0;
      st2.defaultLocation = $('set-venue').value.trim();
      st2.defaultStakes = $('set-stakes').value.trim();
      st2.baseCurrency = $('set-cur').value;
      st2.defaultCurrency = $('set-cur').value;
      st2.updatedAt = now();
      store.saveSettings();
      closeModal();
      render();
      toast('Saved.', 'ok');
      return;
    }
    if (act === 'pick-import') return $('file-import').click();
    if (act === 'pick-restore') return $('file-restore').click();
    if (act === 'do-import') {
      Imp.commit(store, pending).then(function (r5) {
        closeModal(); pending = null; pendingRaw = null;
        render();
        toast('Imported. ' + describeReport(r5), 'ok');
      }).catch(function (err) { toast(err.message, 'err'); });
      return;
    }
    if (act === 'backup') {
      if ($('modal') && !$('modal').hidden) closeModal();
      Backup.build(store, { appVersion: APP_VERSION }).then(function (payload) {
        shareFile(JSON.stringify(payload, null, 2), Backup.filename(), 'Poker Hub backup', function (how) {
          if (how === 'cancelled') { toast('Backup not saved.', 'err'); return; }
          store.markBackedUp(); render();
          toast('Backup saved. Put it somewhere that is not this phone.', 'ok');
        });
      });
      return;
    }
    if (act === 'do-merge') {
      Backup.applyMerge(store, window._restorePayload).then(function (r6) {
        closeModal(); render();
        toast(r6.added + ' added, ' + r6.updated + ' updated, ' + r6.kept + ' left alone.', 'ok');
      }).catch(function (err) { toast(err.message, 'err'); });
      return;
    }
    if (act === 'do-replace') {
      Backup.applyReplace(store, window._restorePayload).then(function () {
        closeModal(); render();
        toast('Replaced. Undo is available if that was wrong.', 'ok');
      }).catch(function (err) { toast(err.message, 'err'); });
      return;
    }
    if (act === 'undo') {
      store.undo().then(function (s2) {
        render();
        toast(s2 ? 'Undone — back to before “' + (s2.label || 'that') + '”.' : 'Nothing to undo.',
          s2 ? 'ok' : 'err');
      });
      return;
    }
  }

  function describeReport(r) {
    var bits = [];
    if (r.ledgerRows) bits.push(plural(r.ledgerRows, 'ledger row'));
    if (r.hands) bits.push(plural(r.hands, 'hand'));
    if (r.sessions) bits.push(plural(r.sessions, 'night'));
    if (r.players) bits.push(plural(r.players, 'player'));
    if (r.duplicates) bits.push(r.duplicates + ' skipped as duplicates');
    if (r.kind === 'profiles') {
      if (r.fresh) bits.push(plural(r.fresh, 'new read'));
      if (r.revised) bits.push(plural(r.revised, 'read') + ' revised, the old ' +
        (r.revised === 1 ? 'one' : 'ones') + ' kept in history');
      if (r.unchanged) bits.push(r.unchanged + ' unchanged');
      if (r.skipped) bits.push(r.skipped + ' skipped');
    }
    return (bits.join(', ') || 'Nothing changed') + '.';
  }

  /* ── fitting the screen ────────────────────────────────── */

  /**
   * iOS home-screen apps. On some iOS versions the page already stops
   * above the home-indicator strip yet still reports the strip as a
   * safe-area inset — so a bottom bar padded by it floats, with dead space
   * under its labels and the page short of the screen's foot. Measure what
   * the page actually covers and pad only by the part of the inset that
   * lies inside it. Everywhere else `--safe-bottom` stays the system's.
   */
  var SAFE = { top: 0, bottom: 0, used: 0, view: 0, screen: 0, fixed: false };
  function fitSafeArea() {
    var root = document.documentElement;
    root.style.removeProperty('--safe-bottom');
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
      'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe);
    var top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(probe);
    var standalone = window.navigator.standalone === true ||
      !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var portrait = window.innerHeight >= window.innerWidth;
    var scr = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var view = window.innerHeight;
    /* The status bar is covered (top inset reported), so anything missing
       is at the foot — the strip the inset describes. */
    var missing = Math.max(0, Math.round(scr - view));
    var used = bottom;
    if (standalone && top > 0 && bottom > 0 && missing > 0) used = Math.max(0, bottom - missing);
    if (used !== bottom) root.style.setProperty('--safe-bottom', used + 'px');
    SAFE = { top: Math.round(top), bottom: Math.round(bottom), used: Math.round(used), view: Math.round(view),
      screen: Math.round(scr), width: Math.round(window.innerWidth), fixed: used !== bottom };
  }

  /* ── boot ──────────────────────────────────────────────── */

  function boot() {
    setTheme(themeMode());
    fitSafeArea();
    Charts = window.PHCharts.create({ stats: Stats, esc: esc, money: money });
    store.load().then(function () {
      if (store.db.live) VIEW = { name: 'live', id: null, filter: null, sub: 'table' };
      render();
      document.addEventListener('click', onClick);
      $('file-import').addEventListener('change', function (e) {
        var f = e.target.files[0]; e.target.value = '';
        readFile(f, function (parsed) {
          if (Imp.detect(parsed) === 'hub') return showRestorePreview(parsed);
          pendingRaw = parsed;
          pending = Imp.plan(store, parsed, {});
          pending._opts = {};
          showImportPreview();
        });
      });
      $('file-restore').addEventListener('change', function (e) {
        var f = e.target.files[0]; e.target.value = '';
        readFile(f, function (parsed) {
          if (Imp.detect(parsed) !== 'hub') {
            toast('That is not a poker hub backup. Use “Import a file” for the other apps.', 'err');
            return;
          }
          showRestorePreview(parsed);
        });
      });
      document.addEventListener('input', function (e) {
        if (!e.target) return;
        if (e.target.id === 'ap-name') return refreshAddPlayer();
        if (e.target.id === 'seat-name') return refreshSeatRow(true);
        if (e.target.closest && e.target.closest('#ln-rows, #ln-mine')) {
          var rr = e.target.closest('.rrow');
          if (rr && rr.hasAttribute('data-net') && e.target.getAttribute('data-ln') === 'in') {
            var oi = rr.querySelector('[data-ln="out"]'), bi = num(e.target.value), nt = num(rr.getAttribute('data-net'));
            if (oi && (!oi.value || oi.getAttribute('data-auto') === '1') && String(e.target.value).trim() && bi != null && nt != null) {
              oi.value = String(Settle.round2(bi + nt)); oi.setAttribute('data-auto', '1');
            }
          }
          return lnBalance();
        }
        if (e.target.id === 'ln-tip') return lnBalance();
        /* The name and the note live on the record as they are typed.
           Every commit re-renders, and a re-render rebuilds the whole
           panel from the record — so a field that is only read at save
           time loses whatever was in it the moment he taps a winner
           chip or enters a card. */
        if (e.target.id === 'rc-name' || e.target.id === 'rc-note') {
          var r = rec();
          if (!r) return;
          if (e.target.id === 'rc-name') Rec.setName(r, e.target.value);
          else r.hand.note = e.target.value;
          saveRec();
        }
      });
      document.addEventListener('keydown', onKey);
      document.addEventListener('change', function (e) {
        if (e.target && (e.target.id === 'dealer-name' || e.target.id === 'tip')) saveDealer();
        if (e.target && e.target.id === 'ln-unit') lnApplyPaste(Number(e.target.value));
      });
      document.addEventListener('paste', function (e) {
        if (e.target && e.target.id === 'ln-paste') setTimeout(function () { lnApplyPaste(); }, 0);
      });
      /* The seat row's strip opens with the cursor. On a phone the keyboard
         takes the lower half of the screen, so once it is up the row is
         scrolled to just under the top strip, with the suggestions under
         it in view. It closes again when left empty. */
      document.addEventListener('focusin', function (e) {
        if (!e.target || e.target.id !== 'seat-name') return;
        refreshSeatRow(true);
        setTimeout(function () {
          var row = $('seat-row');
          if (row && document.activeElement && document.activeElement.id === 'seat-name' &&
              row.getBoundingClientRect().top > window.innerHeight * 0.4) {
            row.scrollIntoView({ block: 'start', behavior: 'smooth' });
          }
        }, 350);
      });
      document.addEventListener('focusout', function (e) {
        if (!e.target || (e.target.id !== 'seat-name' && e.target.id !== 'seat-amount')) return;
        setTimeout(function () {
          var inp = $('seat-name'), amt = $('seat-amount'), strip = $('seat-strip'), a = document.activeElement;
          if (!inp || !strip) return;
          if (a && (a.id === 'seat-name' || a.id === 'seat-amount' || (a.closest && a.closest('#seat-strip')))) return;
          if (inp.value.trim() || (amt && String(amt.value).trim())) return;
          strip.hidden = true;
          /* Left empty: fold back to the quiet line, in place, so whatever
             was tapped instead is not redrawn under the finger. */
          var L = live();
          if (L && L.players.length) {
            SEAT_OPEN = false;
            var row = $('seat-row');
            strip.parentNode.removeChild(strip);
            if (row) row.outerHTML = seatQuiet();
          }
        }, 200);
      });
      var rt = null;
      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () { fitSafeArea(); Charts.paint($('app')); }, 150);
      });
      window.addEventListener('orientationchange', function () { setTimeout(fitSafeArea, 300); });
      /* A cold start can report the viewport before it settles. */
      setTimeout(fitSafeArea, 600);
      /* The live clock. One minute is the resolution that matters — a
         second hand on a five-hour session is noise that costs a repaint. */
      tickTimer = setInterval(function () {
        if (VIEW.name !== 'live' || !live() || Live.isPaused(live())) return;
        var el = document.querySelector('.clockbtn .clock');
        if (el) el.textContent = Live.clock(Live.elapsed(live(), now()));
      }, 20000);
      /* Exposed for the browser suite — never used by the UI itself. */
      window.HUB = { store: store, render: render, go: go, version: APP_VERSION, live: live, Live: Live };
    }).catch(function (err) {
      $('app').innerHTML = '<div class="page-state"><h3>Could not open the store</h3><p>' +
        esc(err.message) + '</p><p class="hint">Your data is not lost — it is still on this device. ' +
        'Try reopening the app.</p></div>';
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}());
</script>

<script>
/* Manifest and raster icons are only meaningful over http(s). Injected
   here rather than in <head> so a downloaded file:// copy makes zero
   network requests — it still has its icon, inlined above. */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;
  function link(rel, href, extra){
    var l = document.createElement('link');
    l.rel = rel; l.href = href;
    if (extra) for (var k in extra) l.setAttribute(k, extra[k]);
    document.head.appendChild(l);
  }
  link('manifest', './manifest.webmanifest?v=2');
  /* One touch icon, the real file. iOS does not reliably take a data: URI
     here, and with two links it may fall back to the manifest — so the
     inlined one is repointed rather than joined by a second. The query
     string makes a phone that saw the old icon fetch the new one. */
  var t = document.querySelector('link[rel="apple-touch-icon"]');
  if (!t) { t = document.createElement('link'); t.rel = 'apple-touch-icon'; document.head.appendChild(t); }
  t.setAttribute('sizes', '180x180');
  t.href = './icons/apple-touch-icon.png?v=2';
  link('icon', './icons/favicon-32.png', { sizes: '32x32' });
}());
</script>
